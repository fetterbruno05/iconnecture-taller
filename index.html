                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-300">
                      <thead className="bg-slate-950 uppercase font-bold border-b border-slate-800">
                        <tr><th className="px-3 py-2">Fecha</th><th className="px-3 py-2">Usuario</th><th className="px-3 py-2">Módulo</th><th className="px-3 py-2">Detalle</th></tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {safeArray(logs).slice(0,100).map(l => (
                          <tr key={l.id} className="hover:bg-slate-950/50"><td className="px-3 py-2 font-mono text-slate-500">{new Date(l.fecha).toLocaleString()}</td><td className="px-3 py-2 font-bold text-purple-400">{l.usuario}</td><td className="px-3 py-2 font-bold">{l.modulo}</td><td className="px-3 py-2">{l.detalles}</td></tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* === VISTA 12: CUENTAS === */}
              {vista === 'cuentas' && (
                <div className="space-y-5 max-w-4xl mx-auto fade-in">
                  <header><h2 className="text-xl font-bold text-white">Gestión de Cuentas</h2></header>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm max-w-sm">
                    <h3 className="font-bold text-white mb-4">Cambiar Contraseña</h3>
                    <form onSubmit={cambiarPasswordUsuario} className="space-y-3">
                      <input type="password" required placeholder="Clave actual" value={passActual} onChange={e => setPassActual(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                      <input type="password" required placeholder="Nueva clave" value={passNueva} onChange={e => setPassNueva(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                      {msgPass && <p className="font-bold text-emerald-400 text-[10px]">{msgPass}</p>}
                      <button type="submit" className="w-full bg-slate-800 text-white font-bold py-2 rounded-lg mt-1">Actualizar</button>
                    </form>
                  </div>
                </div>
              )}

              {/* === VISTA 14: CONFIGURACIÓN === */}
              {vista === 'config' && (
                <div className="space-y-5 max-w-4xl mx-auto fade-in">
                  <header><h2 className="text-xl font-bold text-white">Configuración y Backup</h2></header>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 max-w-md space-y-4">
                    <h3 className="font-bold text-white">Restaurar Backup JSON</h3>
                    <p className="text-[10px] text-slate-400">Si tenés un archivo de respaldo, podés subirlo acá para restaurar los datos en la nube:</p>
                    <input type="file" accept=".json" onChange={importarBackupJson} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-slate-300" />
                  </div>
                </div>
              )}

              {/* ==================== 13. PATRIMONIO DE BRUNO (SÚPER PROTEGIDO Y COMPACTO) ==================== */}
              {vista === 'patrimonio' && (() => {
                const totalGastosPersonalesUSD = safeArray(gastosPersonales).reduce((acc, g) => acc + (g.monto_usd || 0), 0);
                const liquidoDisponibleBruno = saldoInicialBruno + comisionesCalculadas.totalHistoricoGanadoBruno - totalGastosPersonalesUSD - totalGastosFijosMensuales;
                const patrimonioTotalConStock = liquidoDisponibleBruno + totalValorStock;

                return (
                  <div className="space-y-5 max-w-5xl mx-auto fade-in">
                    <div className="flex justify-between items-center">
                      <h2 className="text-xl font-bold text-white">Patrimonio Personal 🔒</h2>
                      {patrimonioDesbloqueado && <button onClick={() => { setPatrimonioDesbloqueado(false); setPinInput(''); setPinErrorMsg(''); }} className="bg-rose-600 text-white font-bold px-3 py-1.5 rounded-lg text-[10px]">Bloquear</button>}
                    </div>

                    {!patrimonioDesbloqueado ? (
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-xs mx-auto text-center space-y-3 shadow-xl mt-10">
                        <div className="w-12 h-12 rounded-full bg-slate-950 border border-slate-800 flex items-center justify-center text-slate-500 text-lg mx-auto"><i className="fa-solid fa-lock"></i></div>
                        <form onSubmit={(e) => {
                          e.preventDefault();
                          if (pinInput.trim() === pinPatrimonio) { setPatrimonioDesbloqueado(true); setPinInput(''); setPinErrorMsg(''); } 
                          else { setPinErrorMsg('❌ PIN incorrecto.'); setPinInput(''); }
                        }} className="space-y-2">
                          <input type="password" maxLength="6" value={pinInput} onChange={e => { setPinInput(e.target.value); setPinErrorMsg(''); if (e.target.value === pinPatrimonio) { setPatrimonioDesbloqueado(true); setPinInput(''); } }} placeholder="••••••" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-3 text-center text-2xl font-mono text-white tracking-widest focus:outline-none" />
                          {pinErrorMsg && <p className="text-[10px] font-bold text-rose-400">{pinErrorMsg}</p>}
                          <button type="submit" className="w-full bg-slate-800 text-white font-bold py-2 rounded-lg text-xs mt-1">Ingresar</button>
                        </form>
                      </div>
                    ) : (
                      <div className="space-y-4 fade-in">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                          <div className="bg-slate-900 border border-slate-800 rounded-xl p-3"><p className="text-[9px] text-slate-400 font-bold uppercase mb-0.5">Banco / Caja</p><h3 className="text-xl font-black text-white">{fmtMoney(saldoInicialBruno)}</h3><button onClick={() => setModalEditarSaldoBruno(true)} className="text-[10px] text-purple-400 mt-1"><i className="fa-solid fa-pen"></i> Editar</button></div>
                          <div className="bg-slate-900 border border-slate-800 rounded-xl p-3"><p className="text-[9px] text-slate-400 font-bold uppercase mb-0.5">Comisiones Históricas</p><h3 className="text-xl font-black text-emerald-400">{fmtMoney(comisionesCalculadas.totalHistoricoGanadoBruno)}</h3></div>
                          <div className="bg-slate-900 border border-slate-800 rounded-xl p-3"><p className="text-[9px] text-slate-400 font-bold uppercase mb-0.5">Stock Valor</p><h3 className="text-xl font-black text-purple-400">{fmtMoney(totalValorStock)}</h3></div>
                          <div className="bg-slate-900 border border-emerald-500/40 rounded-xl p-3"><p className="text-[9px] text-emerald-400 font-bold uppercase mb-0.5">Patrimonio Total</p><h3 className="text-xl font-black text-emerald-400">{fmtMoney(patrimonioTotalConStock)}</h3></div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
                            <h3 className="font-bold text-white text-sm">Gasto Diario (ARS o USD)</h3>
                            <form onSubmit={(e) => {
                              e.preventDefault();
                              const c = congelarMonto(formGastoPersonal.monto, formGastoPersonal.moneda);
                              const nuevo = { id: Date.now(), desc: formGastoPersonal.desc, categoria: formGastoPersonal.categoria, monto_usd: c.monto_usd, moneda_original: c.moneda_original, monto_original: c.monto_original, cotizacion_historica: c.cotizacion_historica, fecha: new Date().toISOString() };
                              setGastosPersonales([nuevo, ...safeArray(gastosPersonales)]);
                              setFormGastoPersonal({ ...formGastoPersonal, desc: '', monto: '' });
                            }} className="space-y-2 text-xs">
                              <div className="flex gap-2">
                                <input type="text" required placeholder="Ej: Uber..." value={formGastoPersonal.desc} onChange={e => setFormGastoPersonal({...formGastoPersonal, desc: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white" />
                                <select value={formGastoPersonal.categoria} onChange={e => setFormGastoPersonal({...formGastoPersonal, categoria: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-white">{CATEGORIAS_GASTOS_PERSONALES.map(c => <option key={c} value={c}>{c}</option>)}</select>
                              </div>
                              <div className="flex gap-2">
                                <input type="number" step="any" required placeholder="Monto" value={formGastoPersonal.monto} onChange={e => setFormGastoPersonal({...formGastoPersonal, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white font-mono" />
                                <select value={formGastoPersonal.moneda} onChange={e => setFormGastoPersonal({...formGastoPersonal, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-lg px-1 text-white font-bold"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                                <button type="submit" className="bg-purple-600 text-white font-bold px-3 py-1.5 rounded-lg">Cargar</button>
                              </div>
                              <PreviewBimonetario monto={formGastoPersonal.monto} moneda={formGastoPersonal.moneda} cotizacion={cotizacionDolar} />
                            </form>
                            <div className="space-y-1.5 max-h-48 overflow-y-auto pt-2 border-t border-slate-800 text-xs">
                              {safeArray(gastosPersonales).map(g => (
                                <div key={g.id} className="bg-slate-950 border border-slate-800 rounded-lg p-2.5 flex justify-between items-center"><p className="font-bold text-white">{g.desc} <span className="text-[9px] text-slate-500">({fmtHistorico(g)})</span></p><div className="flex gap-2 items-center"><span className="font-mono text-rose-400 font-bold">-{fmtMoney(g.monto_usd)}</span><button onClick={() => setGastosPersonales(safeArray(gastosPersonales).filter(x => x.id !== g.id))} className="text-slate-500 hover:text-rose-400"><i className="fa-solid fa-trash text-[10px]"></i></button></div></div>
                              ))}
                            </div>
                          </div>

                          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">

                            <form onSubmit={(e) => {
                              e.preventDefault();
                              const c = congelarMonto(formGastoFijo.monto, formGastoFijo.moneda);
                              const nuevo = { id: Date.now(), concepto: formGastoFijo.concepto, tipo: formGastoFijo.tipo, cuotasTotales: formGastoFijo.tipo === 'cuotas' ? parseInt(formGastoFijo.cuotasTotales) || 1 : null, cuotasPagadas: formGastoFijo.tipo === 'cuotas' ? 1 : null, monto_usd: c.monto_usd, moneda_original: c.moneda_original, monto_original: c.monto_original, cotizacion_historica: c.cotizacion_historica };
                              setGastosFijos([nuevo, ...safeArray(gastosFijos)]);
                              setFormGastoFijo({ ...formGastoFijo, concepto: '', monto: '' });
                            }} className="space-y-2 text-xs">
                              <div className="flex gap-2">
                                <input type="text" required placeholder="Ej: Creatina..." value={formGastoFijo.concepto} onChange={e => setFormGastoFijo({...formGastoFijo, concepto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white" />
                                <select value={formGastoFijo.tipo} onChange={e => setFormGastoFijo({...formGastoFijo, tipo: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-white font-bold"><option value="fijo">Fijo</option><option value="cuotas">Cuotas</option></select>
                              </div>
                              <div className="flex gap-2">
                                <input type="number" step="any" required placeholder="Monto" value={formGastoFijo.monto} onChange={e => setFormGastoFijo({...formGastoFijo, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white font-mono" />
                                <select value={formGastoFijo.moneda} onChange={e => setFormGastoFijo({...formGastoFijo, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-lg px-1 text-white font-bold"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                                {formGastoFijo.tipo === 'cuotas' && <input type="number" required placeholder="Meses" value={formGastoFijo.cuotasTotales} onChange={e => setFormGastoFijo({...formGastoFijo, cuotasTotales: e.target.value})} className="w-16 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-white font-mono" />}
                                <button type="submit" className="bg-purple-600 text-white font-bold px-3 py-1.5 rounded-lg">Guardar</button>
                              </div>
                              <PreviewBimonetario monto={formGastoFijo.monto} moneda={formGastoFijo.moneda} cotizacion={cotizacionDolar} />
                            </form>
                            <div className="space-y-1.5 max-h-48 overflow-y-auto pt-2 border-t border-slate-800 text-xs">
                              {safeArray(gastosFijos).map(gf => (
                                <div key={gf.id} className="bg-slate-950 border border-slate-800 rounded-lg p-2.5 flex justify-between items-center">
                                  <div>
                                    <p className="font-bold text-white">{gf.concepto} {gf.tipo === 'cuotas' && <span className="bg-amber-950 text-amber-300 px-1 py-0.5 rounded text-[8px] ml-1">{gf.cuotasPagadas}/{gf.cuotasTotales}</span>}</p>
                                    <p className="text-[9px] text-slate-500 font-mono">{fmtHistorico(gf)}</p>
                                  </div>
                                  <div className="flex items-center gap-2">
                                    <span className="font-mono font-bold text-rose-400">-{fmtMoney(gf.monto_usd)}/mes</span>
                                    {gf.tipo === 'cuotas' && gf.cuotasPagadas < gf.cuotasTotales && <button onClick={() => setGastosFijos(safeArray(gastosFijos).map(x => x.id === gf.id ? { ...x, cuotasPagadas: x.cuotasPagadas + 1 } : x))} className="bg-emerald-950 text-emerald-300 px-1.5 py-0.5 rounded text-[9px] font-bold">+1</button>}
                                    <button onClick={() => setGastosFijos(safeArray(gastosFijos).filter(x => x.id !== gf.id))} className="text-slate-500 hover:text-rose-400"><i className="fa-solid fa-trash text-[10px]"></i></button>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>

                        <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-wrap justify-between items-center gap-3">
                          <div><h3 className="font-bold text-white text-sm">Cambiar PIN Secreto</h3></div>
                          <div className="flex gap-2 text-xs">
                            <input type="password" maxLength="6" placeholder="Nuevo PIN" value={nuevoPinInput} onChange={e => setNuevoPinInput(e.target.value)} className="w-32 bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-white font-mono text-center tracking-widest focus:outline-none" />
                            <button onClick={() => { if (/^\d{6}$/.test(nuevoPinInput)) { setPinPatrimonio(nuevoPinInput); setNuevoPinInput(''); alert('✅ PIN actualizado.'); setPatrimonioDesbloqueado(false); } else { alert('❌ Solo 6 números.'); } }} className="bg-purple-600 text-white font-bold px-3 py-1.5 rounded-lg">Guardar</button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })()}

            </main>
          </div>

          {/* ==================== MODALES COMPACTOS GLOBALES ==================== */}
          {modalCargarReparacion && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50 fade-in">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-lg w-full space-y-3">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <h3 className="font-bold text-white text-sm">Cargar Reparación Realizada</h3>
                  <button onClick={() => setModalCargarReparacion(false)} className="text-slate-400 hover:text-white text-sm"><i className="fa-solid fa-xmark"></i></button>
                </div>
                {safeArray(ordenes).filter(o => o.estado !== 'Entregado').length === 0 ? (
                  <div className="text-center p-4">
                    <p className="text-slate-400 mb-3">No hay equipos pendientes en el taller.</p>
                    <button onClick={() => { setModalCargarReparacion(false); setVista('taller'); }} className="bg-purple-600 text-white px-4 py-2 rounded-lg font-bold">Ir a cargar equipos al Taller</button>
                  </div>
                ) : (
                  <>
                    <select onChange={e => setEquipoSeleccionadoParaReparar(safeArray(ordenes).find(o => o.id === parseInt(e.target.value)))} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white">
                      <option value="">-- Seleccionar Equipo --</option>
                      {safeArray(ordenes).filter(o => o.estado !== 'Entregado').map(o => <option key={o.id} value={o.id}>#ORD-{String(o.id).slice(-4)} | {o.equipo_modelo} ({o.cliente_nombre})</option>)}
                    </select>
                    {equipoSeleccionadoParaReparar && (
                      <div className="space-y-2 pt-1">
                        <div className="bg-slate-950 p-2.5 rounded-lg border border-slate-800"><p className="font-bold text-white">{equipoSeleccionadoParaReparar.equipo_modelo}</p><p className="text-[9px] text-slate-400 mt-0.5">{equipoSeleccionadoParaReparar.cliente_nombre}</p></div>
                        <div className="bg-slate-950 border border-slate-800 rounded-lg p-2.5 space-y-2">
                          <div className="flex justify-between"><label className="font-bold text-slate-400 text-[9px] uppercase">Repuestos (Descuenta Stock)</label><button type="button" onClick={() => setItemsRepuestosCarga([...itemsRepuestosCarga, { tipo: 'stock', stockId: '', nombreManual: '', costoManual: '', monedaManual: 'ARS' }])} className="text-purple-400 text-[9px]">+ Repuesto</button></div>
                          {itemsRepuestosCarga.map((item, idx) => (
                            <div key={idx} className="flex gap-1.5">
                              <select value={item.tipo} onChange={e => { const c = [...itemsRepuestosCarga]; c[idx].tipo = e.target.value; setItemsRepuestosCarga(c); }} className="bg-slate-900 border border-slate-700 rounded px-1 text-white text-[9px]"><option value="stock">Stock</option><option value="manual">Manual</option></select>
                              {item.tipo === 'stock' ? (
                                <select value={item.stockId} onChange={e => { const c = [...itemsRepuestosCarga]; c[idx].stockId = e.target.value; setItemsRepuestosCarga(c); }} className="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-white">
                                  <option value="">-- Sin repuesto --</option>{safeArray(stockRepuestos).filter(s => s.cantidad > 0).map(s => <option key={s.id} value={s.id}>{s.modelo} (${s.costo_unitario_usd})</option>)}
                                </select>
                              ) : (
                                <div className="flex-1 flex gap-1"><input type="text" placeholder="Nombre" value={item.nombreManual} onChange={e => { const c = [...itemsRepuestosCarga]; c[idx].nombreManual = e.target.value; setItemsRepuestosCarga(c); }} className="flex-1 bg-slate-900 border border-slate-700 rounded px-2 text-white" /><input type="number" step="any" placeholder="Costo" value={item.costoManual} onChange={e => { const c = [...itemsRepuestosCarga]; c[idx].costoManual = e.target.value; setItemsRepuestosCarga(c); }} className="w-16 bg-slate-900 border border-slate-700 rounded px-1 font-mono text-white" /><select value={item.monedaManual} onChange={e => { const c = [...itemsRepuestosCarga]; c[idx].monedaManual = e.target.value; setItemsRepuestosCarga(c); }} className="bg-slate-900 border border-slate-700 rounded px-1 text-white text-[9px]"><option value="ARS">ARS</option><option value="USD">USD</option></select></div>
                              )}
                            </div>
                          ))}
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <div><label className="block text-[9px] text-slate-400 font-bold mb-1">Mano Obra</label><div className="flex gap-1"><input type="number" step="any" value={manoObraInput} onChange={e => setManoObraInput(e.target.value)} className="w-2/3 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-white font-mono" /><select value={monedaManoObra} onChange={e => setMonedaManoObra(e.target.value)} className="w-1/3 bg-slate-950 border border-slate-700 rounded-lg px-1 text-white text-[9px]"><option value="ARS">ARS</option><option value="USD">USD</option></select></div><PreviewBimonetario monto={manoObraInput} moneda={monedaManoObra} cotizacion={cotizacionDolar} /></div>
                          <div><label className="block text-[9px] text-slate-400 font-bold mb-1">Estado</label><select value={estadoPagoInicialCarga} onChange={e => setEstadoPagoInicialCarga(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-white font-bold"><option value="Pendiente">Pendiente</option><option value="Pagado">Pagado</option></select></div>
                        </div>
                        <div className="flex gap-2 pt-2"><button onClick={handleConfirmarReparacion} className="flex-1 bg-purple-600 text-white font-bold py-2.5 rounded-lg">Confirmar</button></div>
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>
          )}

          {modalEditStock && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => { e.preventDefault(); const c = congelarMonto(modalEditStock.costoInput, modalEditStock.monedaInput); setStockRepuestos(safeArray(stockRepuestos).map(s => s.id === modalEditStock.id ? { ...s, modelo: modalEditStock.modelo, cantidad: parseInt(modalEditStock.cantidad) || 0, costo_unitario_usd: c.monto_usd, moneda_original: c.moneda_original, monto_original: c.monto_original, cotizacion_historica: c.cotizacion_historica } : s)); setModalEditStock(null); }} className="bg-slate-900 border border-slate-700 rounded-xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-white text-sm">Editar Repuesto</h3>
                <input type="text" required value={modalEditStock.modelo} onChange={e => setModalEditStock({...modalEditStock, modelo: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white" />
                <div className="flex gap-2">
                  <input type="number" required value={modalEditStock.cantidad} onChange={e => setModalEditStock({...modalEditStock, cantidad: e.target.value})} className="w-1/2 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white" />
                  <div className="w-1/2 flex gap-1"><input type="number" step="any" required value={modalEditStock.costoInput} onChange={e => setModalEditStock({...modalEditStock, costoInput: e.target.value})} className="w-2/3 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-white" /><select value={modalEditStock.monedaInput} onChange={e => setModalEditStock({...modalEditStock, monedaInput: e.target.value})} className="w-1/3 bg-slate-950 border border-slate-700 rounded-lg px-1 text-white text-[9px]"><option value="USD">USD</option><option value="ARS">ARS</option></select></div>
                </div>
                <div className="flex gap-2"><button type="submit" className="flex-1 bg-purple-600 text-white font-bold py-2 rounded-lg">Guardar</button><button type="button" onClick={() => setModalEditStock(null)} className="bg-slate-800 text-white font-bold px-3 py-2 rounded-lg">Cancelar</button></div>
              </form>
            </div>
          )}

          {modalPagoParcialDeuda && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => { e.preventDefault(); const c = congelarMonto(formAbonoDeuda.monto, formAbonoDeuda.moneda); const n = Math.max(0, (modalPagoParcialDeuda.monto_usd || 0) - c.monto_usd); setDeudasFavor(safeArray(deudasFavor).map(d => d.id === modalPagoParcialDeuda.id ? { ...d, monto_usd: n, estado: n <= 0.05 ? 'Cobrado' : 'Pendiente' } : d)); setModalPagoParcialDeuda(null); }} className="bg-slate-900 border border-slate-700 rounded-xl p-5 max-w-xs w-full space-y-3">
                <h3 className="font-bold text-white text-sm">Pago Parcial: {modalPagoParcialDeuda.deudor}</h3>
                <div className="flex gap-1.5"><input type="number" step="any" required placeholder="Monto" value={formAbonoDeuda.monto} onChange={e => setFormAbonoDeuda({...formAbonoDeuda, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-white" /><select value={formAbonoDeuda.moneda} onChange={e => setFormAbonoDeuda({...formAbonoDeuda, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-lg px-2 text-white"><option value="ARS">ARS</option><option value="USD">USD</option></select></div>
                <div className="flex gap-2"><button type="submit" className="flex-1 bg-emerald-600 text-white font-bold py-2 rounded-lg">Descontar</button><button type="button" onClick={() => setModalPagoParcialDeuda(null)} className="bg-slate-800 text-white font-bold px-3 py-2 rounded-lg">Cancelar</button></div>
              </form>
            </div>
          )}

          {modalEditarSaldoBruno && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => { e.preventDefault(); const c = congelarMonto(formSaldoBruno.monto, formSaldoBruno.moneda); if (formSaldoBruno.modo === 'establecer') setSaldoInicialBruno(c.monto_usd); else setSaldoInicialBruno(saldoInicialBruno + c.monto_usd); setModalEditarSaldoBruno(false); }} className="bg-slate-900 border border-slate-700 rounded-xl p-5 max-w-xs w-full space-y-3">
                <h3 className="font-bold text-white text-sm">Editar Banco/Caja</h3>
                <select value={formSaldoBruno.modo} onChange={e => setFormSaldoBruno({...formSaldoBruno, modo: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-white font-bold"><option value="establecer">Establecer monto fijo</option><option value="sumar">Sumar al saldo actual</option></select>
                <div className="flex gap-1.5"><input type="number" step="any" required value={formSaldoBruno.monto} onChange={e => setFormSaldoBruno({...formSaldoBruno, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" /><select value={formSaldoBruno.moneda} onChange={e => setFormSaldoBruno({...formSaldoBruno, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-lg px-2 text-white"><option value="ARS">ARS</option><option value="USD">USD</option></select></div>
                <div className="flex gap-2"><button type="submit" className="flex-1 bg-purple-600 text-white font-bold py-2 rounded-lg">Guardar</button><button type="button" onClick={() => setModalEditarSaldoBruno(false)} className="bg-slate-800 text-white font-bold px-3 py-2 rounded-lg">Cancelar</button></div>
              </form>
            </div>
          )}

          {modalDolar && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50 fade-in">
              <div className="bg-slate-900 border border-slate-700 rounded-xl p-5 max-w-xs w-full space-y-4">
                <h3 className="font-bold text-white text-sm text-center">Actualizar Dólar Hoy</h3>
                <input type="number" step="any" value={nuevaCotizacionInput} onChange={e => setNuevaCotizacionInput(e.target.value)} placeholder={cotizacionDolar} className="w-full bg-slate-950 border border-emerald-500 rounded-lg px-3 py-2 text-white font-mono text-center font-bold" />
                <div className="flex gap-2"><button onClick={() => { const v = parseFloat(nuevaCotizacionInput); if (!isNaN(v) && v>0) { setCotizacionDolar(v); setFechaUltimaCotizacion(new Date().toISOString()); setModalDolar(false); setNuevaCotizacionInput(''); } }} className="flex-1 bg-emerald-600 text-white font-bold py-2 rounded-lg">Guardar</button><button onClick={() => setModalDolar(false)} className="bg-slate-800 text-white font-bold px-4 py-2 rounded-lg">Cerrar</button></div>
              </div>
            </div>
          )}
          
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><MainApp /></ErrorBoundary>);
  </script>
</body>
</html>
