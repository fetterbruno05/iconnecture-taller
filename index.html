<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICONNECTURE - Fase 1 (Base Cloud)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen text-xs">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, Component } = React;

    // ==========================================
    // 1. PROTECCIÓN CONTRA CRASHEOS (Error Boundary)
    // ==========================================
    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, errorInfo: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error.message }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex items-center justify-center min-h-screen bg-slate-950 p-6 text-center">
              <div className="bg-rose-950/30 border border-rose-600 rounded-xl p-8 space-y-4">
                <h1 className="text-xl font-bold text-white text-rose-500">Error Visual Detectado</h1>
                <p className="text-slate-300">Tus datos en la nube están a salvo. Recargá la página.</p>
                <button onClick={() => window.location.reload()} className="bg-rose-600 text-white font-bold py-2 px-6 rounded-lg">Recargar</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ==========================================
    // 2. CONFIGURACIÓN EXCLUSIVA DE LA NUBE
    // ==========================================
    const SUPABASE_URL = "https://cmmkxrkbmdzhjzetbddg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FcfhbHbgGG9mV8zp75g1yA_MbUi-jn1";
    let supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const USUARIOS = [
      { id: '1', nombre: 'Bruno', pass: 'bruno123', rol: 'Administrador' },
      { id: '2', nombre: 'Mateo', pass: 'mateo123', rol: 'Socio' },
      { id: '3', nombre: 'Yaco', pass: 'yaco123', rol: 'Empleado' },
      { id: '4', nombre: 'Priscila', pass: 'priscila123', rol: 'Contadora' }
    ];

    // ==========================================
    // 3. APLICACIÓN PRINCIPAL (FASE 1)
    // ==========================================
    function App() {
      const [isLoaded, setIsLoaded] = useState(false);
      const [cloudData, setCloudData] = useState({ ordenes: [] }); // Todo el estado de la DB vive acá
      
      const [usuarioSesion, setUsuarioSesion] = useState(null);
      const [loginUser, setLoginUser] = useState('Bruno');
      const [loginPass, setLoginPass] = useState('');

      // Formulario de ingreso básico para Fase 1
      const [form, setForm] = useState({ cliente: '', modelo: '', falla: '' });

      // LECTURA INICIAL DE LA NUBE (Solo lee, nunca sobreescribe)
      useEffect(() => {
        async function fetchNube() {
          try {
            const { data, error } = await supabase.from('iconnecture_data').select('payload').eq('id', 1).single();
            if (error) throw error;
            if (data && data.payload) {
              setCloudData({ ordenes: Array.isArray(data.payload.ordenes) ? data.payload.ordenes : [] });
            }
          } catch (err) {
            console.error("Error al leer Supabase:", err);
            alert("No se pudo conectar a la nube. Revisá tu internet.");
          }
          setIsLoaded(true);
        }
        fetchNube();
      }, []);

      // ESCRITURA EXPLÍCITA EN LA NUBE
      const guardarEnNube = async (nuevoPayload) => {
        // Actualiza la pantalla rápido
        setCloudData(nuevoPayload);
        // Guarda en la nube de fondo
        const { error } = await supabase.from('iconnecture_data').update({ payload: nuevoPayload }).eq('id', 1);
        if (error) {
          alert("Error crítico al guardar en la nube.");
          console.error(error);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const u = USUARIOS.find(x => x.nombre === loginUser && x.pass === loginPass);
        if (u) setUsuarioSesion(u);
        else alert('Contraseña incorrecta');
      };

      const handleCrearOrden = (e) => {
        e.preventDefault();
        const nuevaOrden = {
          id: Date.now(),
          cliente: form.cliente,
          modelo: form.modelo,
          falla: form.falla,
          estado: 'Recibido',
          fecha: new Date().toISOString()
        };

        // Creamos el nuevo paquete de datos y lo mandamos a la función segura
        const nuevasOrdenes = [nuevaOrden, ...cloudData.ordenes];
        guardarEnNube({ ...cloudData, ordenes: nuevasOrdenes });
        
        setForm({ cliente: '', modelo: '', falla: '' });
      };

      const cambiarEstadoOrden = (idOrden, nuevoEstado) => {
        const nuevasOrdenes = cloudData.ordenes.map(o => o.id === idOrden ? { ...o, estado: nuevoEstado } : o);
        guardarEnNube({ ...cloudData, ordenes: nuevasOrdenes });
      };

      // --- PANTALLAS ---
      if (!isLoaded) return <div className="text-center p-20 text-xl font-bold">Conectando a la Nube...</div>;

      if (!usuarioSesion) {
        return (
          <div className="flex items-center justify-center min-h-screen">
            <form onSubmit={handleLogin} className="bg-slate-900 p-8 rounded-xl border border-slate-800 space-y-4 max-w-sm w-full">
              <h1 className="text-2xl font-black text-center text-white mb-6">ICONNECTURE<br/><span className="text-sm text-purple-400">FASE 1: CORE</span></h1>
              <div className="grid grid-cols-2 gap-2">
                {USUARIOS.map(u => (
                  <button key={u.id} type="button" onClick={() => setLoginUser(u.nombre)} className={`py-2 rounded-lg font-bold border ${loginUser === u.nombre ? 'bg-purple-600 text-white' : 'bg-slate-950 text-slate-400'}`}>
                    {u.nombre}
                  </button>
                ))}
              </div>
              <input type="password" placeholder="Contraseña" required value={loginPass} onChange={e => setLoginPass(e.target.value)} className="w-full bg-slate-950 px-3 py-2 rounded-lg text-center font-mono text-lg text-white" />
              <button type="submit" className="w-full bg-purple-600 text-white font-bold py-3 rounded-lg">Entrar</button>
            </form>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden">
          {/* BARRA LATERAL MÍNIMA */}
          <aside className="w-48 bg-slate-900 border-r border-slate-800 p-4 flex flex-col">
            <h2 className="font-black text-white mb-6 text-center">ICONNECTURE</h2>
            <button className="bg-purple-600 text-white font-bold py-2 rounded-lg mb-auto">Taller y Recepción</button>
            <div className="text-center text-slate-500 pt-4 border-t border-slate-800">
              {usuarioSesion.nombre} <br/>
              <button onClick={() => setUsuarioSesion(null)} className="text-rose-400 mt-2">Salir</button>
            </div>
          </aside>

          {/* ÁREA DE TRABAJO PRINCIPAL */}
          <main className="flex-1 overflow-y-auto p-8">
            <h2 className="text-2xl font-bold text-white mb-6">Recepción de Equipos (Prueba Cloud)</h2>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
              {/* FORMULARIO */}
              <div className="bg-slate-900 p-6 rounded-xl border border-slate-800 h-fit">
                <h3 className="font-bold text-lg mb-4 text-white">Ingresar Equipo</h3>
                <form onSubmit={handleCrearOrden} className="space-y-4">
                  <input type="text" required placeholder="Nombre del Cliente" value={form.cliente} onChange={e => setForm({...form, cliente: e.target.value})} className="w-full bg-slate-950 px-3 py-2 rounded-lg text-white" />
                  <input type="text" required placeholder="Modelo (Ej: iPhone 11)" value={form.modelo} onChange={e => setForm({...form, modelo: e.target.value})} className="w-full bg-slate-950 px-3 py-2 rounded-lg text-white" />
                  <input type="text" required placeholder="Falla / Trabajo a realizar" value={form.falla} onChange={e => setForm({...form, falla: e.target.value})} className="w-full bg-slate-950 px-3 py-2 rounded-lg text-white" />
                  <button type="submit" className="w-full bg-purple-600 text-white font-bold py-2.5 rounded-lg">Guardar en la Nube</button>
                </form>
              </div>

              {/* LISTADO */}
              <div className="space-y-4">
                <h3 className="font-bold text-lg text-white">Equipos Activos ({cloudData.ordenes.filter(o => o.estado !== 'Entregado').length})</h3>
                {cloudData.ordenes.filter(o => o.estado !== 'Entregado').length === 0 ? (
                  <div className="text-slate-500 bg-slate-900 p-6 rounded-xl text-center border border-slate-800">Taller vacío. Probá ingresando un equipo.</div>
                ) : (
                  cloudData.ordenes.filter(o => o.estado !== 'Entregado').map(ord => (
                    <div key={ord.id} className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2 shadow">
                      <div className="flex justify-between items-center">
                        <span className="font-mono text-[10px] text-purple-400">ID: {ord.id}</span>
                        <select 
                          value={ord.estado} 
                          onChange={(e) => cambiarEstadoOrden(ord.id, e.target.value)}
                          className="bg-slate-950 px-2 py-1 rounded text-white font-bold text-[10px]"
                        >
                          <option value="Recibido">Recibido</option>
                          <option value="En Diagnóstico">En Diagnóstico</option>
                          <option value="Listo para Entregar">Listo</option>
                          <option value="Entregado">Entregado</option>
                        </select>
                      </div>
                      <h4 className="font-bold text-white text-base">{ord.modelo}</h4>
                      <p className="text-slate-400">Cliente: {ord.cliente}</p>
                      <p className="bg-slate-950 p-2 rounded text-slate-300">Falla: {ord.falla}</p>
                    </div>
                  ))
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
