<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICONNECTURE - System Suite Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const USUARIOS_DEFAULT = [
      { id: '1', nombre: 'Bruno', pass: 'bruno123', rol: 'Administrador / Técnico' },
      { id: '2', nombre: 'Mateo', pass: 'mateo123', rol: 'Socio' },
      { id: '3', nombre: 'Yaco', pass: 'yaco123', rol: 'Empleado' },
      { id: '4', nombre: 'Priscila', pass: 'priscila123', rol: 'Contadora' }
    ];

    const GREMIOS_DEFAULT = ['ICONNECTURE', 'Nico', 'Román'];

    function App() {
      const [usuarios, setUsuarios] = useState(() => {
        const guardados = JSON.parse(localStorage.getItem('ic_usuarios'));
        if (!guardados || !Array.isArray(guardados)) return USUARIOS_DEFAULT;
        const nombresExistentes = guardados.map(u => u.nombre);
        const faltantes = USUARIOS_DEFAULT.filter(u => !nombresExistentes.includes(u.nombre));
        return [...guardados, ...faltantes];
      });

      const [usuarioSesion, setUsuarioSesion] = useState(null);
      const [loginUser, setLoginUser] = useState('Bruno');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      const [cotizacionDolar, setCotizacionDolar] = useState(() => parseFloat(localStorage.getItem('ic_cotizacion_dolar')) || 1450);
      const [modoOculto, setModoOculto] = useState(false);
      const [modalDolar, setModalDolar] = useState(false);
      const [nuevaCotizacionInput, setNuevaCotizacionInput] = useState('');

      const [urlSupabase, setUrlSupabase] = useState(() => localStorage.getItem('ic_url_supa') || '');
      const [keySupabase, setKeySupabase] = useState(() => localStorage.getItem('ic_key_supa') || '');

      const [vista, setVista] = useState('dashboard');
      const [listaGremios, setListaGremios] = useState(() => JSON.parse(localStorage.getItem('ic_lista_gremios')) || GREMIOS_DEFAULT);

      // Corrección de migración de PIN: Si el PIN guardado en localStorage no tiene 6 dígitos, resetea a 123456
      const [pinPatrimonio, setPinPatrimonio] = useState(() => {
        const guardado = localStorage.getItem('ic_pin_patrimonio');
        if (!guardado || guardado.length !== 6) return '123456';
        return guardado;
      });

      const [patrimonioDesbloqueado, setPatrimonioDesbloqueado] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [nuevoPinInput, setNuevoPinInput] = useState('');
      const [saldoInicialBruno, setSaldoInicialBruno] = useState(() => parseFloat(localStorage.getItem('ic_saldo_inicial_bruno')) || 0);
      const [gastosPersonales, setGastosPersonales] = useState(() => JSON.parse(localStorage.getItem('ic_gastos_personales')) || []);
      const [gastosFijos, setGastosFijos] = useState(() => JSON.parse(localStorage.getItem('ic_gastos_fijos')) || []);

      const [stockRepuestos, setStockRepuestos] = useState(() => JSON.parse(localStorage.getItem('ic_stock_repuestos')) || []);
      const [ordenes, setOrdenes] = useState(() => JSON.parse(localStorage.getItem('ic_ordenes')) || []);
      const [reparaciones, setReparaciones] = useState(() => JSON.parse(localStorage.getItem('ic_reparaciones')) || []);
      const [gastosNegocio, setGastosNegocio] = useState(() => JSON.parse(localStorage.getItem('ic_gastos_negocio')) || []);
      const [deudasFavor, setDeudasFavor] = useState(() => JSON.parse(localStorage.getItem('ic_deudas_favor')) || []);
      const [comisionesPagos, setComisionesPagos] = useState(() => JSON.parse(localStorage.getItem('ic_comisiones_pagos')) || []);
      const [logs, setLogs] = useState(() => JSON.parse(localStorage.getItem('ic_logs')) || []);

      const [modalEditStock, setModalEditStock] = useState(null);
      const [tipoReparacionIngreso, setTipoReparacionIngreso] = useState('minorista');
      const [gremioSeleccionado, setGremioSeleccionado] = useState('ICONNECTURE');
      const [nuevoGremioNombre, setNuevoGremioNombre] = useState('');
      
      const [formIngreso, setFormIngreso] = useState({
        cliente_nombre: '', cliente_telefono: '', cliente_telefono_alt: '',
        equipo_modelo: '', imei_serie: '', prioridad: 'Moderada',
        falla_declarada: '', presupuesto_estimado: '', estado_fisico: ''
      });

      const [modalCargarReparacion, setModalCargarReparacion] = useState(false);
      const [equipoSeleccionadoParaReparar, setEquipoSeleccionadoParaReparar] = useState(null);
      const [repuestoStockSeleccionadoId, setRepuestoStockSeleccionadoId] = useState('');
      const [manoObraInput, setManoObraInput] = useState('');
      const [medioPagoInput, setMedioPagoInput] = useState('Efectivo USD');
      const [monedaCarga, setMonedaCarga] = useState('USD');

      const [passActual, setPassActual] = useState('');
      const [passNueva, setPassNueva] = useState('');
      const [msgPass, setMsgPass] = useState('');
      const [filtroUsuarioLog, setFiltroUsuarioLog] = useState('todos');
      const [filtroFechaLogDia, setFiltroFechaLogDia] = useState('');

      useEffect(() => { localStorage.setItem('ic_usuarios', JSON.stringify(usuarios)); }, [usuarios]);
      useEffect(() => { localStorage.setItem('ic_ordenes', JSON.stringify(ordenes)); }, [ordenes]);
      useEffect(() => { localStorage.setItem('ic_reparaciones', JSON.stringify(reparaciones)); }, [reparaciones]);
      useEffect(() => { localStorage.setItem('ic_gastos_negocio', JSON.stringify(gastosNegocio)); }, [gastosNegocio]);
      useEffect(() => { localStorage.setItem('ic_deudas_favor', JSON.stringify(deudasFavor)); }, [deudasFavor]);
      useEffect(() => { localStorage.setItem('ic_comisiones_pagos', JSON.stringify(comisionesPagos)); }, [comisionesPagos]);
      useEffect(() => { localStorage.setItem('ic_logs', JSON.stringify(logs)); }, [logs]);
      useEffect(() => { localStorage.setItem('ic_gastos_personales', JSON.stringify(gastosPersonales)); }, [gastosPersonales]);
      useEffect(() => { localStorage.setItem('ic_gastos_fijos', JSON.stringify(gastosFijos)); }, [gastosFijos]);
      useEffect(() => { localStorage.setItem('ic_stock_repuestos', JSON.stringify(stockRepuestos)); }, [stockRepuestos]);
      useEffect(() => { localStorage.setItem('ic_lista_gremios', JSON.stringify(listaGremios)); }, [listaGremios]);
      useEffect(() => { localStorage.setItem('ic_cotizacion_dolar', cotizacionDolar.toString()); }, [cotizacionDolar]);
      useEffect(() => { localStorage.setItem('ic_pin_patrimonio', pinPatrimonio); }, [pinPatrimonio]);
      useEffect(() => { localStorage.setItem('ic_saldo_inicial_bruno', saldoInicialBruno.toString()); }, [saldoInicialBruno]);

      const registrarLog = (modulo, accion, detalles) => {
        const nuevo = {
          id: Date.now(),
          usuario: usuarioSesion ? usuarioSesion.nombre : 'Sistema',
          modulo, accion, detalles,
          fecha: new Date().toISOString()
        };
        setLogs(prev => [nuevo, ...prev]);
      };

      const fmtMoney = (amountUSD, currency = 'USD') => {
        if (modoOculto) return '*** ' + currency;
        if (currency === 'ARS') {
          const ars = amountUSD * cotizacionDolar;
          return `$ ${ars.toLocaleString('es-AR', { maximumFractionDigits: 0 })} ARS`;
        }
        return `$ ${parseFloat(amountUSD || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
      };

      const esImeiValido = (imei) => {
        if (!imei) return true;
        return /^\d{15}$/.test(imei);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const found = usuarios.find(u => u.nombre === loginUser);
        if (found && found.pass === loginPass) {
          setUsuarioSesion(found);
          setLoginError('');
          setLoginPass('');
          registrarLog('Seguridad', 'Inicio de Sesión', `Acceso de ${found.nombre}`);
        } else {
          setLoginError('Contraseña incorrecta');
        }
      };

      const cambiarPasswordUsuario = (e) => {
        e.preventDefault();
        if (passActual !== usuarioSesion.pass) {
          setMsgPass('❌ La contraseña actual es incorrecta.');
          return;
        }
        if (!passNueva || passNueva.length < 4) {
          setMsgPass('❌ La contraseña debe tener al menos 4 caracteres.');
          return;
        }
        const actualizados = usuarios.map(u => u.nombre === usuarioSesion.nombre ? { ...u, pass: passNueva } : u);
        setUsuarios(actualizados);
        setUsuarioSesion({ ...usuarioSesion, pass: passNueva });
        setPassActual('');
        setPassNueva('');
        setMsgPass('✅ Contraseña actualizada con éxito.');
        registrarLog('Seguridad', 'Cambio Clave', `${usuarioSesion.nombre} cambió su contraseña.`);
      };

      const handleGuardarIngreso = (e) => {
        e.preventDefault();
        if (formIngreso.imei_serie && !esImeiValido(formIngreso.imei_serie)) {
          alert('El IMEI debe contener exactamente 15 dígitos numéricos sin letras ni espacios.');
          return;
        }

        let clienteNombreFinal = formIngreso.cliente_nombre;
        let clienteTelFinal = formIngreso.cliente_telefono;

        if (tipoReparacionIngreso === 'gremio') {
          if (gremioSeleccionado === 'NUEVO') {
            if (!nuevoGremioNombre.trim()) {
              alert('Ingresá el nombre del nuevo gremio.');
              return;
            }
            clienteNombreFinal = `Gremio: ${nuevoGremioNombre.trim()}`;
            if (!listaGremios.includes(nuevoGremioNombre.trim())) {
              setListaGremios([...listaGremios, nuevoGremioNombre.trim()]);
            }
          } else {
            clienteNombreFinal = `Gremio: ${gremioSeleccionado}`;
          }
          clienteTelFinal = 'Gremio / Taller';
        }

        const antecedente = ordenes.find(o => o.imei_serie && o.imei_serie === formIngreso.imei_serie);
        if (antecedente) {
          alert(`⚠️ ALERTA DE REINGRESO: Este IMEI ya ingresó el ${new Date(antecedente.fecha_ingreso).toLocaleDateString()}.`);
        }

        const nuevaOrden = {
          id: Date.now(),
          tipo_cliente: tipoReparacionIngreso,
          cliente_nombre: clienteNombreFinal,
          cliente_telefono: clienteTelFinal,
          cliente_telefono_alt: tipoReparacionIngreso === 'minorista' ? formIngreso.cliente_telefono_alt : 'N/A',
          equipo_modelo: formIngreso.equipo_modelo,
          imei_serie: formIngreso.imei_serie,
          prioridad: formIngreso.prioridad,
          falla_declarada: formIngreso.falla_declarada,
          presupuesto_estimado: formIngreso.presupuesto_estimado,
          estado_fisico: formIngreso.estado_fisico,
          estado: 'Recibido',
          fecha_ingreso: new Date().toISOString()
        };

        setOrdenes([nuevaOrden, ...ordenes]);
        registrarLog('Taller', 'Nuevo Ingreso', `${formIngreso.equipo_modelo} - ${clienteNombreFinal}`);

        setFormIngreso({
          cliente_nombre: '', cliente_telefono: '', cliente_telefono_alt: '',
          equipo_modelo: '', imei_serie: '', prioridad: 'Moderada',
          falla_declarada: '', presupuesto_estimado: '', estado_fisico: ''
        });
        setNuevoGremioNombre('');
        alert('✅ Equipo ingresado al taller.');
      };

      const handleConfirmarReparacion = () => {
        if (!equipoSeleccionadoParaReparar) return;

        let costoRepuestoVal = 0;
        let repuestoNombre = 'Sin repuesto / Mantenimiento';

        if (repuestoStockSeleccionadoId) {
          const itemStock = stockRepuestos.find(s => s.id === parseInt(repuestoStockSeleccionadoId));
          if (itemStock) {
            costoRepuestoVal = itemStock.costo_unitario_usd;
            repuestoNombre = `${itemStock.categoria} (${itemStock.modelo})`;

            setStockRepuestos(stockRepuestos.map(s => {
              if (s.id === itemStock.id) {
                return { ...s, cantidad: Math.max(0, s.cantidad - 1) };
              }
              return s;
            }));
            registrarLog('Stock', 'Descuento por Reparación', `Descontada 1 unidad de ${itemStock.modelo}`);
          }
        }

        const manoObraVal = parseFloat(manoObraInput) || 0;
        let totalCobrado = costoRepuestoVal + manoObraVal;

        if (monedaCarga === 'ARS') totalCobrado = totalCobrado / cotizacionDolar;
        const gananciaNeta = manoObraVal / (monedaCarga === 'ARS' ? cotizacionDolar : 1);

        const nuevaRep = {
          id: Date.now(),
          orden_id: equipoSeleccionadoParaReparar.id,
          cliente_nombre: equipoSeleccionadoParaReparar.cliente_nombre,
          cliente_telefono: equipoSeleccionadoParaReparar.cliente_telefono,
          equipo_modelo: equipoSeleccionadoParaReparar.equipo_modelo,
          imei_serie: equipoSeleccionadoParaReparar.imei_serie,
          tipo_cliente: equipoSeleccionadoParaReparar.tipo_cliente,
          tecnico: usuarioSesion.nombre,
          repuestos: [{ nombre: repuestoNombre, costo: costoRepuestoVal }],
          costo_repuestos_usd: costoRepuestoVal,
          mano_obra_usd: gananciaNeta,
          total_usd: totalCobrado,
          medio_pago: medioPagoInput,
          estado_pago: 'Pendiente',
          fecha_completado: new Date().toISOString(),
          garantia_dias: 30
        };

        setReparaciones([nuevaRep, ...reparaciones]);
        setOrdenes(ordenes.map(o => o.id === equipoSeleccionadoParaReparar.id ? { ...o, estado: 'Listo para Entregar' } : o));
        registrarLog('Reparaciones', 'Carga Trabajo', `Reparación cargada para ${nuevaRep.equipo_modelo}`);

        setEquipoSeleccionadoParaReparar(null);
        setModalCargarReparacion(false);
        setRepuestoStockSeleccionadoId('');
        setManoObraInput('');
      };

      const marcarPagadoReparacion = (id) => {
        const rep = reparaciones.find(r => r.id === id);
        if (!rep) return;
        setReparaciones(reparaciones.map(r => r.id === id ? { ...r, estado_pago: 'Pagado', fecha_pago: new Date().toISOString() } : r));
        setOrdenes(ordenes.map(o => o.id === rep.orden_id ? { ...o, estado: 'Entregado', fecha_entrega: new Date().toISOString() } : o));
        registrarLog('Finanzas', 'Cobro Reparación', `Cobro registrado para ${rep.equipo_modelo}`);
      };

      const comisionesCalculadas = useMemo(() => {
        let saldoBruno = 0;
        reparaciones.filter(r => r.estado_pago === 'Pagado').forEach(r => {
          if (r.tipo_cliente === 'gremio') {
            saldoBruno += r.mano_obra_usd;
          } else {
            saldoBruno += (r.mano_obra_usd * 0.5);
          }
        });

        const totalPagado = comisionesPagos.reduce((acc, p) => acc + (parseFloat(p.monto_usd) || 0), 0);
        saldoBruno -= totalPagado;

        return {
          saldoFinal: saldoBruno,
          totalHistoricoGanado: reparaciones.filter(r => r.estado_pago === 'Pagado').reduce((acc, r) => acc + (r.tipo_cliente === 'gremio' ? r.mano_obra_usd : r.mano_obra_usd * 0.5), 0)
        };
      }, [reparaciones, comisionesPagos]);

      const totalValorStock = useMemo(() => {
        return stockRepuestos.reduce((acc, s) => acc + ((parseFloat(s.cantidad) || 0) * (parseFloat(s.costo_unitario_usd) || 0)), 0);
      }, [stockRepuestos]);

      const totalGastosFijosMensuales = useMemo(() => {
        return gastosFijos.reduce((acc, g) => acc + (parseFloat(g.monto_usd) || 0), 0);
      }, [gastosFijos]);

      if (!usuarioSesion) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 px-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-16 h-16 rounded-2xl bg-purple-600 flex items-center justify-center text-white font-black text-2xl mx-auto shadow-lg shadow-purple-900/50">
                  IC
                </div>
                <h1 className="text-2xl font-bold text-white tracking-tight">ICONNECTURE</h1>
                <p className="text-xs text-purple-400 font-semibold tracking-wider uppercase">Servicio Técnico & Gestión Integrada</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4 pt-2">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-2">Seleccionar Usuario</label>
                  <div className="grid grid-cols-2 gap-2.5">
                    {usuarios.map(u => (
                      <button
                        key={u.id}
                        type="button"
                        onClick={() => { setLoginUser(u.nombre); setLoginError(''); }}
                        className={`py-3 px-3 rounded-xl border text-xs font-semibold transition flex flex-col items-center justify-center ${
                          loginUser === u.nombre
                            ? 'bg-purple-600/20 border-purple-500 text-purple-300 shadow-md'
                            : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'
                        }`}
                      >
                        <span className="font-bold text-white text-sm">{u.nombre}</span>
                        <span className="text-[10px] text-slate-400 mt-0.5">{u.rol}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Contraseña de {loginUser}</label>
                  <input
                    type="password"
                    required
                    value={loginPass}
                    onChange={e => setLoginPass(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 text-center font-mono text-lg"
                  />
                </div>

                {loginError && (
                  <p className="text-xs text-rose-400 font-medium text-center bg-rose-950/40 border border-rose-900/50 py-2 rounded-lg">
                    {loginError}
                  </p>
                )}

                <button
                  type="submit"
                  className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-purple-950 text-sm"
                >
                  Ingresar al Sistema
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden">
          {/* BARRA LATERAL AMPLIADA */}
          <aside className="w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-5 overflow-y-auto hide-scrollbar">
            <div>
              <div className="flex items-center gap-3 px-2 py-3 mb-5 border-b border-slate-800">
                <div className="w-10 h-10 rounded-2xl bg-purple-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-purple-900/50">
                  IC
                </div>
                <div>
                  <h1 className="font-bold text-lg text-white leading-tight">ICONNECTURE</h1>
                  <p className="text-xs text-purple-400 font-semibold">Servicio Técnico</p>
                </div>
              </div>

              <nav className="space-y-1.5">
                {[
                  { id: 'dashboard', label: 'Resumen General', icon: 'fa-chart-pie' },
                  { id: 'taller', label: 'Taller & Recepción', icon: 'fa-wrench' },
                  { id: 'reparaciones', label: 'Cargar Reparación', icon: 'fa-microchip' },
                  { id: 'garantias', label: 'Control Garantías', icon: 'fa-shield-halved' },
                  { id: 'stock', label: 'Stock Repuestos', icon: 'fa-boxes-stacked' },
                  { id: 'gastos', label: 'Gastos del Negocio', icon: 'fa-receipt' },
                  { id: 'medeben', label: 'Me Deben (Cuentas)', icon: 'fa-hand-holding-dollar' },
                  { id: 'comisiones', label: 'Comisiones Bruno', icon: 'fa-wallet' },
                  { id: 'socios', label: 'Socios y Reparto', icon: 'fa-users-gear' },
                  { id: 'cuentas', label: 'Gestión Cuentas', icon: 'fa-user-lock' },
                  { id: 'estadisticas', label: 'Estadísticas Globales', icon: 'fa-chart-line' },
                  { id: 'actividad', label: 'Registro Actividad', icon: 'fa-clock-rotate-left' },
                  { id: 'patrimonio', label: 'Patrimonio Bruno 🔒', icon: 'fa-lock' },
                  { id: 'config', label: 'Configuración API', icon: 'fa-gear' },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setVista(item.id)}
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${
                      vista === item.id 
                        ? 'bg-purple-600 text-white shadow-lg shadow-purple-950/80 scale-[1.02]' 
                        : 'text-slate-400 hover:bg-slate-800/80 hover:text-slate-200'
                    }`}
                  >
                    <i className={`fa-solid ${item.icon} w-5 text-center text-base`}></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="border-t border-slate-800 pt-4 space-y-2">
              <div className="flex items-center justify-between px-2">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-full bg-purple-950 border border-purple-500/50 flex items-center justify-center text-purple-300 font-black text-xs">
                    {usuarioSesion.nombre.charAt(0)}
                  </div>
                  <div>
                    <p className="text-sm font-bold text-white leading-tight">{usuarioSesion.nombre}</p>
                    <p className="text-[11px] text-slate-400">{usuarioSesion.rol}</p>
                  </div>
                </div>

                      <p className="text-slate-400 text-sm">Registro de mano de obra y descuento automático de repuestos</p>
                    </div>
                    <button onClick={() => setModalCargarReparacion(true)} className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs flex items-center gap-2">
                      <i className="fa-solid fa-plus"></i> Cargar Reparación Realizada
                    </button>
                  </header>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                    {reparaciones.length === 0 ? (
                      <div className="text-center py-8 text-slate-500 text-xs">
                        No hay reparaciones cargadas todavía. Hacé clic en "+ Cargar Reparación Realizada" arriba.
                      </div>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs text-slate-300">
                          <thead className="bg-slate-950 text-slate-400 uppercase font-semibold border-b border-slate-800">
                            <tr>
                              <th className="px-4 py-3">Equipo / Cliente</th>
                              <th className="px-4 py-3">Tipo</th>
                              <th className="px-4 py-3">Repuesto Utilizado</th>
                              <th className="px-4 py-3">Mano de Obra</th>
                              <th className="px-4 py-3">Total Cobrado</th>
                              <th className="px-4 py-3">Estado Pago</th>
                              <th className="px-4 py-3">Acción</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800">
                            {reparaciones.map(r => (
                              <tr key={r.id}>
                                <td className="px-4 py-3"><strong>{r.equipo_modelo}</strong> ({r.cliente_nombre})</td>
                                <td className="px-4 py-3 uppercase font-bold text-[10px]">{r.tipo_cliente}</td>
                                <td className="px-4 py-3 text-slate-400">{r.repuestos && r.repuestos[0] ? r.repuestos[0].nombre : 'Sin repuesto'}</td>
                                <td className="px-4 py-3 font-mono text-emerald-400">{fmtMoney(r.mano_obra_usd)}</td>
                                <td className="px-4 py-3 font-mono font-bold text-white">{fmtMoney(r.total_usd)}</td>
                                <td className="px-4 py-3">
                                  <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${r.estado_pago === 'Pagado' ? 'bg-emerald-950 text-emerald-400' : 'bg-amber-950 text-amber-400'}`}>
                                    {r.estado_pago}
                                  </span>
                                </td>
                                <td className="px-4 py-3">
                                  {r.estado_pago === 'Pendiente' && (
                                    <button onClick={() => marcarPagadoReparacion(r.id)} className="bg-emerald-600 text-white px-2.5 py-1 rounded text-[11px] font-bold">Marcar Pagado</button>
                                  )}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* GARANTÍAS */}
              {vista === 'garantias' && (
                <div className="space-y-6">
                  <header><h2 className="text-2xl font-bold text-white">Control de Garantías</h2></header>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {reparaciones.filter(r => r.estado_pago === 'Pagado').length === 0 ? (
                      <div className="col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-500">
                        No hay garantías activas de equipos entregados.
                      </div>
                    ) : (
                      reparaciones.filter(r => r.estado_pago === 'Pagado').map(r => {
                        const entrega = new Date(r.fecha_pago || r.fecha_completado);
                        const hoy = new Date();
                        const diasPasados = Math.floor((hoy - entrega) / (1000 * 60 * 60 * 24));
                        const restantes = r.garantia_dias - diasPasados;
                        const estaVigente = restantes >= 0;

                        return (
                          <div key={r.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex justify-between items-center">
                            <div className="space-y-1">
                              <span className="text-[10px] text-purple-400 font-mono">IMEI: {r.imei_serie || 'N/A'}</span>
                              <h4 className="font-bold text-white text-base">{r.equipo_modelo}</h4>
                              <p className="text-xs text-slate-400">Cliente: {r.cliente_nombre}</p>
                            </div>
                            <div className="text-right">
                              <span className={`text-sm font-bold ${estaVigente ? 'text-emerald-400' : 'text-rose-500'}`}>
                                {estaVigente ? `${restantes} Días Restantes` : 'Garantía Finalizada'}
                              </span>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* MODAL EDITAR ITEM DE STOCK */}
          {modalEditStock && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <form onSubmit={(e) => {
                e.preventDefault();
                setStockRepuestos(stockRepuestos.map(s => s.id === modalEditStock.id ? modalEditStock : s));
                setModalEditStock(null);
              }} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4 text-xs">
                <h3 className="font-bold text-white text-base">Editar Repuesto en Stock</h3>
                <div>
                  <label className="block text-slate-400 mb-1 font-semibold">Modelo / Detalle</label>
                  <input type="text" required value={modalEditStock.modelo} onChange={e => setModalEditStock({ ...modalEditStock, modelo: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Cantidad</label>
                    <input type="number" required value={modalEditStock.cantidad} onChange={e => setModalEditStock({ ...modalEditStock, cantidad: parseInt(e.target.value) || 0 })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white font-mono" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Costo Unit. ($ USD)</label>
                    <input type="number" step="any" required value={modalEditStock.costo_unitario_usd} onChange={e => setModalEditStock({ ...modalEditStock, costo_unitario_usd: parseFloat(e.target.value) || 0 })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white font-mono" />
                  </div>
                </div>
                <div className="flex gap-2 pt-2">
                  <button type="submit" className="flex-1 bg-purple-600 text-white font-bold py-2.5 rounded-xl">Guardar Cambios</button>
                  <button type="button" onClick={() => setModalEditStock(null)} className="bg-slate-800 text-slate-300 font-bold px-4 py-2.5 rounded-xl">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL CARGAR REPARACIÓN */}
          {modalCargarReparacion && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-lg w-full space-y-4 max-h-[90vh] overflow-y-auto text-xs">
                <h3 className="font-bold text-white text-lg border-b border-slate-800 pb-2">Cargar Reparación Realizada</h3>
                
                <div>
                  <label className="block text-slate-400 mb-1 font-semibold">1. Seleccionar Equipo en Taller</label>
                  {ordenes.filter(o => o.estado !== 'Entregado').length === 0 ? (
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-center text-slate-400 space-y-2">
                      <p>⚠️ No hay equipos ingresados en taller actualmente.</p>
                      <button type="button" onClick={() => { setModalCargarReparacion(false); setVista('taller'); }} className="text-purple-400 underline font-bold">
                        Ir a Taller para Ingresar un Equipo
                      </button>
                    </div>
                  ) : (
                    <select onChange={e => setEquipoSeleccionadoParaReparar(ordenes.find(o => o.id === parseInt(e.target.value)))} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white">
                      <option value="">-- Elegir Equipo --</option>
                      {ordenes.filter(o => o.estado !== 'Entregado').map(o => (
                        <option key={o.id} value={o.id}>{o.equipo_modelo} - {o.cliente_nombre}</option>
                      ))}
                    </select>
                  )}
                </div>

                {equipoSeleccionadoParaReparar && (
                  <div className="space-y-3 pt-2">
                    <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                      <p className="font-bold text-white text-sm">{equipoSeleccionadoParaReparar.equipo_modelo}</p>
                      <p className="text-[11px] text-slate-400">Cliente: {equipoSeleccionadoParaReparar.cliente_nombre} ({equipoSeleccionadoParaReparar.tipo_cliente.toUpperCase()})</p>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">2. Repuesto Utilizado (Descuenta 1 un. de Stock)</label>
                      <select
                        value={repuestoStockSeleccionadoId}
                        onChange={e => setRepuestoStockSeleccionadoId(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white"
                      >
                        <option value="">-- Sin Repuesto / Trabajo de Mantenimiento --</option>
                        {stockRepuestos.map(s => (
                          <option key={s.id} value={s.id}>
                            {s.categoria}: {s.modelo} (Disponibles: {s.cantidad} u. | Costo: ${s.costo_unitario_usd} USD)
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">3. Mano de Obra (Ganancia Neta)</label>
                      <input type="number" value={manoObraInput} onChange={e => setManoObraInput(e.target.value)} placeholder="0.00" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white font-mono" />
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button onClick={handleConfirmarReparacion} className="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition">Confirmar Reparación</button>
                      <button onClick={() => setModalCargarReparacion(false)} className="bg-slate-800 text-slate-300 font-bold px-4 py-3 rounded-xl">Cancelar</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL EDITAR COTIZACIÓN DÓLAR */}
          {modalDolar && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4">
                <h3 className="font-bold text-white text-lg">Actualizar Dólar Hoy</h3>
                <input type="number" placeholder="Ej: 1480" value={nuevaCotizacionInput} onChange={e => setNuevaCotizacionInput(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white font-mono text-center text-lg" />
                <div className="flex gap-2">
                  <button onClick={() => { if (nuevaCotizacionInput) { setCotizacionDolar(parseFloat(nuevaCotizacionInput)); setModalDolar(false); setNuevaCotizacionInput(''); } }} className="flex-1 bg-purple-600 text-white font-bold py-2.5 rounded-xl text-xs">Guardar</button>
                  <button onClick={() => setModalDolar(false)} className="bg-slate-800 text-slate-300 font-bold px-4 py-2.5 rounded-xl text-xs">Cancelar</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
