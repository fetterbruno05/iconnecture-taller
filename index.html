<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICONNECTURE - System Suite Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Lista Maestra de Usuarios
    const USUARIOS_DEFAULT = [
      { id: '1', nombre: 'Bruno', pass: 'bruno123', rol: 'Administrador / Técnico' },
      { id: '2', nombre: 'Mateo', pass: 'mateo123', rol: 'Socio' },
      { id: '3', nombre: 'Yaco', pass: 'yaco123', rol: 'Empleado' },
      { id: '4', nombre: 'Priscila', pass: 'priscila123', rol: 'Contadora' }
    ];

    // Clientes Gremio Predeterminados
    const GREMIOS_DEFAULT = ['ICONNECTURE', 'Nico', 'Román'];

    function App() {
      // Garantizar que los 4 usuarios existan incluso si localStorage tiene la lista vieja
      const [usuarios, setUsuarios] = useState(() => {
        const guardados = JSON.parse(localStorage.getItem('ic_usuarios'));
        if (!guardados || !Array.isArray(guardados)) return USUARIOS_DEFAULT;
        const nombresExistentes = guardados.map(u => u.nombre);
        const faltantes = USUARIOS_DEFAULT.filter(u => !nombresExistentes.includes(u.nombre));
        return [...guardados, ...faltantes];
      });

      const [usuarioSesion, setUsuarioSesion] = useState(null);
      const [loginUser, setLoginUser] = useState('Bruno');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      // Topbar & Privacidad
      const [cotizacionDolar, setCotizacionDolar] = useState(() => parseFloat(localStorage.getItem('ic_cotizacion_dolar')) || 1450);
      const [modoOculto, setModoOculto] = useState(false);
      const [modalDolar, setModalDolar] = useState(false);
      const [nuevaCotizacionInput, setNuevaCotizacionInput] = useState('');

      // Navegación
      const [vista, setVista] = useState('dashboard');

      // Clientes Gremio Lista
      const [listaGremios, setListaGremios] = useState(() => JSON.parse(localStorage.getItem('ic_lista_gremios')) || GREMIOS_DEFAULT);

      // Patrimonio (PIN de 6 dígitos)
      const [pinPatrimonio, setPinPatrimonio] = useState(() => localStorage.getItem('ic_pin_patrimonio') || '123456');
      const [patrimonioDesbloqueado, setPatrimonioDesbloqueado] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [nuevoPinInput, setNuevoPinInput] = useState('');
      const [saldoInicialBruno, setSaldoInicialBruno] = useState(() => parseFloat(localStorage.getItem('ic_saldo_inicial_bruno')) || 0);
      const [gastosPersonales, setGastosPersonales] = useState(() => JSON.parse(localStorage.getItem('ic_gastos_personales')) || []);
      const [gastosFijos, setGastosFijos] = useState(() => JSON.parse(localStorage.getItem('ic_gastos_fijos')) || []);

      // Base de Datos Locales
      const [stockRepuestos, setStockRepuestos] = useState(() => JSON.parse(localStorage.getItem('ic_stock_repuestos')) || []);
      const [ordenes, setOrdenes] = useState(() => JSON.parse(localStorage.getItem('ic_ordenes')) || []);
      const [reparaciones, setReparaciones] = useState(() => JSON.parse(localStorage.getItem('ic_reparaciones')) || []);
      const [gastosNegocio, setGastosNegocio] = useState(() => JSON.parse(localStorage.getItem('ic_gastos_negocio')) || []);
      const [deudasFavor, setDeudasFavor] = useState(() => JSON.parse(localStorage.getItem('ic_deudas_favor')) || []);
      const [comisionesPagos, setComisionesPagos] = useState(() => JSON.parse(localStorage.getItem('ic_comisiones_pagos')) || []);
      const [logs, setLogs] = useState(() => JSON.parse(localStorage.getItem('ic_logs')) || []);

      // Modales & Formularios
      const [passActual, setPassActual] = useState('');
      const [passNueva, setPassNueva] = useState('');
      const [msgPass, setMsgPass] = useState('');
      const [reciboModal, setReciboModal] = useState(null);
      const [modalCargarReparacion, setModalCargarReparacion] = useState(false);
      const [equipoSeleccionadoParaReparar, setEquipoSeleccionadoParaReparar] = useState(null);
      const [repuestosLista, setRepuestosLista] = useState([{ nombre: '', costo: '' }]);
      const [manoObraInput, setManoObraInput] = useState('');
      const [medioPagoInput, setMedioPagoInput] = useState('Efectivo USD');
      const [monedaCarga, setMonedaCarga] = useState('USD');

      // Form Recepción Taller (Minorista vs Gremio Simplificado)
      const [tipoReparacionIngreso, setTipoReparacionIngreso] = useState('minorista');
      const [gremioSeleccionado, setGremioSeleccionado] = useState('ICONNECTURE');
      const [nuevoGremioNombre, setNuevoGremioNombre] = useState('');
      
      const [formIngreso, setFormIngreso] = useState({
        cliente_nombre: '', cliente_telefono: '', cliente_telefono_alt: '',
        equipo_modelo: '', imei_serie: '', prioridad: 'Moderada',
        falla_declarada: '', presupuesto_estimado: '', estado_fisico: ''
      });

      // Filtros de Actividad y Garantías
      const [filtroUsuarioLog, setFiltroUsuarioLog] = useState('todos');
      const [filtroFechaLogDia, setFiltroFechaLogDia] = useState('');
      const [busquedaImeiGarantia, setBusquedaImeiGarantia] = useState('');

      // Guardar en LocalStorage
      useEffect(() => { localStorage.setItem('ic_usuarios', JSON.stringify(usuarios)); }, [usuarios]);
      useEffect(() => { localStorage.setItem('ic_ordenes', JSON.stringify(ordenes)); }, [ordenes]);
      useEffect(() => { localStorage.setItem('ic_reparaciones', JSON.stringify(reparaciones)); }, [reparaciones]);
      useEffect(() => { localStorage.setItem('ic_gastos_negocio', JSON.stringify(gastosNegocio)); }, [gastosNegocio]);
      useEffect(() => { localStorage.setItem('ic_deudas_favor', JSON.stringify(deudasFavor)); }, [deudasFavor]);
      useEffect(() => { localStorage.setItem('ic_comisiones_pagos', JSON.stringify(comisionesPagos)); }, [comisionesPagos]);
      useEffect(() => { localStorage.setItem('ic_logs', JSON.stringify(logs)); }, [logs]);
      useEffect(() => { localStorage.setItem('ic_gastos_personales', JSON.stringify(gastosPersonales)); }, [gastosPersonales]);
      useEffect(() => { localStorage.setItem('ic_gastos_fijos', JSON.stringify(gastosFijos)); }, [gastosFijos]);
      useEffect(() => { localStorage.setItem('ic_stock_repuestos', JSON.stringify(stockRepuestos)); }, [stockRepuestos]);
      useEffect(() => { localStorage.setItem('ic_lista_gremios', JSON.stringify(listaGremios)); }, [listaGremios]);
      useEffect(() => { localStorage.setItem('ic_cotizacion_dolar', cotizacionDolar.toString()); }, [cotizacionDolar]);
      useEffect(() => { localStorage.setItem('ic_pin_patrimonio', pinPatrimonio); }, [pinPatrimonio]);
      useEffect(() => { localStorage.setItem('ic_saldo_inicial_bruno', saldoInicialBruno.toString()); }, [saldoInicialBruno]);

      const registrarLog = (modulo, accion, detalles) => {
        const nuevo = {
          id: Date.now(),
          usuario: usuarioSesion ? usuarioSesion.nombre : 'Sistema',
          modulo, accion, detalles,
          fecha: new Date().toISOString()
        };
        setLogs(prev => [nuevo, ...prev]);
      };

      const fmtMoney = (amountUSD, currency = 'USD') => {
        if (modoOculto) return '*** ' + currency;
        if (currency === 'ARS') {
          const ars = amountUSD * cotizacionDolar;
          return `$ ${ars.toLocaleString('es-AR', { maximumFractionDigits: 0 })} ARS`;
        }
        return `$ ${parseFloat(amountUSD || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
      };

      const esImeiValido = (imei) => {
        if (!imei) return true;
        return /^\d{15}$/.test(imei);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const found = usuarios.find(u => u.nombre === loginUser);
        if (found && found.pass === loginPass) {
          setUsuarioSesion(found);
          setLoginError('');
          setLoginPass('');
          registrarLog('Seguridad', 'Inicio de Sesión', `Acceso concedido a ${found.nombre}`);
        } else {
          setLoginError('Contraseña incorrecta');
        }
      };

      const cambiarPasswordUsuario = (e) => {
        e.preventDefault();
        if (passActual !== usuarioSesion.pass) {
          setMsgPass('❌ La contraseña actual es incorrecta.');
          return;
        }
        if (!passNueva || passNueva.length < 4) {
          setMsgPass('❌ La nueva clave debe tener al menos 4 caracteres.');
          return;
        }
        const actualizados = usuarios.map(u => u.nombre === usuarioSesion.nombre ? { ...u, pass: passNueva } : u);
        setUsuarios(actualizados);
        setUsuarioSesion({ ...usuarioSesion, pass: passNueva });
        setPassActual('');
        setPassNueva('');
        setMsgPass('✅ Contraseña actualizada con éxito.');
        registrarLog('Seguridad', 'Cambio Clave', `${usuarioSesion.nombre} cambió su contraseña.`);
      };

      // Guardar Ingreso Taller (Minorista vs Gremio Simplificado)
      const handleGuardarIngreso = (e) => {
        e.preventDefault();
        if (formIngreso.imei_serie && !esImeiValido(formIngreso.imei_serie)) {
          alert('El IMEI debe contener exactamente 15 dígitos numéricos sin letras ni espacios.');
          return;
        }

        let clienteNombreFinal = formIngreso.cliente_nombre;
        let clienteTelFinal = formIngreso.cliente_telefono;

        if (tipoReparacionIngreso === 'gremio') {
          if (gremioSeleccionado === 'NUEVO') {
            if (!nuevoGremioNombre.trim()) {
              alert('Ingresá el nombre del nuevo gremio.');
              return;
            }
            clienteNombreFinal = `Gremio: ${nuevoGremioNombre.trim()}`;
            if (!listaGremios.includes(nuevoGremioNombre.trim())) {
              setListaGremios([...listaGremios, nuevoGremioNombre.trim()]);
            }
          } else {
            clienteNombreFinal = `Gremio: ${gremioSeleccionado}`;
          }
          clienteTelFinal = 'Gremio / Taller';
        }

        const antecedente = ordenes.find(o => o.imei_serie && o.imei_serie === formIngreso.imei_serie);
        if (antecedente) {
          alert(`⚠️ ALERTA DE REINGRESO: Este IMEI ya ingresó anteriormente el ${new Date(antecedente.fecha_ingreso).toLocaleDateString()}.`);
        }

        const nuevaOrden = {
          id: Date.now(),
          tipo_cliente: tipoReparacionIngreso,
          cliente_nombre: clienteNombreFinal,
          cliente_telefono: clienteTelFinal,
          cliente_telefono_alt: tipoReparacionIngreso === 'minorista' ? formIngreso.cliente_telefono_alt : 'N/A',
          equipo_modelo: formIngreso.equipo_modelo,
          imei_serie: formIngreso.imei_serie,
          prioridad: formIngreso.prioridad,
          falla_declarada: formIngreso.falla_declarada,
          presupuesto_estimado: formIngreso.presupuesto_estimado,
          estado_fisico: formIngreso.estado_fisico,
          estado: 'Recibido',
          fecha_ingreso: new Date().toISOString()
        };

        setOrdenes([nuevaOrden, ...ordenes]);
        registrarLog('Taller', 'Nuevo Ingreso', `${formIngreso.equipo_modelo} - ${clienteNombreFinal}`);

        setFormIngreso({
          cliente_nombre: '', cliente_telefono: '', cliente_telefono_alt: '',
          equipo_modelo: '', imei_serie: '', prioridad: 'Moderada',
          falla_declarada: '', presupuesto_estimado: '', estado_fisico: ''
        });
        setNuevoGremioNombre('');
        alert('✅ Equipo ingresado al taller con éxito.');
      };

      const handleConfirmarReparacion = () => {
        if (!equipoSeleccionadoParaReparar) return;

        const costoTotalRepuestos = repuestosLista.reduce((acc, r) => acc + (parseFloat(r.costo) || 0), 0);
        const manoObraVal = parseFloat(manoObraInput) || 0;
        let totalCobrado = costoTotalRepuestos + manoObraVal;

        if (monedaCarga === 'ARS') totalCobrado = totalCobrado / cotizacionDolar;
        const gananciaNeta = manoObraVal / (monedaCarga === 'ARS' ? cotizacionDolar : 1);

        const nuevaRep = {
          id: Date.now(),
          orden_id: equipoSeleccionadoParaReparar.id,
          cliente_nombre: equipoSeleccionadoParaReparar.cliente_nombre,
          cliente_telefono: equipoSeleccionadoParaReparar.cliente_telefono,
          equipo_modelo: equipoSeleccionadoParaReparar.equipo_modelo,
          imei_serie: equipoSeleccionadoParaReparar.imei_serie,
          tipo_cliente: equipoSeleccionadoParaReparar.tipo_cliente,
          tecnico: usuarioSesion.nombre,
          repuestos: repuestosLista,
          costo_repuestos_usd: costoTotalRepuestos / (monedaCarga === 'ARS' ? cotizacionDolar : 1),
          mano_obra_usd: gananciaNeta,
          total_usd: totalCobrado,
          medio_pago: medioPagoInput,
          estado_pago: 'Pendiente',
          fecha_completado: new Date().toISOString(),
          garantia_dias: 30
        };

        setReparaciones([nuevaRep, ...reparaciones]);
        setOrdenes(ordenes.map(o => o.id === equipoSeleccionadoParaReparar.id ? { ...o, estado: 'Listo para Entregar' } : o));
        registrarLog('Reparaciones', 'Carga Trabajo', `Reparación registrada para ${nuevaRep.equipo_modelo}`);

        setEquipoSeleccionadoParaReparar(null);
        setModalCargarReparacion(false);
        setRepuestosLista([{ nombre: '', costo: '' }]);
        setManoObraInput('');
      };

      const marcarPagadoReparacion = (id) => {
        const rep = reparaciones.find(r => r.id === id);
        if (!rep) return;
        setReparaciones(reparaciones.map(r => r.id === id ? { ...r, estado_pago: 'Pagado', fecha_pago: new Date().toISOString() } : r));
        setOrdenes(ordenes.map(o => o.id === rep.orden_id ? { ...o, estado: 'Entregado', fecha_entrega: new Date().toISOString() } : o));
        registrarLog('Finanzas', 'Cobro Reparación', `Cobro registrado para ${rep.equipo_modelo}`);
      };

      const comisionesCalculadas = useMemo(() => {
        let saldoBruno = 0;
        reparaciones.filter(r => r.estado_pago === 'Pagado').forEach(r => {
          if (r.tipo_cliente === 'gremio') {
            saldoBruno += r.mano_obra_usd;
          } else {
            saldoBruno += (r.mano_obra_usd * 0.5);
          }
        });

        const totalPagado = comisionesPagos.reduce((acc, p) => acc + (parseFloat(p.monto_usd) || 0), 0);
        saldoBruno -= totalPagado;

        return {
          saldoFinal: saldoBruno,
          totalHistoricoGanado: reparaciones.filter(r => r.estado_pago === 'Pagado').reduce((acc, r) => acc + (r.tipo_cliente === 'gremio' ? r.mano_obra_usd : r.mano_obra_usd * 0.5), 0)
        };
      }, [reparaciones, comisionesPagos]);

      const totalValorStock = useMemo(() => {
        return stockRepuestos.reduce((acc, s) => acc + ((parseFloat(s.cantidad) || 0) * (parseFloat(s.costo_unitario_usd) || 0)), 0);
      }, [stockRepuestos]);

      const totalGastosFijosMensuales = useMemo(() => {
        return gastosFijos.reduce((acc, g) => acc + (parseFloat(g.monto_usd) || 0), 0);
      }, [gastosFijos]);

      // LOGIN SCREEN (CON LOS 4 USUARIOS)
      if (!usuarioSesion) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 px-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-16 h-16 rounded-2xl bg-purple-600 flex items-center justify-center text-white font-black text-2xl mx-auto shadow-lg shadow-purple-900/50">
                  IC
                </div>
                <h1 className="text-2xl font-bold text-white tracking-tight">ICONNECTURE</h1>
                <p className="text-xs text-purple-400 font-semibold tracking-wider uppercase">Sistema de Servicio Técnico & Gestión</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4 pt-2">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-2">Seleccionar Usuario</label>
                  <div className="grid grid-cols-2 gap-2">
                    {usuarios.map(u => (
                      <button
                        key={u.id}
                        type="button"
                        onClick={() => { setLoginUser(u.nombre); setLoginError(''); }}
                        className={`py-3 px-3 rounded-xl border text-xs font-semibold transition flex flex-col items-center justify-center ${
                          loginUser === u.nombre
                            ? 'bg-purple-600/20 border-purple-500 text-purple-300 shadow-md'
                            : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'
                        }`}
                      >
                        <span className="font-bold text-white text-sm">{u.nombre}</span>
                        <span className="text-[10px] text-slate-400 mt-0.5">{u.rol}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Contraseña de {loginUser}</label>
                  <input
                    type="password"
                    required
                    value={loginPass}
                    onChange={e => setLoginPass(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 text-center font-mono text-lg"
                  />
                </div>

                {loginError && (
                  <p className="text-xs text-rose-400 font-medium text-center bg-rose-950/40 border border-rose-900/50 py-2 rounded-lg">
                    {loginError}
                  </p>
                )}

                <button
                  type="submit"
                  className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-purple-950 text-sm"
                >
                  Ingresar al Sistema
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden">
          {/* BARRA LATERAL */}
          <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 overflow-y-auto hide-scrollbar">
            <div>
              <div className="flex items-center gap-3 px-2 py-3 mb-4 border-b border-slate-800">
                <div className="w-9 h-9 rounded-xl bg-purple-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-purple-900/50">
                  IC
                </div>
                <div>
                  <h1 className="font-bold text-base text-white leading-tight">ICONNECTURE</h1>
                  <p className="text-[10px] text-purple-400 font-medium">Servicio Técnico</p>
                </div>
              </div>

              <nav className="space-y-1">
                {[
                  { id: 'dashboard', label: 'Resumen General', icon: 'fa-chart-pie' },
                  { id: 'taller', label: 'Taller & Recepción', icon: 'fa-wrench' },
                  { id: 'reparaciones', label: 'Cargar Reparación', icon: 'fa-microchip' },
                  { id: 'garantias', label: 'Control Garantías', icon: 'fa-shield-halved' },
                  { id: 'stock', label: 'Stock Repuestos', icon: 'fa-boxes-stacked' },
                  { id: 'gastos', label: 'Gastos del Negocio', icon: 'fa-receipt' },
                  { id: 'medeben', label: 'Me Deben (Cuentas)', icon: 'fa-hand-holding-dollar' },
                  { id: 'comisiones', label: 'Comisiones Bruno', icon: 'fa-wallet' },
                  { id: 'socios', label: 'Socios y Reparto', icon: 'fa-users-gear' },
                  { id: 'cuentas', label: 'Gestión Cuentas', icon: 'fa-user-lock' },
                  { id: 'estadisticas', label: 'Estadísticas Globales', icon: 'fa-chart-line' },
                  { id: 'actividad', label: 'Registro Actividad', icon: 'fa-clock-rotate-left' },
                  { id: 'patrimonio', label: 'Patrimonio Bruno 🔒', icon: 'fa-lock' },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setVista(item.id)}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      vista === item.id 
                        ? 'bg-purple-600 text-white shadow-md shadow-purple-950' 
                        : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                    }`}
                  >
                    <i className={`fa-solid ${item.icon} w-4 text-center`}></i>
                    {item.label}
                  </button>
                ))}
              </nav>
            </div>

            <div className="border-t border-slate-800 pt-3 space-y-2">
              <div className="flex items-center justify-between px-2">
                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-full bg-purple-950 border border-purple-500/50 flex items-center justify-center text-purple-300 font-bold text-xs">
                    {usuarioSesion.nombre.charAt(0)}
                  </div>
                  <div>
                    <p className="text-xs font-bold text-white leading-tight">{usuarioSesion.nombre}</p>
                    <p className="text-[9px] text-slate-400">{usuarioSesion.rol}</p>
                  </div>
                </div>
                <button onClick={() => setUsuarioSesion(null)} title="Cerrar Sesión" className="text-slate-400 hover:text-rose-400 transition p-1 text-xs">
                  <i className="fa-solid fa-right-from-bracket"></i>
                </button>
              </div>
            </div>
          </aside>

          {/* ÁREA DE CONTENIDO */}
          <div className="flex-1 flex flex-col overflow-hidden">
            <header className="bg-slate-900 border-b border-slate-800 px-6 py-3 flex justify-between items-center text-xs">

                      const monto = parseFloat(form.monto.value) || 0;
                      const mon = form.moneda.value;

                      const montoUSD = mon === 'ARS' ? monto / cotizacionDolar : monto;
                      setDeudasFavor([{ id: Date.now(), deudor, monto_usd: montoUSD, fecha: new Date().toISOString(), estado: 'Pendiente' }, ...deudasFavor]);
                      form.reset();
                    }} className="flex gap-3 text-xs">
                      <input type="text" name="deudor" required placeholder="Nombre del deudor..." className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                      <input type="number" step="any" name="monto" required placeholder="Monto" className="w-32 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                      <select name="moneda" className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                        <option value="USD">USD</option>
                        <option value="ARS">ARS</option>
                      </select>
                      <button type="submit" className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2 rounded-xl">Agregar Deuda</button>
                    </form>

                    <div className="space-y-2 text-xs pt-4 border-t border-slate-800">
                      {deudasFavor.length === 0 ? (
                        <p className="text-xs text-slate-500 text-center py-4">No hay deudas registradas.</p>
                      ) : (
                        deudasFavor.map(d => (
                          <div key={d.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
                            <div>
                              <p className="font-bold text-white">{d.deudor}</p>
                              <p className="text-[10px] text-slate-500">{new Date(d.fecha).toLocaleDateString()}</p>
                            </div>
                            <div className="flex items-center gap-3">
                              <span className="font-mono text-emerald-400 font-bold">{fmtMoney(d.monto_usd)}</span>
                              {d.estado === 'Pendiente' && (
                                <button onClick={() => setDeudasFavor(deudasFavor.map(x => x.id === d.id ? { ...x, estado: 'Cobrado' } : x))} className="bg-emerald-600 text-white px-2 py-1 rounded text-[10px] font-bold">Saldar</button>
                              )}
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* COMISIONES BRUNO */}
              {vista === 'comisiones' && (
                <div className="space-y-6 max-w-3xl">
                  <header>
                    <h2 className="text-2xl font-bold text-white">Cuenta Corriente & Comisiones Bruno</h2>
                    <p className="text-slate-400 text-sm">Liquidación de mano de obra (100% Gremio / 50% Minorista)</p>
                  </header>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                      <div>
                        <p className="text-xs text-slate-400">Saldo a Cobrar por Bruno</p>
                        <h3 className={`text-3xl font-black ${comisionesCalculadas.saldoFinal >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                          {fmtMoney(comisionesCalculadas.saldoFinal)}
                        </h3>
                      </div>
                      <button
                        onClick={() => {
                          const monto = prompt('Ingresá el monto entregado/liquidado a Bruno (en USD):');
                          if (monto && !isNaN(monto)) {
                            setComisionesPagos([{ id: Date.now(), monto_usd: parseFloat(monto), fecha: new Date().toISOString() }, ...comisionesPagos]);
                          }
                        }}
                        className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs"
                      >
                        Registrar Entrega de Efectivo
                      </button>
                    </div>

                    <h4 className="text-sm font-bold text-white">Historial de Entregas</h4>
                    {comisionesPagos.length === 0 ? (
                      <p className="text-xs text-slate-500 text-center py-4">No hay pagos de comisiones registrados aún.</p>
                    ) : (
                      <div className="space-y-2 text-xs">
                        {comisionesPagos.map(p => (
                          <div key={p.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
                            <p className="font-bold text-white">Entrega / Retiro Efectivo ({new Date(p.fecha).toLocaleDateString()})</p>
                            <span className="font-mono text-purple-400 font-bold">-{fmtMoney(p.monto_usd)}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* SOCIOS Y REPARTO */}
              {vista === 'socios' && (
                <div className="space-y-6 max-w-4xl">
                  <header>
                    <h2 className="text-2xl font-bold text-white">Configuración de Socios y Reparto</h2>
                    <p className="text-slate-400 text-sm">Distribución pactada de ganancias del taller</p>
                  </header>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-3">
                      <h3 className="font-bold text-white text-lg">Bruno</h3>
                      <p className="text-xs text-purple-400 font-semibold">Administrador / Técnico Único</p>
                      <ul className="text-xs text-slate-300 space-y-1 list-disc list-inside pt-2 border-t border-slate-800">
                        <li>100% Ganancia Neta en Reparaciones Gremio</li>
                        <li>50% Ganancia Neta en Reparaciones Minoristas</li>
                      </ul>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-3">
                      <h3 className="font-bold text-white text-lg">Mateo</h3>
                      <p className="text-xs text-blue-400 font-semibold">Socio Comercial</p>
                      <ul className="text-xs text-slate-300 space-y-1 list-disc list-inside pt-2 border-t border-slate-800">
                        <li>0% Ganancia en Reparaciones Gremio</li>
                        <li>50% Ganancia Neta en Reparaciones Minoristas</li>
                      </ul>
                    </div>
                  </div>
                </div>
              )}

              {/* GESTIÓN DE CUENTAS (CON LOS 4 USUARIOS) */}
              {vista === 'cuentas' && (
                <div className="space-y-6 max-w-4xl">
                  <header>
                    <h2 className="text-2xl font-bold text-white">Gestión de Cuentas y Accesos</h2>
                    <p className="text-slate-400 text-sm">Cambio de contraseña y estado de usuarios</p>
                  </header>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-3">
                      <h3 className="text-base font-bold text-white">Cuentas del Sistema ({usuarios.length})</h3>
                      <div className="space-y-2 text-xs">
                        {usuarios.map(u => (
                          <div key={u.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
                            <div>
                              <p className="font-bold text-white">{u.nombre}</p>
                              <p className="text-[10px] text-slate-400">{u.rol}</p>
                            </div>
                            <span className="text-[10px] bg-purple-950 text-purple-300 px-2 py-0.5 rounded-full border border-purple-800 font-bold">Habilitado</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                      <h3 className="text-base font-bold text-white">Cambiar Mi Contraseña ({usuarioSesion.nombre})</h3>
                      <form onSubmit={cambiarPasswordUsuario} className="space-y-3 text-xs">
                        <div>
                          <label className="block text-slate-400 mb-1">Contraseña Actual</label>
                          <input type="password" required value={passActual} onChange={e => setPassActual(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                        </div>
                        <div>
                          <label className="block text-slate-400 mb-1">Nueva Contraseña</label>
                          <input type="password" required value={passNueva} onChange={e => setPassNueva(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                        </div>
                        {msgPass && <p className="text-xs font-semibold">{msgPass}</p>}
                        <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl transition">
                          Actualizar Contraseña
                        </button>
                      </form>
                    </div>
                  </div>
                </div>
              )}

              {/* ESTADÍSTICAS GLOBALES */}
              {vista === 'estadisticas' && (
                <div className="space-y-6">
                  <header>
                    <h2 className="text-2xl font-bold text-white">Analytics y Estadísticas Globales</h2>
                    <p className="text-slate-400 text-sm">Resumen numérico y porcentaje unificado</p>
                  </header>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-2">
                      <p className="text-xs text-slate-400">Total Reparaciones Pagadas</p>
                      <h3 className="text-3xl font-black text-white">{reparaciones.filter(r => r.estado_pago === 'Pagado').length}</h3>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-2">
                      <p className="text-xs text-slate-400">Reparaciones por Cliente</p>
                      <div className="flex gap-2 font-mono text-xs font-bold pt-1">
                        <span className="text-amber-400">Gremio: {reparaciones.filter(r => r.tipo_cliente === 'gremio').length}</span>
                        <span className="text-blue-400">Minorista: {reparaciones.filter(r => r.tipo_cliente === 'minorista').length}</span>
                      </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-2">
                      <p className="text-xs text-slate-400">Facturación Bruta Total</p>
                      <h3 className="text-2xl font-black text-emerald-400">{fmtMoney(reparaciones.filter(r => r.estado_pago === 'Pagado').reduce((acc, r) => acc + r.total_usd, 0))}</h3>
                    </div>
                  </div>
                </div>
              )}

              {/* REGISTRO DE ACTIVIDAD */}
              {vista === 'actividad' && (
                <div className="space-y-6">
                  <header>
                    <h2 className="text-2xl font-bold text-white">Registro de Actividad (Auditoría)</h2>
                    <p className="text-slate-400 text-sm">Historial inalterable de auditoría</p>
                  </header>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-wrap gap-4 text-xs">
                    <div>
                      <label className="block text-slate-400 mb-1">Filtrar por Usuario</label>
                      <select value={filtroUsuarioLog} onChange={e => setFiltroUsuarioLog(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                        <option value="todos">Todos los usuarios</option>
                        <option value="Bruno">Bruno</option>
                        <option value="Mateo">Mateo</option>
                        <option value="Yaco">Yaco</option>
                        <option value="Priscila">Priscila</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1">Día Específico</label>
                      <input type="date" value={filtroFechaLogDia} onChange={e => setFiltroFechaLogDia(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                    <table className="w-full text-left text-xs text-slate-300">
                      <thead className="bg-slate-950 text-slate-400 uppercase font-semibold border-b border-slate-800">
                        <tr>
                          <th className="px-4 py-3">Fecha y Hora</th>
                          <th className="px-4 py-3">Usuario</th>
                          <th className="px-4 py-3">Módulo</th>
                          <th className="px-4 py-3">Acción</th>
                          <th className="px-4 py-3">Detalle</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {logs.length === 0 ? (
                          <tr><td colSpan="5" className="px-4 py-6 text-center text-slate-500">Sin actividad registrada.</td></tr>
                        ) : (
                          logs
                            .filter(l => filtroUsuarioLog === 'todos' || l.usuario === filtroUsuarioLog)
                            .filter(l => !filtroFechaLogDia || l.fecha.startsWith(filtroFechaLogDia))
                            .map(l => (
                              <tr key={l.id} className="hover:bg-slate-950/50">
                                <td className="px-4 py-3 font-mono text-slate-500">{new Date(l.fecha).toLocaleString()}</td>
                                <td className="px-4 py-3 font-bold text-purple-300">{l.usuario}</td>
                                <td className="px-4 py-3 font-semibold text-slate-200">{l.modulo}</td>
                                <td className="px-4 py-3 text-purple-400">{l.accion}</td>
                                <td className="px-4 py-3 text-slate-300">{l.detalles}</td>
                              </tr>
                            ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* PATRIMONIO DE BRUNO */}
              {vista === 'patrimonio' && (
                <div className="space-y-6 max-w-4xl">
                  <header>
                    <h2 className="text-2xl font-bold text-white">Patrimonio Personal de Bruno 🔒</h2>
                    <p className="text-slate-400 text-sm">Control privado de saldo inicial, bancos y gastos fijos</p>
                  </header>

                  {!patrimonioDesbloqueado ? (
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md mx-auto text-center space-y-4">
                      <h3 className="text-lg font-bold text-white">Ingresá tu PIN Secreto (6 dígitos)</h3>
                      <input
                        type="password"
                        maxLength="6"
                        value={pinInput}
                        onChange={e => {
                          setPinInput(e.target.value);
                          if (e.target.value === pinPatrimonio) {
                            setPatrimonioDesbloqueado(true);
                            setPinInput('');
                          }
                        }}
                        placeholder="••••••"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-2xl font-mono text-white focus:outline-none focus:border-purple-500"
                      />
                    </div>
                  ) : (
                    <div className="space-y-6">
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-1">
                          <p className="text-xs text-slate-400">Saldo Inicial / Bancos / Caja</p>
                          <div className="flex items-center justify-between">
                            <h3 className="text-2xl font-black text-white">{fmtMoney(saldoInicialBruno)}</h3>
                            <button onClick={() => {
                              const val = prompt('Ingresá tu dinero actual en banco/efectivo (USD):', saldoInicialBruno);
                              if (val !== null && !isNaN(val)) setSaldoInicialBruno(parseFloat(val));
                            }} className="text-purple-400 text-xs hover:underline">Editar</button>
                          </div>
                        </div>

                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-1">
                          <p className="text-xs text-slate-400">Dinero Líquido Disponible</p>
                          <h3 className="text-2xl font-black text-emerald-400">
                            {fmtMoney(saldoInicialBruno + comisionesCalculadas.totalHistoricoGanado - gastosPersonales.reduce((acc, g) => acc + g.monto_usd, 0) - totalGastosFijosMensuales)}
                          </h3>
                        </div>

                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-1">
                          <p className="text-xs text-slate-400">Gastos Fijos Mensuales</p>
                          <h3 className="text-2xl font-black text-rose-400">{fmtMoney(totalGastosFijosMensuales)}</h3>
                        </div>
                      </div>

                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-3">
                        <h3 className="text-base font-bold text-white">Cambiar PIN Secreto (6 Dígitos)</h3>
                        <div className="flex gap-3 text-xs max-w-md">
                          <input
                            type="password"
                            maxLength="6"
                            placeholder="Nuevo PIN..."
                            value={nuevoPinInput}
                            onChange={e => setNuevoPinInput(e.target.value)}
                            className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white text-center font-mono"
                          />
                          <button
                            onClick={() => {
                              if (nuevoPinInput.length === 6 && !isNaN(nuevoPinInput)) {
                                setPinPatrimonio(nuevoPinInput);
                                setNuevoPinInput('');
                                alert('✅ PIN actualizado.');
                              } else {
                                alert('Debe tener 6 números.');
                              }
                            }}
                            className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2 rounded-xl"
                          >
                            Actualizar PIN
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

            </main>
          </div>

          {/* MODAL EDITAR COTIZACIÓN DÓLAR */}
          {modalDolar && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4">
                <h3 className="font-bold text-white text-lg">Actualizar Dólar Hoy</h3>
                <input type="number" placeholder="Ej: 1480" value={nuevaCotizacionInput} onChange={e => setNuevaCotizacionInput(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white font-mono text-center text-lg" />
                <div className="flex gap-2">
                  <button onClick={() => { if (nuevaCotizacionInput) { setCotizacionDolar(parseFloat(nuevaCotizacionInput)); setModalDolar(false); setNuevaCotizacionInput(''); } }} className="flex-1 bg-purple-600 text-white font-bold py-2 rounded-xl text-xs">Guardar</button>
                  <button onClick={() => setModalDolar(false)} className="bg-slate-800 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs">Cancelar</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
