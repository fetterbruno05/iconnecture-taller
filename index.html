<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICONNECTURE - System Suite Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Configuración Inicial de Usuarios (Incluye Yaco y Priscila)
    const USUARIOS_DEFAULT = [
      { id: '1', nombre: 'Bruno', pass: 'bruno123', rol: 'Administrador / Técnico' },
      { id: '2', nombre: 'Mateo', pass: 'mateo123', rol: 'Socio' },
      { id: '3', nombre: 'Yaco', pass: 'yaco123', rol: 'Empleado' },
      { id: '4', nombre: 'Priscila', pass: 'priscila123', rol: 'Contadora' }
    ];

    function App() {
      // Auth & Sesión
      const [usuarios, setUsuarios] = useState(() => JSON.parse(localStorage.getItem('ic_usuarios')) || USUARIOS_DEFAULT);
      const [usuarioSesion, setUsuarioSesion] = useState(null);
      const [loginUser, setLoginUser] = useState('Bruno');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      // Cotización Dólar & Privacidad
      const [cotizacionDolar, setCotizacionDolar] = useState(() => parseFloat(localStorage.getItem('ic_cotizacion_dolar')) || 1450);
      const [modoOculto, setModoOculto] = useState(false);
      const [modalDolar, setModalDolar] = useState(false);
      const [nuevaCotizacionInput, setNuevaCotizacionInput] = useState('');

      // Navegación
      const [vista, setVista] = useState('dashboard');

      // Patrimonio (PIN 6 dígitos + Saldo Inicial + Gastos Fijos / Cuotas)
      const [pinPatrimonio, setPinPatrimonio] = useState(() => localStorage.getItem('ic_pin_patrimonio') || '123456');
      const [patrimonioDesbloqueado, setPatrimonioDesbloqueado] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [nuevoPinInput, setNuevoPinInput] = useState('');
      const [saldoInicialBruno, setSaldoInicialBruno] = useState(() => parseFloat(localStorage.getItem('ic_saldo_inicial_bruno')) || 0);
      const [gastosPersonales, setGastosPersonales] = useState(() => JSON.parse(localStorage.getItem('ic_gastos_personales')) || []);
      const [gastosFijos, setGastosFijos] = useState(() => JSON.parse(localStorage.getItem('ic_gastos_fijos')) || []);

      // Stock / Inventario
      const [stockRepuestos, setStockRepuestos] = useState(() => JSON.parse(localStorage.getItem('ic_stock_repuestos')) || []);

      // Base de Datos Locales
      const [ordenes, setOrdenes] = useState(() => JSON.parse(localStorage.getItem('ic_ordenes')) || []);
      const [reparaciones, setReparaciones] = useState(() => JSON.parse(localStorage.getItem('ic_reparaciones')) || []);
      const [gastosNegocio, setGastosNegocio] = useState(() => JSON.parse(localStorage.getItem('ic_gastos_negocio')) || []);
      const [deudasFavor, setDeudasFavor] = useState(() => JSON.parse(localStorage.getItem('ic_deudas_favor')) || []);
      const [comisionesPagos, setComisionesPagos] = useState(() => JSON.parse(localStorage.getItem('ic_comisiones_pagos')) || []);
      const [logs, setLogs] = useState(() => JSON.parse(localStorage.getItem('ic_logs')) || []);

      // Modales & Cambio Pass
      const [passActual, setPassActual] = useState('');
      const [passNueva, setPassNueva] = useState('');
      const [msgPass, setMsgPass] = useState('');
      const [reciboModal, setReciboModal] = useState(null);
      const [modalCargarReparacion, setModalCargarReparacion] = useState(false);
      const [equipoSeleccionadoParaReparar, setEquipoSeleccionadoParaReparar] = useState(null);
      const [repuestosLista, setRepuestosLista] = useState([{ nombre: '', costo: '' }]);
      const [manoObraInput, setManoObraInput] = useState('');
      const [medioPagoInput, setMedioPagoInput] = useState('Efectivo USD');
      const [monedaCarga, setMonedaCarga] = useState('USD');
      const [cotizacionUsadaCarga, setCotizacionUsadaCarga] = useState(cotizacionDolar);

      // Form Recepción Taller
      const [tipoReparacionIngreso, setTipoReparacionIngreso] = useState('minorista');
      const [formIngreso, setFormIngreso] = useState({
        cliente_nombre: '', cliente_telefono: '', cliente_telefono_alt: '',
        equipo_modelo: '', imei_serie: '', prioridad: 'Moderada',
        falla_declarada: '', presupuesto_estimado: '', estado_fisico: '',
        tuvo_reparacion_previa: 'no', detalle_reparacion_previa: ''
      });

      // Guardar en LocalStorage
      useEffect(() => { localStorage.setItem('ic_usuarios', JSON.stringify(usuarios)); }, [usuarios]);
      useEffect(() => { localStorage.setItem('ic_ordenes', JSON.stringify(ordenes)); }, [ordenes]);
      useEffect(() => { localStorage.setItem('ic_reparaciones', JSON.stringify(reparaciones)); }, [reparaciones]);
      useEffect(() => { localStorage.setItem('ic_gastos_negocio', JSON.stringify(gastosNegocio)); }, [gastosNegocio]);
      useEffect(() => { localStorage.setItem('ic_deudas_favor', JSON.stringify(deudasFavor)); }, [deudasFavor]);
      useEffect(() => { localStorage.setItem('ic_comisiones_pagos', JSON.stringify(comisionesPagos)); }, [comisionesPagos]);
      useEffect(() => { localStorage.setItem('ic_logs', JSON.stringify(logs)); }, [logs]);
      useEffect(() => { localStorage.setItem('ic_gastos_personales', JSON.stringify(gastosPersonales)); }, [gastosPersonales]);
      useEffect(() => { localStorage.setItem('ic_gastos_fijos', JSON.stringify(gastosFijos)); }, [gastosFijos]);
      useEffect(() => { localStorage.setItem('ic_stock_repuestos', JSON.stringify(stockRepuestos)); }, [stockRepuestos]);
      useEffect(() => { localStorage.setItem('ic_cotizacion_dolar', cotizacionDolar.toString()); }, [cotizacionDolar]);
      useEffect(() => { localStorage.setItem('ic_pin_patrimonio', pinPatrimonio); }, [pinPatrimonio]);
      useEffect(() => { localStorage.setItem('ic_saldo_inicial_bruno', saldoInicialBruno.toString()); }, [saldoInicialBruno]);

      const registrarLog = (modulo, accion, detalles) => {
        const nuevo = {
          id: Date.now(),
          usuario: usuarioSesion ? usuarioSesion.nombre : 'Sistema',
          modulo, accion, detalles,
          fecha: new Date().toISOString()
        };
        setLogs(prev => [nuevo, ...prev]);
      };

      const fmtMoney = (amountUSD, currency = 'USD') => {
        if (modoOculto) return '*** ' + currency;
        if (currency === 'ARS') {
          const ars = amountUSD * cotizacionDolar;
          return `$ ${ars.toLocaleString('es-AR', { maximumFractionDigits: 0 })} ARS`;
        }
        return `$ ${parseFloat(amountUSD || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
      };

      const esImeiValido = (imei) => {
        if (!imei) return true;
        return /^\d{15}$/.test(imei);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const found = usuarios.find(u => u.nombre === loginUser);
        if (found && found.pass === loginPass) {
          setUsuarioSesion(found);
          setLoginError('');
          setLoginPass('');
          registrarLog('Seguridad', 'Inicio de Sesión', `Acceso de ${found.nombre}`);
        } else {
          setLoginError('Contraseña incorrecta');
        }
      };

      const cambiarPasswordUsuario = (e) => {
        e.preventDefault();
        if (passActual !== usuarioSesion.pass) {
          setMsgPass('❌ La contraseña actual es incorrecta.');
          return;
        }
        if (!passNueva || passNueva.length < 4) {
          setMsgPass('❌ Mínimo 4 caracteres.');
          return;
        }
        const actualizados = usuarios.map(u => u.nombre === usuarioSesion.nombre ? { ...u, pass: passNueva } : u);
        setUsuarios(actualizados);
        setUsuarioSesion({ ...usuarioSesion, pass: passNueva });
        setPassActual('');
        setPassNueva('');
        setMsgPass('✅ Contraseña actualizada con éxito.');
        registrarLog('Seguridad', 'Cambio Clave', `${usuarioSesion.nombre} cambió su contraseña.`);
      };

      const handleGuardarIngreso = (e) => {
        e.preventDefault();
        if (formIngreso.imei_serie && !esImeiValido(formIngreso.imei_serie)) {
          alert('El IMEI debe contener exactamente 15 dígitos numéricos.');
          return;
        }

        const antecedente = ordenes.find(o => o.imei_serie && o.imei_serie === formIngreso.imei_serie);
        if (antecedente) {
          alert(`⚠️ ALERTA DE REINGRESO: Este IMEI ya fue ingresado el ${new Date(antecedente.fecha_ingreso).toLocaleDateString()}.`);
        }

        const nuevaOrden = {
          id: Date.now(),
          tipo_cliente: tipoReparacionIngreso,
          ...formIngreso,
          estado: 'Recibido',
          fecha_ingreso: new Date().toISOString()
        };

        setOrdenes([nuevaOrden, ...ordenes]);
        registrarLog('Taller', 'Nuevo Ingreso', `${formIngreso.equipo_modelo} (${tipoReparacionIngreso.toUpperCase()})`);

        setFormIngreso({
          cliente_nombre: '', cliente_telefono: '', cliente_telefono_alt: '',
          equipo_modelo: '', imei_serie: '', prioridad: 'Moderada',
          falla_declarada: '', presupuesto_estimado: '', estado_fisico: '',
          tuvo_reparacion_previa: 'no', detalle_reparacion_previa: ''
        });
        alert('✅ Equipo ingresado con éxito.');
      };

      const handleConfirmarReparacion = () => {
        if (!equipoSeleccionadoParaReparar) return;

        const costoTotalRepuestos = repuestosLista.reduce((acc, r) => acc + (parseFloat(r.costo) || 0), 0);
        const manoObraVal = parseFloat(manoObraInput) || 0;
        let totalCobrado = costoTotalRepuestos + manoObraVal;

        if (monedaCarga === 'ARS') totalCobrado = totalCobrado / cotizacionUsadaCarga;
        const gananciaNeta = manoObraVal / (monedaCarga === 'ARS' ? cotizacionUsadaCarga : 1);

        const nuevaRep = {
          id: Date.now(),
          orden_id: equipoSeleccionadoParaReparar.id,
          cliente_nombre: equipoSeleccionadoParaReparar.cliente_nombre,
          cliente_telefono: equipoSeleccionadoParaReparar.cliente_telefono,
          equipo_modelo: equipoSeleccionadoParaReparar.equipo_modelo,
          imei_serie: equipoSeleccionadoParaReparar.imei_serie,
          tipo_cliente: equipoSeleccionadoParaReparar.tipo_cliente,
          tecnico: usuarioSesion.nombre,
          repuestos: repuestosLista,
          costo_repuestos_usd: costoTotalRepuestos / (monedaCarga === 'ARS' ? cotizacionUsadaCarga : 1),
          mano_obra_usd: gananciaNeta,
          total_usd: totalCobrado,
          medio_pago: medioPagoInput,
          estado_pago: 'Pendiente',
          fecha_completado: new Date().toISOString(),
          garantia_dias: 30
        };

        setReparaciones([nuevaRep, ...reparaciones]);
        setOrdenes(ordenes.map(o => o.id === equipoSeleccionadoParaReparar.id ? { ...o, estado: 'Listo para Entregar' } : o));
        registrarLog('Reparaciones', 'Carga Trabajo', `Reparación cargada para ${nuevaRep.equipo_modelo}`);

        setEquipoSeleccionadoParaReparar(null);
        setModalCargarReparacion(false);
        setRepuestosLista([{ nombre: '', costo: '' }]);
        setManoObraInput('');
      };

      const marcarPagadoReparacion = (id) => {
        const rep = reparaciones.find(r => r.id === id);
        if (!rep) return;
        setReparaciones(reparaciones.map(r => r.id === id ? { ...r, estado_pago: 'Pagado', fecha_pago: new Date().toISOString() } : r));
        setOrdenes(ordenes.map(o => o.id === rep.orden_id ? { ...o, estado: 'Entregado', fecha_entrega: new Date().toISOString() } : o));
        registrarLog('Finanzas', 'Cobro Reparación', `Cobro efectivo: ${rep.equipo_modelo}`);
      };

      const comisionesCalculadas = useMemo(() => {
        let saldoBruno = 0;
        reparaciones.filter(r => r.estado_pago === 'Pagado').forEach(r => {
          if (r.tipo_cliente === 'gremio') {
            saldoBruno += r.mano_obra_usd;
          } else {
            saldoBruno += (r.mano_obra_usd * 0.5);
          }
        });

        const totalPagado = comisionesPagos.reduce((acc, p) => acc + (parseFloat(p.monto_usd) || 0), 0);
        saldoBruno -= totalPagado;

        return {
          saldoFinal: saldoBruno,
          totalHistoricoGanado: reparaciones.filter(r => r.estado_pago === 'Pagado').reduce((acc, r) => acc + (r.tipo_cliente === 'gremio' ? r.mano_obra_usd : r.mano_obra_usd * 0.5), 0)
        };
      }, [reparaciones, comisionesPagos]);

      const totalValorStock = useMemo(() => {
        return stockRepuestos.reduce((acc, s) => acc + ((parseFloat(s.cantidad) || 0) * (parseFloat(s.costo_unitario_usd) || 0)), 0);
      }, [stockRepuestos]);

      const totalGastosFijosMensuales = useMemo(() => {
        return gastosFijos.reduce((acc, g) => acc + (parseFloat(g.monto_usd) || 0), 0);
      }, [gastosFijos]);

      if (!usuarioSesion) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 px-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-16 h-16 rounded-2xl bg-purple-600 flex items-center justify-center text-white font-black text-2xl mx-auto shadow-lg shadow-purple-900/50">
                  IC
                </div>
                <h1 className="text-2xl font-bold text-white tracking-tight">ICONNECTURE</h1>
                <p className="text-xs text-purple-400 font-semibold tracking-wider uppercase">Plataforma de Gestión Integrada</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4 pt-2">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-2">Seleccionar Usuario</label>
                  <div className="grid grid-cols-2 gap-2">
                    {usuarios.map(u => (
                      <button
                        key={u.id}
                        type="button"
                        onClick={() => { setLoginUser(u.nombre); setLoginError(''); }}
                        className={`py-2.5 px-3 rounded-xl border text-xs font-semibold transition flex flex-col items-center justify-center ${
                          loginUser === u.nombre
                            ? 'bg-purple-600/20 border-purple-500 text-purple-300 shadow-md'
                            : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'
                        }`}
                      >
                        <span className="font-bold text-white">{u.nombre}</span>
                        <span className="text-[9px] text-slate-400">{u.rol}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Contraseña de {loginUser}</label>
                  <input
                    type="password"
                    required
                    value={loginPass}
                    onChange={e => setLoginPass(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 text-center font-mono text-lg"
                  />
                </div>

                {loginError && (
                  <p className="text-xs text-rose-400 font-medium text-center bg-rose-950/40 border border-rose-900/50 py-2 rounded-lg">
                    {loginError}
                  </p>
                )}

                <button
                  type="submit"
                  className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-purple-950 text-sm"
                >
                  Ingresar al Sistema
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden">
          {/* BARRA LATERAL */}
          <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 overflow-y-auto hide-scrollbar">
            <div>
              <div className="flex items-center gap-3 px-2 py-3 mb-4 border-b border-slate-800">
                <div className="w-9 h-9 rounded-xl bg-purple-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-purple-900/50">
                  IC
                </div>
                <div>
                  <h1 className="font-bold text-base text-white leading-tight">ICONNECTURE</h1>
                  <p className="text-[10px] text-purple-400 font-medium">Gestión & Taller Pro</p>
                </div>
              </div>

              <nav className="space-y-1">
                {[
                  { id: 'dashboard', label: 'Resumen General', icon: 'fa-chart-pie' },
                  { id: 'taller', label: 'Taller & Recepción', icon: 'fa-wrench' },
                  { id: 'reparaciones', label: 'Cargar Reparación', icon: 'fa-microchip' },
                  { id: 'garantias', label: 'Control Garantías', icon: 'fa-shield-halved' },
                  { id: 'stock', label: 'Stock & Repuestos', icon: 'fa-boxes-stacked' },
                  { id: 'gastos', label: 'Gastos del Negocio', icon: 'fa-receipt' },
                  { id: 'medeben', label: 'Me Deben (Cuentas)', icon: 'fa-hand-holding-dollar' },
                  { id: 'comisiones', label: 'Comisiones Bruno', icon: 'fa-wallet' },
                  { id: 'socios', label: 'Socios y Reparto', icon: 'fa-users-gear' },
                  { id: 'cuentas', label: 'Gestión Cuentas', icon: 'fa-user-lock' },
                  { id: 'estadisticas', label: 'Estadísticas Globales', icon: 'fa-chart-line' },
                  { id: 'actividad', label: 'Registro Actividad', icon: 'fa-clock-rotate-left' },
                  { id: 'patrimonio', label: 'Patrimonio Bruno 🔒', icon: 'fa-lock' },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setVista(item.id)}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      vista === item.id 
                        ? 'bg-purple-600 text-white shadow-md shadow-purple-950' 
                        : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                    }`}
                  >
                    <i className={`fa-solid ${item.icon} w-4 text-center`}></i>
                    {item.label}
                  </button>
                ))}
              </nav>
            </div>

            <div className="border-t border-slate-800 pt-3 space-y-2">
              <div className="flex items-center justify-between px-2">
                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-full bg-purple-950 border border-purple-500/50 flex items-center justify-center text-purple-300 font-bold text-xs">
                    {usuarioSesion.nombre.charAt(0)}
                  </div>
                  <div>
                    <p className="text-xs font-bold text-white leading-tight">{usuarioSesion.nombre}</p>
                    <p className="text-[9px] text-slate-400">{usuarioSesion.rol}</p>
                  </div>
                </div>
                <button onClick={() => setUsuarioSesion(null)} title="Cerrar Sesión" className="text-slate-400 hover:text-rose-400 transition p-1 text-xs">
                  <i className="fa-solid fa-right-from-bracket"></i>
                </button>
              </div>
            </div>
          </aside>

          {/* MAIN AREA */}
          <div className="flex-1 flex flex-col overflow-hidden">
            <header className="bg-slate-900 border-b border-slate-800 px-6 py-3 flex justify-between items-center text-xs">
              <div className="flex items-center gap-4">
                <button
                  onClick={() => setModalDolar(true)}
                  className="bg-slate-950 border border-slate-800 hover:border-purple-500/50 px-3 py-1.5 rounded-xl font-mono text-purple-300 flex items-center gap-2 transition"
                >
                  <i className="fa-solid fa-dollar-sign text-emerald-400"></i>
                  <span>Dólar Hoy: <strong>${cotizacionDolar} ARS</strong></span>
                  <i className="fa-solid fa-pen text-[10px] text-slate-500"></i>
                </button>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setModoOculto(!modoOculto)}
                  className={`px-3 py-1.5 rounded-xl font-semibold flex items-center gap-2 border transition ${
                    modoOculto ? 'bg-amber-950/40 border-amber-800 text-amber-300' : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'
                  }`}
                >
                  <i className={`fa-solid ${modoOculto ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                  <span>{modoOculto ? 'Modo Privado' : 'Mostrador'}</span>
                </button>
              </div>
            </header>

            <main className="flex-1 overflow-y-auto p-8 bg-slate-950">
              
              {/* DASHBOARD */}
              {vista === 'dashboard' && (
                <div className="space-y-6">
                  <header>
                    <h2 className="text-2xl font-bold text-white">Resumen General del Negocio</h2>
                    <p className="text-slate-400 text-sm">Control financiero global y métricas operativas</p>
                  </header>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-1">
                      <p className="text-xs text-slate-400 font-medium">Ganancia Neta Total</p>
                      <h3 className="text-2xl font-black text-emerald-400">{fmtMoney(reparaciones.filter(r => r.estado_pago === 'Pagado').reduce((acc, r) => acc + r.mano_obra_usd, 0))}</h3>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-1">
                      <p className="text-xs text-slate-400 font-medium">Valor Stock Repuestos</p>
                      <h3 className="text-2xl font-black text-purple-400">{fmtMoney(totalValorStock)}</h3>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-1">

                <input type="number" placeholder="Ej: 1480" value={nuevaCotizacionInput} onChange={e => setNuevaCotizacionInput(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white font-mono text-center text-lg" />
                <div className="flex gap-2">
                  <button onClick={() => { if (nuevaCotizacionInput) { setCotizacionDolar(parseFloat(nuevaCotizacionInput)); setModalDolar(false); setNuevaCotizacionInput(''); } }} className="flex-1 bg-purple-600 text-white font-bold py-2 rounded-xl text-xs">Guardar</button>
                  <button onClick={() => setModalDolar(false)} className="bg-slate-800 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs">Cancelar</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL CARGAR REPARACIÓN */}
          {modalCargarReparacion && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-lg w-full space-y-4 max-h-[90vh] overflow-y-auto text-xs">
                <h3 className="font-bold text-white text-lg border-b border-slate-800 pb-2">Cargar Reparación Realizada</h3>
                <div>
                  <label className="block text-slate-400 mb-1">Seleccionar Equipo en Taller</label>
                  <select onChange={e => setEquipoSeleccionadoParaReparar(ordenes.find(o => o.id === parseInt(e.target.value)))} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                    <option value="">-- Elegir Equipo --</option>
                    {ordenes.filter(o => o.estado !== 'Entregado').map(o => (
                      <option key={o.id} value={o.id}>{o.equipo_modelo} - {o.cliente_nombre}</option>
                    ))}
                  </select>
                </div>

                {equipoSeleccionadoParaReparar && (
                  <div className="space-y-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Mano de Obra (Ganancia Neta)</label>
                      <input type="number" value={manoObraInput} onChange={e => setManoObraInput(e.target.value)} placeholder="0.00" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono" />
                    </div>
                    <div className="flex gap-2">
                      <button onClick={handleConfirmarReparacion} className="flex-1 bg-purple-600 text-white font-bold py-2.5 rounded-xl">Confirmar Reparación</button>
                      <button onClick={() => setModalCargarReparacion(false)} className="bg-slate-800 text-slate-300 font-bold px-4 py-2.5 rounded-xl">Cancelar</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
