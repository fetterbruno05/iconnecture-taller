<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICONNECTURE - System Suite Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Animaciones suaves para transiciones */
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-purple-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const USUARIOS_DEFAULT = [
      { id: '1', nombre: 'Bruno', pass: 'bruno123', rol: 'Administrador / Técnico' },
      { id: '2', nombre: 'Mateo', pass: 'mateo123', rol: 'Socio' },
      { id: '3', nombre: 'Yaco', pass: 'yaco123', rol: 'Empleado' },
      { id: '4', nombre: 'Priscila', pass: 'priscila123', rol: 'Contadora' }
    ];

    const GREMIOS_DEFAULT = ['ICONNECTURE', 'Nico', 'Román'];

    function App() {
      // ---------------- ESTADOS DE USUARIOS Y SESIÓN ----------------
      const [usuarios, setUsuarios] = useState(() => {
        const guardados = JSON.parse(localStorage.getItem('ic_usuarios'));
        if (!guardados || !Array.isArray(guardados)) return USUARIOS_DEFAULT;
        const nombresExistentes = guardados.map(u => u.nombre);
        const faltantes = USUARIOS_DEFAULT.filter(u => !nombresExistentes.includes(u.nombre));
        return [...guardados, ...faltantes];
      });

      const [usuarioSesion, setUsuarioSesion] = useState(null);
      const [loginUser, setLoginUser] = useState('Bruno');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      // ---------------- ESTADOS GLOBALES (TOPBAR) ----------------
      const [cotizacionDolar, setCotizacionDolar] = useState(() => parseFloat(localStorage.getItem('ic_cotizacion_dolar')) || 1450);
      const [modoOculto, setModoOculto] = useState(false);
      const [modalDolar, setModalDolar] = useState(false);
      const [nuevaCotizacionInput, setNuevaCotizacionInput] = useState('');
      const [urlSupabase, setUrlSupabase] = useState(() => localStorage.getItem('ic_url_supa') || '');
      const [keySupabase, setKeySupabase] = useState(() => localStorage.getItem('ic_key_supa') || '');
      const [vista, setVista] = useState('dashboard');
      const [listaGremios, setListaGremios] = useState(() => JSON.parse(localStorage.getItem('ic_lista_gremios')) || GREMIOS_DEFAULT);

      // ---------------- PATRIMONIO DE BRUNO (SÚPER SEGURO) ----------------
      const [pinPatrimonio, setPinPatrimonio] = useState(() => {
        const guardado = localStorage.getItem('ic_pin_patrimonio');
        return (guardado && guardado.length === 6) ? guardado : '123456';
      });
      const [patrimonioDesbloqueado, setPatrimonioDesbloqueado] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [nuevoPinInput, setNuevoPinInput] = useState('');
      const [saldoInicialBruno, setSaldoInicialBruno] = useState(() => parseFloat(localStorage.getItem('ic_saldo_inicial_bruno')) || 0);
      const [gastosPersonales, setGastosPersonales] = useState(() => JSON.parse(localStorage.getItem('ic_gastos_personales')) || []);
      const [gastosFijos, setGastosFijos] = useState(() => JSON.parse(localStorage.getItem('ic_gastos_fijos')) || []);

      // ---------------- BASE DE DATOS LOCAL (TABLAS) ----------------
      const [stockRepuestos, setStockRepuestos] = useState(() => JSON.parse(localStorage.getItem('ic_stock_repuestos')) || []);
      const [ordenes, setOrdenes] = useState(() => JSON.parse(localStorage.getItem('ic_ordenes')) || []);
      const [reparaciones, setReparaciones] = useState(() => JSON.parse(localStorage.getItem('ic_reparaciones')) || []);
      const [gastosNegocio, setGastosNegocio] = useState(() => JSON.parse(localStorage.getItem('ic_gastos_negocio')) || []);
      const [deudasFavor, setDeudasFavor] = useState(() => JSON.parse(localStorage.getItem('ic_deudas_favor')) || []);
      const [comisionesPagos, setComisionesPagos] = useState(() => JSON.parse(localStorage.getItem('ic_comisiones_pagos')) || []);
      const [logs, setLogs] = useState(() => JSON.parse(localStorage.getItem('ic_logs')) || []);

      // ---------------- FILTROS DE BÚSQUEDA (NUEVO) ----------------
      const [busquedaTaller, setBusquedaTaller] = useState('');
      const [busquedaReparaciones, setBusquedaReparaciones] = useState('');
      const [busquedaStock, setBusquedaStock] = useState('');
      const [busquedaGarantias, setBusquedaGarantias] = useState('');
      const [busquedaGastos, setBusquedaGastos] = useState('');
      const [busquedaDeudas, setBusquedaDeudas] = useState('');

      // ---------------- FORMULARIOS Y MODALES ----------------
      const [modalEditStock, setModalEditStock] = useState(null);
      const [tipoReparacionIngreso, setTipoReparacionIngreso] = useState('minorista');
      const [gremioSeleccionado, setGremioSeleccionado] = useState('ICONNECTURE');
      const [nuevoGremioNombre, setNuevoGremioNombre] = useState('');
      
      const [formIngreso, setFormIngreso] = useState({
        cliente_nombre: '', cliente_telefono: '', cliente_telefono_alt: '',
        equipo_modelo: '', imei_serie: '', prioridad: 'Moderada',
        falla_declarada: '', presupuesto_estimado: '', estado_fisico: ''
      });

      const [modalCargarReparacion, setModalCargarReparacion] = useState(false);
      const [equipoSeleccionadoParaReparar, setEquipoSeleccionadoParaReparar] = useState(null);
      const [repuestoStockSeleccionadoId, setRepuestoStockSeleccionadoId] = useState('');
      const [manoObraInput, setManoObraInput] = useState('');
      const [medioPagoInput, setMedioPagoInput] = useState('Efectivo USD');
      const [monedaCarga, setMonedaCarga] = useState('USD');

      const [passActual, setPassActual] = useState('');
      const [passNueva, setPassNueva] = useState('');
      const [msgPass, setMsgPass] = useState('');
      const [filtroUsuarioLog, setFiltroUsuarioLog] = useState('todos');
      const [filtroFechaLogDia, setFiltroFechaLogDia] = useState('');

      // ---------------- EFECTOS (GUARDADO EN LOCALSTORAGE) ----------------
      useEffect(() => { localStorage.setItem('ic_usuarios', JSON.stringify(usuarios)); }, [usuarios]);
      useEffect(() => { localStorage.setItem('ic_ordenes', JSON.stringify(ordenes)); }, [ordenes]);
      useEffect(() => { localStorage.setItem('ic_reparaciones', JSON.stringify(reparaciones)); }, [reparaciones]);
      useEffect(() => { localStorage.setItem('ic_gastos_negocio', JSON.stringify(gastosNegocio)); }, [gastosNegocio]);
      useEffect(() => { localStorage.setItem('ic_deudas_favor', JSON.stringify(deudasFavor)); }, [deudasFavor]);
      useEffect(() => { localStorage.setItem('ic_comisiones_pagos', JSON.stringify(comisionesPagos)); }, [comisionesPagos]);
      useEffect(() => { localStorage.setItem('ic_logs', JSON.stringify(logs)); }, [logs]);
      useEffect(() => { localStorage.setItem('ic_gastos_personales', JSON.stringify(gastosPersonales)); }, [gastosPersonales]);
      useEffect(() => { localStorage.setItem('ic_gastos_fijos', JSON.stringify(gastosFijos)); }, [gastosFijos]);
      useEffect(() => { localStorage.setItem('ic_stock_repuestos', JSON.stringify(stockRepuestos)); }, [stockRepuestos]);
      useEffect(() => { localStorage.setItem('ic_lista_gremios', JSON.stringify(listaGremios)); }, [listaGremios]);
      useEffect(() => { localStorage.setItem('ic_cotizacion_dolar', cotizacionDolar.toString()); }, [cotizacionDolar]);
      useEffect(() => { localStorage.setItem('ic_pin_patrimonio', pinPatrimonio); }, [pinPatrimonio]);
      useEffect(() => { localStorage.setItem('ic_saldo_inicial_bruno', saldoInicialBruno.toString()); }, [saldoInicialBruno]);

      // ---------------- FUNCIONES AUXILIARES ----------------
      const registrarLog = (modulo, accion, detalles) => {
        const nuevo = {
          id: Date.now(),
          usuario: usuarioSesion ? usuarioSesion.nombre : 'Sistema',
          modulo, accion, detalles,
          fecha: new Date().toISOString()
        };
        setLogs(prev => [nuevo, ...prev]);
      };

      const fmtMoney = (amountUSD, currency = 'USD') => {
        if (modoOculto) return '*** ' + currency;
        if (currency === 'ARS') {
          const ars = amountUSD * cotizacionDolar;
          return `$ ${ars.toLocaleString('es-AR', { maximumFractionDigits: 0 })} ARS`;
        }
        return `$ ${parseFloat(amountUSD || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
      };

      const esImeiValido = (imei) => {
        if (!imei) return true;
        return /^\d{15}$/.test(imei);
      };

      // ---------------- LÓGICA DE NEGOCIO ----------------
      const handleLogin = (e) => {
        e.preventDefault();
        const found = usuarios.find(u => u.nombre === loginUser);
        if (found && found.pass === loginPass) {
          setUsuarioSesion(found);
          setLoginError('');
          setLoginPass('');
          registrarLog('Seguridad', 'Inicio de Sesión', `Acceso de ${found.nombre}`);
        } else {
          setLoginError('Contraseña incorrecta');
        }
      };

      const cambiarPasswordUsuario = (e) => {
        e.preventDefault();
        if (passActual !== usuarioSesion.pass) {
          setMsgPass('❌ La contraseña actual es incorrecta.');
          return;
        }
        if (!passNueva || passNueva.length < 4) {
          setMsgPass('❌ La contraseña debe tener al menos 4 caracteres.');
          return;
        }
        const actualizados = usuarios.map(u => u.nombre === usuarioSesion.nombre ? { ...u, pass: passNueva } : u);
        setUsuarios(actualizados);
        setUsuarioSesion({ ...usuarioSesion, pass: passNueva });
        setPassActual('');
        setPassNueva('');
        setMsgPass('✅ Contraseña actualizada con éxito.');
        registrarLog('Seguridad', 'Cambio Clave', `${usuarioSesion.nombre} cambió su contraseña.`);
      };

      const handleGuardarIngreso = (e) => {
        e.preventDefault();
        if (formIngreso.imei_serie && !esImeiValido(formIngreso.imei_serie)) {
          alert('El IMEI debe contener exactamente 15 dígitos numéricos sin letras ni espacios.');
          return;
        }

        let clienteNombreFinal = formIngreso.cliente_nombre;
        let clienteTelFinal = formIngreso.cliente_telefono;

        if (tipoReparacionIngreso === 'gremio') {
          if (gremioSeleccionado === 'NUEVO') {
            if (!nuevoGremioNombre.trim()) {
              alert('Ingresá el nombre del nuevo gremio.');
              return;
            }
            clienteNombreFinal = `Gremio: ${nuevoGremioNombre.trim()}`;
            if (!listaGremios.includes(nuevoGremioNombre.trim())) {
              setListaGremios([...listaGremios, nuevoGremioNombre.trim()]);
            }
          } else {
            clienteNombreFinal = `Gremio: ${gremioSeleccionado}`;
          }
          clienteTelFinal = 'Gremio / Taller';
        }

        const antecedente = ordenes.find(o => o.imei_serie && o.imei_serie === formIngreso.imei_serie);
        if (antecedente) {
          alert(`⚠️ ALERTA DE REINGRESO: Este IMEI ya ingresó el ${new Date(antecedente.fecha_ingreso).toLocaleDateString()}.`);
        }

        const nuevaOrden = {
          id: Date.now(),
          tipo_cliente: tipoReparacionIngreso,
          cliente_nombre: clienteNombreFinal,
          cliente_telefono: clienteTelFinal,
          cliente_telefono_alt: tipoReparacionIngreso === 'minorista' ? formIngreso.cliente_telefono_alt : 'N/A',
          equipo_modelo: formIngreso.equipo_modelo,
          imei_serie: formIngreso.imei_serie,
          prioridad: formIngreso.prioridad,
          falla_declarada: formIngreso.falla_declarada,
          presupuesto_estimado: formIngreso.presupuesto_estimado,
          estado_fisico: formIngreso.estado_fisico,
          estado: 'Recibido',
          fecha_ingreso: new Date().toISOString()
        };

        setOrdenes([nuevaOrden, ...ordenes]);
        registrarLog('Taller', 'Nuevo Ingreso', `${formIngreso.equipo_modelo} - ${clienteNombreFinal}`);

        setFormIngreso({
          cliente_nombre: '', cliente_telefono: '', cliente_telefono_alt: '',
          equipo_modelo: '', imei_serie: '', prioridad: 'Moderada',
          falla_declarada: '', presupuesto_estimado: '', estado_fisico: ''
        });
        setNuevoGremioNombre('');
        alert('✅ Equipo ingresado al taller con éxito.');
      };

      const handleConfirmarReparacion = () => {
        if (!equipoSeleccionadoParaReparar) return;

        let costoRepuestoVal = 0;
        let repuestoNombre = 'Sin repuesto / Mantenimiento';

        if (repuestoStockSeleccionadoId) {
          const itemStock = stockRepuestos.find(s => s.id === parseInt(repuestoStockSeleccionadoId));
          if (itemStock) {
            costoRepuestoVal = itemStock.costo_unitario_usd;
            repuestoNombre = `${itemStock.categoria} (${itemStock.modelo})`;

            setStockRepuestos(stockRepuestos.map(s => {
              if (s.id === itemStock.id) {
                return { ...s, cantidad: Math.max(0, s.cantidad - 1) };
              }
              return s;
            }));
            registrarLog('Stock', 'Descuento por Reparación', `Descontada 1 unidad de ${itemStock.modelo}`);
          }
        }

        const manoObraVal = parseFloat(manoObraInput) || 0;
        let totalCobrado = costoRepuestoVal + manoObraVal;

        if (monedaCarga === 'ARS') totalCobrado = totalCobrado / cotizacionDolar;
        const gananciaNeta = manoObraVal / (monedaCarga === 'ARS' ? cotizacionDolar : 1);

        const nuevaRep = {
          id: Date.now(),
          orden_id: equipoSeleccionadoParaReparar.id,
          cliente_nombre: equipoSeleccionadoParaReparar.cliente_nombre,
          cliente_telefono: equipoSeleccionadoParaReparar.cliente_telefono,
          equipo_modelo: equipoSeleccionadoParaReparar.equipo_modelo,
          imei_serie: equipoSeleccionadoParaReparar.imei_serie,
          tipo_cliente: equipoSeleccionadoParaReparar.tipo_cliente,
          tecnico: usuarioSesion.nombre,
          repuestos: [{ nombre: repuestoNombre, costo: costoRepuestoVal }],
          costo_repuestos_usd: costoRepuestoVal,
          mano_obra_usd: gananciaNeta,
          total_usd: totalCobrado,
          medio_pago: medioPagoInput, // Se registra el medio de pago seleccionado
          estado_pago: 'Pendiente',
          fecha_completado: new Date().toISOString(),
          garantia_dias: 30
        };

        setReparaciones([nuevaRep, ...reparaciones]);
        setOrdenes(ordenes.map(o => o.id === equipoSeleccionadoParaReparar.id ? { ...o, estado: 'Listo para Entregar' } : o));
        registrarLog('Reparaciones', 'Carga Trabajo', `Reparación cargada para ${nuevaRep.equipo_modelo}`);

        setEquipoSeleccionadoParaReparar(null);
        setModalCargarReparacion(false);
        setRepuestoStockSeleccionadoId('');
        setManoObraInput('');
      };

      const marcarPagadoReparacion = (id) => {
        const rep = reparaciones.find(r => r.id === id);
        if (!rep) return;
        setReparaciones(reparaciones.map(r => r.id === id ? { ...r, estado_pago: 'Pagado', fecha_pago: new Date().toISOString() } : r));
        setOrdenes(ordenes.map(o => o.id === rep.orden_id ? { ...o, estado: 'Entregado', fecha_entrega: new Date().toISOString() } : o));
        registrarLog('Finanzas', 'Cobro Reparación', `Cobro registrado para ${rep.equipo_modelo} vía ${rep.medio_pago}`);
      };

      // ---------------- CÁLCULOS MEMORIZADOS ----------------
      const comisionesCalculadas = useMemo(() => {
        let saldoBruno = 0;
        reparaciones.filter(r => r.estado_pago === 'Pagado').forEach(r => {
          if (r.tipo_cliente === 'gremio') {
            saldoBruno += r.mano_obra_usd;
          } else {
            saldoBruno += (r.mano_obra_usd * 0.5);
          }
        });
        const totalPagado = comisionesPagos.reduce((acc, p) => acc + (parseFloat(p.monto_usd) || 0), 0);
        saldoBruno -= totalPagado;
        return {
          saldoFinal: saldoBruno,
          totalHistoricoGanado: reparaciones.filter(r => r.estado_pago === 'Pagado').reduce((acc, r) => acc + (r.tipo_cliente === 'gremio' ? r.mano_obra_usd : r.mano_obra_usd * 0.5), 0)
        };
      }, [reparaciones, comisionesPagos]);

      const totalValorStock = useMemo(() => {
        return stockRepuestos.reduce((acc, s) => acc + ((parseFloat(s.cantidad) || 0) * (parseFloat(s.costo_unitario_usd) || 0)), 0);
      }, [stockRepuestos]);

      const totalGastosFijosMensuales = useMemo(() => {
        return gastosFijos.reduce((acc, g) => acc + (parseFloat(g.monto_usd) || 0), 0);
      }, [gastosFijos]);

      // Filtros memorizados para rendimiento
      const ordenesFiltradas = useMemo(() => {
        return ordenes.filter(o => o.estado !== 'Entregado' && (
          o.equipo_modelo.toLowerCase().includes(busquedaTaller.toLowerCase()) || 
          o.cliente_nombre.toLowerCase().includes(busquedaTaller.toLowerCase())
        ));
      }, [ordenes, busquedaTaller]);

      const reparacionesFiltradas = useMemo(() => {
        return reparaciones.filter(r => 
          r.equipo_modelo.toLowerCase().includes(busquedaReparaciones.toLowerCase()) || 
          r.cliente_nombre.toLowerCase().includes(busquedaReparaciones.toLowerCase())
        );
      }, [reparaciones, busquedaReparaciones]);

      const stockFiltrado = useMemo(() => {
        return stockRepuestos.filter(s => 
          s.modelo.toLowerCase().includes(busquedaStock.toLowerCase()) || 
          s.categoria.toLowerCase().includes(busquedaStock.toLowerCase())
        );
      }, [stockRepuestos, busquedaStock]);

      const gastosFiltrados = useMemo(() => {
        return gastosNegocio.filter(g => 
          g.concepto.toLowerCase().includes(busquedaGastos.toLowerCase()) || 
          g.categoria.toLowerCase().includes(busquedaGastos.toLowerCase())
        );
      }, [gastosNegocio, busquedaGastos]);

      const deudasFiltradas = useMemo(() => {
        return deudasFavor.filter(d => d.deudor.toLowerCase().includes(busquedaDeudas.toLowerCase()));
      }, [deudasFavor, busquedaDeudas]);

      // ---------------- PANTALLA DE LOGIN (COMPLETA) ----------------
      if (!usuarioSesion) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 px-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 fade-in">
              <div className="text-center space-y-2">
                <div className="w-20 h-20 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-700 flex items-center justify-center text-white font-black text-3xl mx-auto shadow-lg shadow-purple-900/50 transform transition hover:scale-105">
                  IC
                </div>
                <h1 className="text-3xl font-extrabold text-white tracking-tight mt-4">ICONNECTURE</h1>
                <p className="text-xs text-purple-400 font-bold tracking-widest uppercase">System Suite Pro</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-5 pt-2">
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-3 text-center">SELECCIONAR USUARIO</label>
                  <div className="grid grid-cols-2 gap-3">
                    {usuarios.map(u => (
                      <button
                        key={u.id}
                        type="button"
                        onClick={() => { setLoginUser(u.nombre); setLoginError(''); }}
                        className={`py-3.5 px-3 rounded-2xl border text-xs font-semibold transition-all flex flex-col items-center justify-center ${
                          loginUser === u.nombre
                            ? 'bg-purple-600/20 border-purple-500 text-purple-300 shadow-md ring-2 ring-purple-500/30'
                            : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-600 hover:bg-slate-900'
                        }`}
                      >
                        <span className="font-bold text-white text-base">{u.nombre}</span>
                        <span className="text-[10px] text-slate-500 mt-1 uppercase tracking-wider">{u.rol.split('/')[0]}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-2 text-center">CONTRASEÑA DE {loginUser.toUpperCase()}</label>
                  <input
                    type="password"
                    required
                    value={loginPass}
                    onChange={e => setLoginPass(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-4 text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 text-center font-mono text-2xl tracking-widest transition-all"
                  />
                </div>

                {loginError && (
                  <p className="text-xs text-rose-400 font-bold text-center bg-rose-950/30 border border-rose-900/50 py-2.5 rounded-xl fade-in">
                    {loginError}
                  </p>
                )}

                <button
                  type="submit"
                  className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-purple-950 text-sm tracking-wide uppercase mt-2"
                >
                  Ingresar al Sistema
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ---------------- INTERFAZ PRINCIPAL ----------------
      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden font-sans">
          
          {/* BARRA LATERAL AMPLIADA Y MEJORADA */}
          <aside className="w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-5 overflow-y-auto hide-scrollbar shrink-0">
            <div>

                                alert('✅ PIN actualizado exitosamente.');
                              } else {
                                alert('❌ El PIN debe tener exactamente 6 números.');
                              }
                            }}
                            className="w-full sm:w-auto bg-purple-600 hover:bg-purple-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg"
                          >
                            Guardar Nuevo PIN
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ========================================================================= */}
              {/* 13. CONFIGURACIÓN API SUPABASE Y CUENTAS (OCULTAS AHORA SI NO ESTÁS EN ESAS PESTAÑAS) */}
              {/* ========================================================================= */}
              {vista === 'config' && (
                <div className="space-y-8 max-w-2xl mx-auto">
                  <header>
                    <h2 className="text-3xl font-extrabold text-white tracking-tight">Cloud & API</h2>
                    <p className="text-slate-400 text-sm mt-1">Conexión a base de datos externa para respaldo definitivo</p>
                  </header>

                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-xl space-y-6">
                    <div>
                      <label className="block text-xs text-slate-400 mb-2 font-bold uppercase tracking-widest">URL de Supabase</label>
                      <input type="text" value={urlSupabase} onChange={e => setUrlSupabase(e.target.value)} placeholder="https://xyz.supabase.co" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-sm focus:border-purple-500 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-2 font-bold uppercase tracking-widest">Anon / Public Key</label>
                      <input type="password" value={keySupabase} onChange={e => setKeySupabase(e.target.value)} placeholder="eyJhbGci..." className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-sm focus:border-purple-500 focus:outline-none" />
                    </div>
                    <button onClick={() => alert('✅ Datos de Supabase guardados localmente.')} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-4 rounded-xl text-sm shadow-lg shadow-purple-950 tracking-widest uppercase mt-4">
                      Guardar Configuración
                    </button>
                  </div>
                </div>
              )}

              {vista === 'cuentas' && (
                <div className="space-y-8 max-w-5xl mx-auto">
                  <header>
                    <h2 className="text-3xl font-extrabold text-white tracking-tight">Seguridad y Cuentas</h2>
                    <p className="text-slate-400 text-sm mt-1">Administración de credenciales de los usuarios habilitados</p>
                  </header>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-xl">
                      <h3 className="text-lg font-bold text-white mb-6">Staff de ICONNECTURE</h3>
                      <div className="space-y-3">
                        {usuarios.map(u => (
                          <div key={u.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                              <div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-white font-black text-sm">
                                {u.nombre.charAt(0)}
                              </div>
                              <div>
                                <p className="font-bold text-white text-base">{u.nombre}</p>
                                <p className="text-xs text-slate-500 font-medium">{u.rol}</p>
                              </div>
                            </div>
                            <span className="text-[10px] bg-emerald-950/50 text-emerald-400 px-3 py-1 rounded-md border border-emerald-900/50 font-bold uppercase tracking-widest">Activo</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-xl h-fit">
                      <h3 className="text-lg font-bold text-white mb-6">Cambiar Contraseña: {usuarioSesion.nombre}</h3>
                      <form onSubmit={cambiarPasswordUsuario} className="space-y-5">
                        <div>
                          <label className="block text-xs text-slate-400 mb-2 font-bold uppercase tracking-widest">Contraseña Actual</label>
                          <input type="password" required value={passActual} onChange={e => setPassActual(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-purple-500 focus:outline-none" />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-2 font-bold uppercase tracking-widest">Nueva Contraseña</label>
                          <input type="password" required value={passNueva} onChange={e => setPassNueva(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-purple-500 focus:outline-none" />
                        </div>
                        {msgPass && <p className="text-xs font-bold text-emerald-400 bg-emerald-950/30 border border-emerald-900/50 p-3 rounded-xl">{msgPass}</p>}
                        <button type="submit" className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-xl transition-colors tracking-widest uppercase text-sm mt-2">
                          Actualizar Clave
                        </button>
                      </form>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* ========================================================================= */}
          {/* MODALES FLOTANTES GLOBALES */}
          {/* ========================================================================= */}

          {/* MODAL CARGAR REPARACIÓN */}
          {modalCargarReparacion && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-lg w-full space-y-6 shadow-2xl max-h-[95vh] overflow-y-auto hide-scrollbar">
                <h3 className="font-black text-white text-2xl border-b border-slate-800 pb-4">Cargar Reparación</h3>
                
                <div className="space-y-4">
                  <div>
                    <label className="block text-slate-400 mb-2 font-bold text-xs uppercase tracking-wider">1. Seleccionar Equipo Terminado</label>
                    {ordenes.filter(o => o.estado !== 'Entregado').length === 0 ? (
                      <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 text-center text-slate-400 space-y-3">
                        <p>⚠️ No hay equipos ingresados en taller.</p>
                        <button type="button" onClick={() => { setModalCargarReparacion(false); setVista('taller'); }} className="text-purple-400 font-bold hover:underline">
                          Ir a Recepción de Taller
                        </button>
                      </div>
                    ) : (
                      <select onChange={e => setEquipoSeleccionadoParaReparar(ordenes.find(o => o.id === parseInt(e.target.value)))} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-white font-medium focus:border-purple-500 focus:outline-none">
                        <option value="">-- Elegir Equipo en Taller --</option>
                        {ordenes.filter(o => o.estado !== 'Entregado').map(o => (
                          <option key={o.id} value={o.id}>{o.equipo_modelo} ({o.cliente_nombre})</option>
                        ))}
                      </select>
                    )}
                  </div>

                  {equipoSeleccionadoParaReparar && (
                    <div className="space-y-5 pt-2 fade-in">
                      <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                        <div>
                          <p className="font-bold text-white text-base">{equipoSeleccionadoParaReparar.equipo_modelo}</p>
                          <p className="text-xs text-slate-500 mt-0.5">{equipoSeleccionadoParaReparar.cliente_nombre}</p>
                        </div>
                        <span className="text-[9px] font-black uppercase tracking-widest bg-slate-800 text-slate-300 px-2 py-1 rounded">{equipoSeleccionadoParaReparar.tipo_cliente}</span>
                      </div>

                      <div>
                        <label className="block text-slate-400 mb-2 font-bold text-xs uppercase tracking-wider">2. Repuesto Usado (Descuenta Stock)</label>
                        <select
                          value={repuestoStockSeleccionadoId}
                          onChange={e => setRepuestoStockSeleccionadoId(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-white font-medium focus:border-purple-500 focus:outline-none"
                        >
                          <option value="">-- Mantenimiento (Sin Repuesto) --</option>
                          {stockRepuestos.map(s => (
                            <option key={s.id} value={s.id}>
                              {s.modelo} (Disponibles: {s.cantidad} | Costo: ${s.costo_unitario_usd})
                            </option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-400 mb-2 font-bold text-xs uppercase tracking-wider">3. Costo Mano de Obra (Neto)</label>
                        <input type="number" value={manoObraInput} onChange={e => setManoObraInput(e.target.value)} placeholder="Ej: 45.00" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-white font-mono text-lg focus:border-purple-500 focus:outline-none" />
                      </div>

                      <div>
                        <label className="block text-slate-400 mb-2 font-bold text-xs uppercase tracking-wider">4. Medio de Pago</label>
                        <select
                          value={medioPagoInput}
                          onChange={e => setMedioPagoInput(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-medium focus:border-purple-500 focus:outline-none"
                        >
                          <option value="Efectivo USD">Efectivo USD</option>
                          <option value="Efectivo ARS">Efectivo ARS</option>
                          <option value="Transferencia">Transferencia</option>
                          <option value="POSNET">POSNET / Tarjeta</option>
                        </select>
                      </div>

                      <div className="flex gap-3 pt-4 border-t border-slate-800">
                        <button onClick={handleConfirmarReparacion} className="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl transition-colors text-sm uppercase tracking-wide">Confirmar Trabajo</button>
                        <button onClick={() => setModalCargarReparacion(false)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-6 py-4 rounded-xl text-sm uppercase tracking-wide">Cancelar</button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* MODAL EDITAR DÓLAR */}
            {modalDolar && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
                <div className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full space-y-6 shadow-2xl">
                  <h3 className="font-black text-white text-xl text-center">Actualizar Cotización</h3>
                  <div className="bg-slate-950 p-4 rounded-2xl border border-emerald-900/50 flex justify-center items-center gap-3">
                    <i className="fa-solid fa-money-bill-1-wave text-emerald-500 text-2xl"></i>
                    <input type="number" placeholder={cotizacionDolar} value={nuevaCotizacionInput} onChange={e => setNuevaCotizacionInput(e.target.value)} className="w-32 bg-transparent text-white font-mono text-3xl text-center focus:outline-none font-black" />
                  </div>
                  <div className="flex gap-3">
                    <button onClick={() => { if (nuevaCotizacionInput) { setCotizacionDolar(parseFloat(nuevaCotizacionInput)); setModalDolar(false); setNuevaCotizacionInput(''); } }} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition-colors uppercase tracking-widest text-xs">Guardar</button>
                    <button onClick={() => setModalDolar(false)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-6 py-3.5 rounded-xl uppercase tracking-widest text-xs transition-colors">Volver</button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
