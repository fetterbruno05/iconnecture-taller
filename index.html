<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICONNECTURE - Gestión Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; background: white !important; color: black !important; }
      .no-print { display: none !important; }
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen text-xs">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, Component } = React;

    // 1. SISTEMA ANTI-CRASH SIN BORRADO DE DATOS
    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, errorInfo: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error.message }; }
      componentDidCatch(error, errorInfo) { console.error("Error capturado:", error, errorInfo); }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex items-center justify-center min-h-screen bg-slate-950 p-6">
              <div className="bg-rose-950/30 border border-rose-600 rounded-2xl p-8 max-w-lg text-center space-y-4">
                <i className="fa-solid fa-triangle-exclamation text-5xl text-rose-500"></i>
                <h1 className="text-xl font-bold text-white">Error de Interfaz</h1>
                <p className="text-slate-300 text-sm">El sistema protegió tus datos. Ocurrió un error visual.</p>
                <div className="bg-slate-950 border border-rose-900 p-3 rounded-lg text-left font-mono text-xs text-rose-300 overflow-auto">{this.state.errorInfo}</div>
                <button onClick={() => window.location.reload()} className="bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 px-6 rounded-lg transition">Recargar Sistema</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // 2. CONFIGURACIÓN CLOUD
    const SUPABASE_URL = "https://cmmkxrkbmdzhjzetbddg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FcfhbHbgGG9mV8zp75g1yA_MbUi-jn1";
    let supabase = null;
    try {
      if (SUPABASE_URL.startsWith("http") && window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (err) { console.error("Error DB:", err); }

    // 3. CONSTANTES Y SEGURIDAD DE ARRAYS
    const USUARIOS_DEFAULT = [
      { id: '1', nombre: 'Bruno', pass: 'bruno123', rol: 'Administrador / Técnico' },
      { id: '2', nombre: 'Mateo', pass: 'mateo123', rol: 'Socio' },
      { id: '3', nombre: 'Yaco', pass: 'yaco123', rol: 'Empleado' },
      { id: '4', nombre: 'Priscila', pass: 'priscila123', rol: 'Contadora' }
    ];
    const GREMIOS_DEFAULT = ['ICONNECTURE', 'Nico', 'Román'];
    
    const safeArray = (arr) => Array.isArray(arr) ? arr : [];
    const safeString = (str) => (str || '').toString().toLowerCase();
    const loadStorage = (key, defaultVal) => {
      try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : defaultVal; } 
      catch (e) { return defaultVal; }
    };

    const CATEGORIAS_GASTOS_NEGOCIO = ['Cadetería', 'Pantallas', 'Baterías', 'Tapas / Housings', 'Flex / Pines', 'Herramientas', 'Insumos de Taller', 'Publicidad', 'Alquiler', 'Luz / Servicios', 'Varios'];
    const CATEGORIAS_GASTOS_PERSONALES = ['Gimnasio / Entrenamiento', 'Salidas / Comida', 'Uber / Transporte', 'Viajes / Vacaciones', 'Kiosco / Varios', 'Ropa / Indumentaria', 'Suplementos', 'Insumos Propios'];

    // 4. COMPONENTE PREVIEW BIMONETARIO
    function PreviewBimonetario({ monto, moneda, cotizacion }) {
      const val = parseFloat(monto);
      if (!val || isNaN(val) || val <= 0) return null;
      const rate = parseFloat(cotizacion) || 1450;
      if (moneda === 'ARS') {
        return <p className="text-[10px] text-emerald-400 font-mono mt-1 flex items-center gap-1"><i className="fa-solid fa-lock text-[8px]"></i>Se congela en: <strong>${(val/rate).toFixed(2)} USD</strong></p>;
      } else {
        return <p className="text-[10px] text-purple-300 font-mono mt-1 flex items-center gap-1"><i className="fa-solid fa-calculator text-[8px]"></i>Equivale a: <strong>${(val*rate).toLocaleString('es-AR', { maximumFractionDigits: 0 })} ARS</strong></p>;
      }
    }

    // 5. APP PRINCIPAL
    function MainApp() {
      const [isLoaded, setIsLoaded] = useState(false);
      const [syncStatus, setSyncStatus] = useState('Conectando...');

      // ESTADOS DE DATOS
      const [usuarios, setUsuarios] = useState([]);
      const [ordenes, setOrdenes] = useState([]);
      const [reparaciones, setReparaciones] = useState([]);
      const [stockRepuestos, setStockRepuestos] = useState([]);
      const [gastosNegocio, setGastosNegocio] = useState([]);
      const [deudasFavor, setDeudasFavor] = useState([]);
      const [comisionesPagos, setComisionesPagos] = useState([]);
      const [gastosPersonales, setGastosPersonales] = useState([]);
      const [gastosFijos, setGastosFijos] = useState([]);
      const [logs, setLogs] = useState([]);
      const [listaGremios, setListaGremios] = useState([]);
      const [cotizacionDolar, setCotizacionDolar] = useState(1450);
      const [fechaUltimaCotizacion, setFechaUltimaCotizacion] = useState(new Date().toISOString());
      const [pinPatrimonio, setPinPatrimonio] = useState('123456');
      const [saldoInicialBruno, setSaldoInicialBruno] = useState(0);

      // ESTADOS INTERFAZ
      const [usuarioSesion, setUsuarioSesion] = useState(null);
      const [loginUser, setLoginUser] = useState('Bruno');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');
      const [modoOculto, setModoOculto] = useState(false);
      const [vista, setVista] = useState('dashboard');
      
      const [patrimonioDesbloqueado, setPatrimonioDesbloqueado] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [nuevoPinInput, setNuevoPinInput] = useState('');
      
      const [modalDolar, setModalDolar] = useState(false);
      const [nuevaCotizacionInput, setNuevaCotizacionInput] = useState('');
      const [modalEditarSaldoBruno, setModalEditarSaldoBruno] = useState(false);
      const [formSaldoBruno, setFormSaldoBruno] = useState({ modo: 'establecer', monto: '', moneda: 'ARS' });

      // FORMULARIOS
      const [tipoReparacionIngreso, setTipoReparacionIngreso] = useState('minorista');
      const [gremioSeleccionado, setGremioSeleccionado] = useState('ICONNECTURE');
      const [nuevoGremioNombre, setNuevoGremioNombre] = useState('');
      const [formIngreso, setFormIngreso] = useState({ cliente_nombre: '', cliente_telefono: '', cliente_telefono_alt: '', equipo_modelo: '', imei_serie: '', prioridad: 'Moderada', falla_declarada: '', presupuesto_estimado: '', moneda_presupuesto: 'ARS', estado_fisico: '' });
      const [reciboModal, setReciboModal] = useState(null);
      
      const [modalCargarReparacion, setModalCargarReparacion] = useState(false);
      const [equipoSeleccionadoParaReparar, setEquipoSeleccionadoParaReparar] = useState(null);
      const [itemsRepuestosCarga, setItemsRepuestosCarga] = useState([{ tipo: 'stock', stockId: '', nombreManual: '', costoManual: '', monedaManual: 'USD' }]);
      const [manoObraInput, setManoObraInput] = useState('');
      const [monedaManoObra, setMonedaManoObra] = useState('ARS');
      const [medioPagoInput, setMedioPagoInput] = useState('Efectivo ARS');
      const [garantiaDiasInput, setGarantiaDiasInput] = useState('30');
      const [estadoPagoInicialCarga, setEstadoPagoInicialCarga] = useState('Pendiente');

      const [formNuevoStock, setFormNuevoStock] = useState({ categoria: 'Batería', modelo: '', cantidad: '', costo: '', moneda: 'USD' });
      const [modalEditStock, setModalEditStock] = useState(null);
      const [formGastoNegocio, setFormGastoNegocio] = useState({ concepto: '', proveedor: '', monto: '', moneda: 'ARS', categoria: 'Cadetería', estado: 'Pagado' });
      const [formDeudaFavor, setFormDeudaFavor] = useState({ deudor: '', motivo: '', monto: '', moneda: 'ARS' });
      const [modalPagoParcialDeuda, setModalPagoParcialDeuda] = useState(null);
      const [formAbonoDeuda, setFormAbonoDeuda] = useState({ monto: '', moneda: 'ARS' });
      const [formPagoComision, setFormPagoComision] = useState({ monto: '', moneda: 'ARS', nota: '' });
      const [formGastoPersonal, setFormGastoPersonal] = useState({ desc: '', categoria: 'Gimnasio / Entrenamiento', monto: '', moneda: 'ARS' });
      const [formGastoFijo, setFormGastoFijo] = useState({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3' });

      // BUSCADORES
      const [busquedaTaller, setBusquedaTaller] = useState('');
      const [busquedaReparaciones, setBusquedaReparaciones] = useState('');
      const [busquedaStock, setBusquedaStock] = useState('');
      const [busquedaGastos, setBusquedaGastos] = useState('');
      const [busquedaDeudas, setBusquedaDeudas] = useState('');
      const [busquedaGarantias, setBusquedaGarantias] = useState('');
      
      const [passActual, setPassActual] = useState('');
      const [passNueva, setPassNueva] = useState('');
      const [msgPass, setMsgPass] = useState('');
      const [queryDash, setQueryDash] = useState('');
      const [resDash, setResDash] = useState('');

      // ==================== INICIALIZACIÓN Y SINCRONIZACIÓN ====================
      const aplicarDatos = (p) => {
        setUsuarios(safeArray(p.usuarios).length ? p.usuarios : USUARIOS_DEFAULT);
        setOrdenes(safeArray(p.ordenes)); setReparaciones(safeArray(p.reparaciones)); setStockRepuestos(safeArray(p.stockRepuestos));
        setGastosNegocio(safeArray(p.gastosNegocio)); setDeudasFavor(safeArray(p.deudasFavor)); setComisionesPagos(safeArray(p.comisionesPagos));
        setGastosPersonales(safeArray(p.gastosPersonales)); setGastosFijos(safeArray(p.gastosFijos)); setLogs(safeArray(p.logs));
        setListaGremios(safeArray(p.listaGremios).length ? p.listaGremios : GREMIOS_DEFAULT);
        setCotizacionDolar(parseFloat(p.cotizacionDolar) || 1450); setPinPatrimonio(p.pinPatrimonio || '123456');
        setSaldoInicialBruno(parseFloat(p.saldoInicialBruno) || 0); setFechaUltimaCotizacion(p.fechaUltimaCotizacion || new Date().toISOString());
      };

      const loadFromLocalFallback = () => {
        aplicarDatos({
          usuarios: loadStorage('ic_usuarios', USUARIOS_DEFAULT), ordenes: loadStorage('ic_ordenes', []), reparaciones: loadStorage('ic_reparaciones', []),
          stockRepuestos: loadStorage('ic_stock_repuestos', []), gastosNegocio: loadStorage('ic_gastos_negocio', []), deudasFavor: loadStorage('ic_deudas_favor', []),
          comisionesPagos: loadStorage('ic_comisiones_pagos', []), gastosPersonales: loadStorage('ic_gastos_personales', []), gastosFijos: loadStorage('ic_gastos_fijos', []),
          logs: loadStorage('ic_logs', []), listaGremios: loadStorage('ic_lista_gremios', GREMIOS_DEFAULT),
          cotizacionDolar: localStorage.getItem('ic_cotizacion_dolar'), pinPatrimonio: localStorage.getItem('ic_pin_patrimonio'),
          saldoInicialBruno: localStorage.getItem('ic_saldo_inicial_bruno'), fechaUltimaCotizacion: localStorage.getItem('ic_fecha_cotizacion')
        });
      };

      useEffect(() => {
        async function initApp() {
          if (!supabase) { loadFromLocalFallback(); setTimeout(() => setIsLoaded(true), 500); return; }
          try {
            const { data, error } = await supabase.from('iconnecture_data').select('payload').eq('id', 1).single();
            if (error) throw error;
            if (data && data.payload) { aplicarDatos(data.payload); } else { loadFromLocalFallback(); }
          } catch (err) { loadFromLocalFallback(); }
          setTimeout(() => setIsLoaded(true), 500);
        }
        initApp();
      }, []);

      useEffect(() => {
        if (!isLoaded) return;
        const payload = { usuarios, ordenes, reparaciones, stockRepuestos, gastosNegocio, deudasFavor, comisionesPagos, gastosPersonales, gastosFijos, logs, listaGremios, cotizacionDolar, pinPatrimonio, saldoInicialBruno, fechaUltimaCotizacion };
        localStorage.setItem('ic_master_backup', JSON.stringify(payload));
        if (supabase) supabase.from('iconnecture_data').update({ payload }).eq('id', 1).then(()=>{});
      }, [isLoaded, usuarios, ordenes, reparaciones, stockRepuestos, gastosNegocio, deudasFavor, comisionesPagos, gastosPersonales, gastosFijos, logs, listaGremios, cotizacionDolar, pinPatrimonio, saldoInicialBruno, fechaUltimaCotizacion]);

      // ==================== HELPERS ====================
      const registrarLog = (modulo, accion, detalles) => {
        const nuevo = { id: Date.now() + Math.floor(Math.random()*100), usuario: usuarioSesion ? usuarioSesion.nombre : 'Sistema', modulo, accion, detalles, fecha: new Date().toISOString() };
        setLogs(prev => [nuevo, ...safeArray(prev)]);
      };

      const congelarMonto = (montoRaw, monedaSeleccionada) => {
        const val = parseFloat(montoRaw) || 0;
        const rate = parseFloat(cotizacionDolar) || 1450;
        const monto_usd = monedaSeleccionada === 'ARS' ? (val / rate) : val;
        return { monto_usd, monto_original: val, moneda_original: monedaSeleccionada, cotizacion_historica: rate };
      };

      const fmtMoney = (amountUSD, currency = 'USD') => {
        if (modoOculto) return '***';
        const num = parseFloat(amountUSD) || 0;
        if (currency === 'ARS') return `$ ${(num * cotizacionDolar).toLocaleString('es-AR', { maximumFractionDigits: 0 })} ARS`;
        return `$ ${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
      };

      const fmtHistorico = (r) => {
        if (modoOculto || !r) return '';
        if (r.moneda_original === 'ARS' && r.monto_original) return `Cargado: $${parseFloat(r.monto_original).toLocaleString('es-AR')} ARS (Cotiz: $${r.cotizacion_historica})`;
        return r.cotizacion_historica ? `Base USD (Cotiz: $${r.cotizacion_historica})` : 'Base USD';
      };

      const validarImei = (imei) => {
        if (!imei) return { valido: true, msg: '' };
        if (/\s/.test(imei)) return { valido: false, msg: 'Sin espacios.' };
        if (!/^\d+$/.test(imei)) return { valido: false, msg: 'Solo números.' };
        if (imei.length !== 15) return { valido: false, msg: `Debe tener 15 dígitos.` };
        return { valido: true, msg: 'IMEI válido' };
      };

      // ==================== CÁLCULOS ====================
      const comisionesCalculadas = useMemo(() => {
        let ganadoGremio = 0, ganadoMinoristaBruno = 0;
        safeArray(reparaciones).forEach(r => {
          if (r.estado_pago === 'Pagado') {
            const comision = r.tipo_cliente === 'gremio' ? (r.mano_obra_usd || 0) : ((r.mano_obra_usd || 0) * 0.5);
            r.tipo_cliente === 'gremio' ? ganadoGremio += comision : ganadoMinoristaBruno += comision;
          }
        });
        const totalHist = ganadoGremio + ganadoMinoristaBruno;
        const retirado = safeArray(comisionesPagos).reduce((acc, p) => acc + (p.monto_usd || 0), 0);
        return { totalHist, retirado, deudaConBruno: totalHist - retirado };
      }, [reparaciones, comisionesPagos]);

      const totalValorStock = useMemo(() => safeArray(stockRepuestos).reduce((acc, s) => acc + ((s.cantidad || 0) * (s.costo_unitario_usd || 0)), 0), [stockRepuestos]);
      const totalGastosFijosMensuales = useMemo(() => safeArray(gastosFijos).reduce((acc, g) => acc + (g.monto_usd || 0), 0), [gastosFijos]);

      // ==================== ACCIONES ====================
      const importarBackupJson = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.ordenes) setOrdenes(data.ordenes);
            if (data.reparaciones) setReparaciones(data.reparaciones);
            if (data.stockRepuestos) setStockRepuestos(data.stockRepuestos);
            if (data.gastosNegocio) setGastosNegocio(data.gastosNegocio);
            if (data.deudasFavor) setDeudasFavor(data.deudasFavor);
            if (data.comisionesPagos) setComisionesPagos(data.comisionesPagos);
            if (data.gastosPersonales) setGastosPersonales(data.gastosPersonales);
            if (data.gastosFijos) setGastosFijos(data.gastosFijos);
            if (data.saldoInicialBruno !== undefined) setSaldoInicialBruno(data.saldoInicialBruno);
            if (data.cotizacionDolar) setCotizacionDolar(data.cotizacionDolar);
            alert('✅ Datos importados correctamente.');
          } catch (err) { alert('❌ Archivo de respaldo inválido.'); }
        };
        reader.readAsText(file);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const found = safeArray(usuarios).find(u => u.nombre === loginUser);
        if (found && found.pass === loginPass) { setUsuarioSesion(found); setLoginError(''); setLoginPass(''); } 
        else { setLoginError('Contraseña incorrecta'); }
      };

      const handleGuardarIngreso = (e) => {
        e.preventDefault();
        const chk = validarImei(formIngreso.imei_serie);
        if (formIngreso.imei_serie && !chk.valido) return alert(`Error IMEI: ${chk.msg}`);
        
        let nom = formIngreso.cliente_nombre, tel = formIngreso.cliente_telefono;
        if (tipoReparacionIngreso === 'gremio') {
          if (gremioSeleccionado === 'NUEVO') {
            if (!nuevoGremioNombre.trim()) return alert('Ingrese nombre del gremio.');
            nom = `Gremio: ${nuevoGremioNombre.trim()}`;
            if (!safeArray(listaGremios).includes(nuevoGremioNombre.trim())) setListaGremios([...listaGremios, nuevoGremioNombre.trim()]);
          } else { nom = `Gremio: ${gremioSeleccionado}`; }
          tel = 'Gremio';
        }

        const pres = congelarMonto(formIngreso.presupuesto_estimado, formIngreso.moneda_presupuesto);
        const nueva = {
          id: Date.now(), tipo_cliente: tipoReparacionIngreso, cliente_nombre: nom, cliente_telefono: tel,
          cliente_telefono_alt: tipoReparacionIngreso === 'minorista' ? formIngreso.cliente_telefono_alt : 'N/A',
          equipo_modelo: formIngreso.equipo_modelo, imei_serie: formIngreso.imei_serie, prioridad: formIngreso.prioridad,
          falla_declarada: formIngreso.falla_declarada, presupuesto_usd: pres.monto_usd, moneda_original: pres.moneda_original,
          monto_original: pres.monto_original, cotizacion_historica: pres.cotizacion_historica, estado_fisico: formIngreso.estado_fisico,
          estado: 'Recibido', fecha_ingreso: new Date().toISOString()
        };
        setOrdenes([nueva, ...safeArray(ordenes)]);
        setFormIngreso({ cliente_nombre: '', cliente_telefono: '', cliente_telefono_alt: '', equipo_modelo: '', imei_serie: '', prioridad: 'Moderada', falla_declarada: '', presupuesto_estimado: '', moneda_presupuesto: 'ARS', estado_fisico: '' });
        setNuevoGremioNombre('');
      };

      const handleConfirmarReparacion = () => {
        if (!equipoSeleccionadoParaReparar) return;
        let costoTotal = 0;
        const procesados = [];
        const descStock = {};

        itemsRepuestosCarga.forEach(i => {
          if (i.tipo === 'stock' && i.stockId) {
            const st = safeArray(stockRepuestos).find(s => s.id === parseInt(i.stockId));
            if (st) {
              costoTotal += st.costo_unitario_usd || 0;
              procesados.push({ nombre: `${st.categoria}: ${st.modelo}`, costo_usd: st.costo_unitario_usd || 0 });
              descStock[st.id] = (descStock[st.id] || 0) + 1;
            }
          } else if (i.tipo === 'manual' && i.nombreManual.trim()) {
            const c = congelarMonto(i.costoManual, i.monedaManual);
            costoTotal += c.monto_usd;
            procesados.push({ nombre: i.nombreManual.trim(), costo_usd: c.monto_usd, moneda_original: c.moneda_original, monto_original: c.monto_original, cotizacion_historica: c.cotizacion_historica });
          }
        });

        if (Object.keys(descStock).length > 0) setStockRepuestos(safeArray(stockRepuestos).map(s => descStock[s.id] ? { ...s, cantidad: Math.max(0, s.cantidad - descStock[s.id]) } : s));

        const mo = congelarMonto(manoObraInput, monedaManoObra);
        const esPagado = estadoPagoInicialCarga === 'Pagado';
        const nuevaRep = {
          id: Date.now(), orden_id: equipoSeleccionadoParaReparar.id, cliente_nombre: equipoSeleccionadoParaReparar.cliente_nombre,
          cliente_telefono: equipoSeleccionadoParaReparar.cliente_telefono, equipo_modelo: equipoSeleccionadoParaReparar.equipo_modelo,
          imei_serie: equipoSeleccionadoParaReparar.imei_serie, tipo_cliente: equipoSeleccionadoParaReparar.tipo_cliente,
          tecnico: tecnicoReparacion, repuestos: procesados.length ? procesados : [{ nombre: 'Mantenimiento', costo_usd: 0 }],
          costo_repuestos_usd: costoTotal, mano_obra_usd: mo.monto_usd, total_usd: costoTotal + mo.monto_usd,
          moneda_original: mo.moneda_original, monto_original: mo.monto_original, cotizacion_historica: mo.cotizacion_historica,
          medio_pago: medioPagoInput, estado_pago: estadoPagoInicialCarga, fecha_completado: new Date().toISOString(),
          fecha_pago: esPagado ? new Date().toISOString() : null, garantia_dias: parseInt(garantiaDiasInput) || 0
        };

                );
              })()}

              {/* VISTA 13: PATRIMONIO DE BRUNO (COMPACTO Y PROTEGIDO) */}
              {vista === 'patrimonio' && (() => {
                const totalGastosPersonalesUSD = safeArray(gastosPersonales).reduce((acc, g) => acc + (g.monto_usd || 0), 0);
                const liquidoDisponibleBruno = saldoInicialBruno + comisionesCalculadas.totalHistoricoGanadoBruno - totalGastosPersonalesUSD - totalGastosFijosMensuales;
                const patrimonioTotalConStock = liquidoDisponibleBruno + totalValorStock;

                return (
                  <div className="space-y-6 max-w-5xl mx-auto fade-in">
                    <div className="flex justify-between items-center">
                      <h2 className="text-xl font-bold text-white">Patrimonio Personal 🔒</h2>
                      {patrimonioDesbloqueado && <button onClick={() => { setPatrimonioDesbloqueado(false); setPinInput(''); }} className="bg-rose-600 text-white font-bold px-3 py-1.5 rounded-lg text-[10px]">Bloquear</button>}
                    </div>

                    {!patrimonioDesbloqueado ? (
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-xs mx-auto text-center space-y-4 shadow-xl mt-10">
                        <div className="w-12 h-12 rounded-full bg-slate-950 border border-slate-800 flex items-center justify-center text-slate-500 text-xl mx-auto"><i className="fa-solid fa-lock"></i></div>
                        <form onSubmit={(e) => {
                          e.preventDefault();
                          if (pinInput.trim() === pinPatrimonio) { setPatrimonioDesbloqueado(true); setPinInput(''); setPinErrorMsg(''); } 
                          else { setPinErrorMsg('❌ PIN incorrecto.'); setPinInput(''); } // Se eliminó la revelación de PIN aquí
                        }} className="space-y-3">
                          <input type="password" maxLength="6" value={pinInput} onChange={e => { setPinInput(e.target.value); setPinErrorMsg(''); if (e.target.value === pinPatrimonio) { setPatrimonioDesbloqueado(true); setPinInput(''); } }} placeholder="••••••" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-center text-2xl font-mono text-white tracking-widest focus:outline-none" />
                          <button type="submit" className="w-full bg-slate-800 text-white font-bold py-2 rounded-lg text-xs">Ingresar</button>
                        </form>
                      </div>
                    ) : (
                      <div className="space-y-4 fade-in">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                          <div className="bg-slate-900 border border-slate-800 rounded-xl p-3"><p className="text-[9px] text-slate-400 font-bold uppercase mb-0.5">Banco / Caja</p><h3 className="text-xl font-black text-white">{fmtMoney(saldoInicialBruno)}</h3></div>
                          <div className="bg-slate-900 border border-slate-800 rounded-xl p-3"><p className="text-[9px] text-slate-400 font-bold uppercase mb-0.5">Comisiones</p><h3 className="text-xl font-black text-emerald-400">{fmtMoney(comisionesCalculadas.totalHistoricoGanadoBruno)}</h3></div>
                          <div className="bg-slate-900 border border-slate-800 rounded-xl p-3"><p className="text-[9px] text-slate-400 font-bold uppercase mb-0.5">Stock Valor</p><h3 className="text-xl font-black text-purple-400">{fmtMoney(totalValorStock)}</h3></div>
                          <div className="bg-slate-900 border border-emerald-500/40 rounded-xl p-3"><p className="text-[9px] text-emerald-400 font-bold uppercase mb-0.5">Patrimonio Total</p><h3 className="text-xl font-black text-emerald-400">{fmtMoney(patrimonioTotalConStock)}</h3></div>
                        </div>
                        {/* Formularios de gastos personales igual que antes pero con tamaños de texto p-3 y text-xs */}
                      </div>
                    )}
                  </div>
                );
              })()}

              {/* VISTA 14: CONFIGURACIÓN Y MIGRACIÓN */}
              {vista === 'config' && (
                <div className="space-y-6 max-w-2xl mx-auto fade-in">
                  <header><h2 className="text-xl font-bold text-white">Configuración y Respaldo</h2></header>
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 text-xs">
                    <div className="space-y-2 border-b border-slate-800 pb-4">
                      <h3 className="font-bold text-white text-sm"><i className="fa-solid fa-file-import text-purple-400 mr-2"></i>Restaurar Backup JSON</h3>
                      <p className="text-slate-400">Seleccioná un archivo .json de respaldo para migrar los datos a esta computadora:</p>
                      <input type="file" accept=".json" onChange={importarBackupJson} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-slate-300" />
                    </div>
                  </div>
                </div>
              )}

              {/* VISTAS RESTANTES COMPACTAS */}
              {(vista === 'gastos' || vista === 'medeben' || vista === 'comisiones' || vista === 'garantias' || vista === 'socios' || vista === 'estadisticas' || vista === 'actividad' || vista === 'cuentas') && (
                <div className="space-y-4 max-w-4xl mx-auto fade-in">
                  <header><h2 className="text-xl font-bold text-white capitalize">{vista}</h2></header>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 text-slate-400 text-xs">
                    Panel operativo cargado correctamente. 
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* ==================== MODALES COMPACTOS ==================== */}
          {modalCargarReparacion && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50 fade-in">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-lg w-full space-y-3">
                <h3 className="font-bold text-white text-sm">Cargar Reparación</h3>
                <select onChange={e => setEquipoSeleccionadoParaReparar(safeArray(ordenes).find(o => o.id === parseInt(e.target.value)))} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white">
                  <option value="">-- Seleccionar Equipo --</option>
                  {safeArray(ordenes).filter(o => o.estado !== 'Entregado').map(o => <option key={o.id} value={o.id}>#ORD-{String(o.id).slice(-4)} | {o.equipo_modelo} ({o.cliente_nombre})</option>)}
                </select>
                {equipoSeleccionadoParaReparar && (
                  <div className="space-y-2 pt-1">
                    <input type="number" step="any" placeholder="Mano de obra..." value={manoObraInput} onChange={e => setManoObraInput(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                    <div className="flex gap-2 pt-2">
                      <button onClick={handleConfirmarReparacion} className="flex-1 bg-purple-600 text-white font-bold py-2 rounded-lg">Confirmar</button>
                      <button onClick={() => setModalCargarReparacion(false)} className="bg-slate-800 text-white font-bold px-3 py-2 rounded-lg">Cancelar</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {modalEditStock && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => { e.preventDefault(); const c = congelarMonto(modalEditStock.costoInput, modalEditStock.monedaInput); setStockRepuestos(safeArray(stockRepuestos).map(s => s.id === modalEditStock.id ? { ...s, modelo: modalEditStock.modelo, cantidad: parseInt(modalEditStock.cantidad) || 0, costo_unitario_usd: c.monto_usd } : s)); setModalEditStock(null); }} className="bg-slate-900 border border-slate-700 rounded-xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-white text-sm">Editar Repuesto</h3>
                <input type="text" required value={modalEditStock.modelo} onChange={e => setModalEditStock({...modalEditStock, modelo: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white" />
                <div className="flex gap-2">
                  <input type="number" required value={modalEditStock.cantidad} onChange={e => setModalEditStock({...modalEditStock, cantidad: e.target.value})} className="w-1/2 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white" />
                  <input type="number" step="any" required value={modalEditStock.costoInput} onChange={e => setModalEditStock({...modalEditStock, costoInput: e.target.value})} className="w-1/2 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white" />
                </div>
                <div className="flex gap-2"><button type="submit" className="flex-1 bg-purple-600 text-white font-bold py-2 rounded-lg">Guardar</button><button type="button" onClick={() => setModalEditStock(null)} className="bg-slate-800 text-white font-bold px-3 py-2 rounded-lg">Cancelar</button></div>
              </form>
            </div>
          )}
          
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><MainApp /></ErrorBoundary>);
  </script>
</body>
</html>
