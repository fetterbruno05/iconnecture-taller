<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICONNECTURE - System Suite Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; background: white !important; color: black !important; }
      .no-print { display: none !important; }
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-purple-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Lectura segura de LocalStorage para evitar pantallas azules por datos corruptos
    const loadStorage = (key, defaultVal) => {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null || raw === undefined) return defaultVal;
        const parsed = JSON.parse(raw);
        return parsed !== null ? parsed : defaultVal;
      } catch (e) {
        console.warn('Recuperando valor por defecto para:', key);
        return defaultVal;
      }
    };

    const USUARIOS_DEFAULT = [
      { id: '1', nombre: 'Bruno', pass: 'bruno123', rol: 'Administrador / Técnico' },
      { id: '2', nombre: 'Mateo', pass: 'mateo123', rol: 'Socio' },
      { id: '3', nombre: 'Yaco', pass: 'yaco123', rol: 'Empleado' },
      { id: '4', nombre: 'Priscila', pass: 'priscila123', rol: 'Contadora' }
    ];

    const GREMIOS_DEFAULT = ['ICONNECTURE', 'Nico', 'Román'];

    const TAGS_ESTADO_FISICO = [
      'Apagado', 'Encendido', 'Mojado', 'Pantalla astillada', 'Tapa trasera rota',
      'Marco golpeado', 'Táctil no responde', 'Sin bandeja SIM', 'Cámara fallando', 'Batería hinchada'
    ];

    const CATEGORIAS_GASTOS_NEGOCIO = [
      'Cadetería', 'Pantallas', 'Baterías', 'Tapas / Housings', 'Flex / Pines',
      'Herramientas', 'Insumos de Taller', 'Publicidad', 'Alquiler', 'Luz / Servicios', 'Varios'
    ];

    const CATEGORIAS_GASTOS_PERSONALES = [
      'Gimnasio / Entrenamiento', 'Salidas / Comida', 'Uber / Transporte',
      'Viajes / Vacaciones', 'Kiosco / Varios', 'Ropa / Indumentaria', 'Suplementos', 'Insumos Propios'
    ];

    // Componente de Vista Previa Bimonetaria en Vivo
    function ConversionPreview({ monto, moneda, cotizacion }) {
      const val = parseFloat(monto);
      if (!val || isNaN(val) || val <= 0) return null;
      const rate = parseFloat(cotizacion) || 1450;
      if (moneda === 'ARS') {
        const usd = val / rate;
        return (
          <p className="text-[11px] text-emerald-400 font-mono mt-1 flex items-center gap-1.5">
            <i className="fa-solid fa-lock text-[9px]"></i>
            Se congelará en: <strong>${usd.toFixed(2)} USD</strong> (Cotización fijada: ${rate} ARS)
          </p>
        );
      } else {
        const ars = val * rate;
        return (
          <p className="text-[11px] text-purple-300 font-mono mt-1 flex items-center gap-1.5">
            <i className="fa-solid fa-lock text-[9px]"></i>
            Equivale hoy a: <strong>${ars.toLocaleString('es-AR', { maximumFractionDigits: 0 })} ARS</strong> (Cotiz: ${rate})
          </p>
        );
      }
    }

    function App() {
      // ==================== 1. USUARIOS Y SESIÓN ====================
      const [usuarios, setUsuarios] = useState(() => {
        const guardados = loadStorage('ic_usuarios', USUARIOS_DEFAULT);
        if (!Array.isArray(guardados)) return USUARIOS_DEFAULT;
        const nombresExistentes = guardados.map(u => u.nombre);
        const faltantes = USUARIOS_DEFAULT.filter(u => !nombresExistentes.includes(u.nombre));
        return [...guardados, ...faltantes];
      });

      const [usuarioSesion, setUsuarioSesion] = useState(null);
      const [loginUser, setLoginUser] = useState('Bruno');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      // ==================== 2. COTIZACIÓN DÓLAR & PRIVACIDAD ====================
      const [cotizacionDolar, setCotizacionDolar] = useState(() => {
        const val = parseFloat(localStorage.getItem('ic_cotizacion_dolar'));
        return (!isNaN(val) && val > 0) ? val : 1450;
      });
      const [fechaUltimaCotizacion, setFechaUltimaCotizacion] = useState(() => {
        return localStorage.getItem('ic_fecha_cotizacion') || new Date().toISOString();
      });
      const [modoOculto, setModoOculto] = useState(false);
      const [modalDolar, setModalDolar] = useState(false);
      const [nuevaCotizacionInput, setNuevaCotizacionInput] = useState('');

      // ==================== 3. NAVEGACIÓN & CONFIG ====================
      const [vista, setVista] = useState('dashboard');
      const [listaGremios, setListaGremios] = useState(() => loadStorage('ic_lista_gremios', GREMIOS_DEFAULT));
      const [urlSupabase, setUrlSupabase] = useState(() => localStorage.getItem('ic_url_supa') || '');
      const [keySupabase, setKeySupabase] = useState(() => localStorage.getItem('ic_key_supa') || '');

      // ==================== 4. PATRIMONIO DE BRUNO (PIN 6 DÍGITOS) ====================
      const [pinPatrimonio, setPinPatrimonio] = useState(() => {
        const guardado = localStorage.getItem('ic_pin_patrimonio');
        return (guardado && /^\d{6}$/.test(guardado)) ? guardado : '123456';
      });
      const [patrimonioDesbloqueado, setPatrimonioDesbloqueado] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinErrorMsg, setPinErrorMsg] = useState('');
      const [nuevoPinInput, setNuevoPinInput] = useState('');
      const [saldoInicialBruno, setSaldoInicialBruno] = useState(() => {
        const val = parseFloat(localStorage.getItem('ic_saldo_inicial_bruno'));
        return !isNaN(val) ? val : 0;
      });
      const [modalEditarSaldoBruno, setModalEditarSaldoBruno] = useState(false);
      const [formSaldoBruno, setFormSaldoBruno] = useState({ modo: 'establecer', monto: '', moneda: 'ARS' });

      const [gastosPersonales, setGastosPersonales] = useState(() => loadStorage('ic_gastos_personales', []));
      const [gastosFijos, setGastosFijos] = useState(() => loadStorage('ic_gastos_fijos', []));
      const [formGastoPersonal, setFormGastoPersonal] = useState({ desc: '', categoria: 'Gimnasio / Entrenamiento', monto: '', moneda: 'ARS' });
      const [formGastoFijo, setFormGastoFijo] = useState({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3' });

      // ==================== 5. BASES DE DATOS DEL NEGOCIO ====================
      const [stockRepuestos, setStockRepuestos] = useState(() => loadStorage('ic_stock_repuestos', []));
      const [ordenes, setOrdenes] = useState(() => loadStorage('ic_ordenes', []));
      const [reparaciones, setReparaciones] = useState(() => loadStorage('ic_reparaciones', []));
      const [gastosNegocio, setGastosNegocio] = useState(() => loadStorage('ic_gastos_negocio', []));
      const [deudasFavor, setDeudasFavor] = useState(() => loadStorage('ic_deudas_favor', []));
      const [comisionesPagos, setComisionesPagos] = useState(() => loadStorage('ic_comisiones_pagos', []));
      const [logs, setLogs] = useState(() => loadStorage('ic_logs', []));

      // ==================== 6. ESTADOS DE TALLER Y RECEPCIÓN (PUNTO 7) ====================
      const [tipoReparacionIngreso, setTipoReparacionIngreso] = useState('minorista');
      const [gremioSeleccionado, setGremioSeleccionado] = useState('ICONNECTURE');
      const [nuevoGremioNombre, setNuevoGremioNombre] = useState('');
      const [formIngreso, setFormIngreso] = useState({
        cliente_nombre: '', cliente_telefono: '', cliente_telefono_alt: '', cliente_email: '',
        origen_cliente: 'Nuevo',
        equipo_modelo: '', imei_serie: '', prioridad: 'Moderada',
        falla_declarada: '', presupuesto_estimado: '', moneda_presupuesto: 'ARS',
        estado_fisico: '',
        tuvo_reparacion_previa: 'no', detalle_reparacion_previa: '', taller_previo: '', fecha_previa: ''
      });
      const [reciboModal, setReciboModal] = useState(null);

      // Filtros de Taller
      const [busquedaTaller, setBusquedaTaller] = useState('');
      const [filtroPrioridadTaller, setFiltroPrioridadTaller] = useState('Todas');
      const [filtroEstadoTaller, setFiltroEstadoTaller] = useState('Todos');
      const [filtroTipoTaller, setFiltroTipoTaller] = useState('Todos');
      const [filtroFechaDesdeTaller, setFiltroFechaDesdeTaller] = useState('');
      const [filtroFechaHastaTaller, setFiltroFechaHastaTaller] = useState('');

      // ==================== 7. ESTADOS DE CARGAR REPARACIÓN (PUNTO 9) ====================
      const [modalCargarReparacion, setModalCargarReparacion] = useState(false);
      const [busquedaEquipoModal, setBusquedaEquipoModal] = useState('');
      const [equipoSeleccionadoParaReparar, setEquipoSeleccionadoParaReparar] = useState(null);
      const [tecnicoReparacion, setTecnicoReparacion] = useState('Bruno');
      const [itemsRepuestosCarga, setItemsRepuestosCarga] = useState([
        { tipo: 'stock', stockId: '', nombreManual: '', costoManual: '', monedaManual: 'USD' }
      ]);
      const [manoObraInput, setManoObraInput] = useState('');
      const [monedaManoObra, setMonedaManoObra] = useState('ARS');
      const [medioPagoInput, setMedioPagoInput] = useState('Efectivo ARS');
      const [garantiaDiasInput, setGarantiaDiasInput] = useState('30');
      const [estadoPagoInicialCarga, setEstadoPagoInicialCarga] = useState('Pendiente');

      // Filtros de Reparaciones
      const [busquedaReparaciones, setBusquedaReparaciones] = useState('');
      const [filtroEstadoPagoRep, setFiltroEstadoPagoRep] = useState('Todos');
      const [filtroTipoClienteRep, setFiltroTipoClienteRep] = useState('Todos');
      const [filtroFechaDesdeRep, setFiltroFechaDesdeRep] = useState('');
      const [filtroFechaHastaRep, setFiltroFechaHastaRep] = useState('');

      // ==================== 8. ESTADOS DE STOCK (CON MONEDA ARS/USD) ====================
      const [formNuevoStock, setFormNuevoStock] = useState({
        categoria: 'Batería', modelo: '', cantidad: '', costo: '', moneda: 'USD'
      });
      const [modalEditStock, setModalEditStock] = useState(null);
      const [busquedaStock, setBusquedaStock] = useState('');
      const [filtroCategoriaStock, setFiltroCategoriaStock] = useState('Todas');

      // ==================== 9. ESTADOS DE GASTOS DEL NEGOCIO (PUNTO 5) ====================
      const [formGastoNegocio, setFormGastoNegocio] = useState({
        concepto: '', proveedor: '', monto: '', moneda: 'ARS',
        categoria: 'Cadetería', medio_pago: 'Efectivo ARS', estado: 'Pagado'
      });
      const [busquedaGastos, setBusquedaGastos] = useState('');
      const [filtroCatGastos, setFiltroCatGastos] = useState('Todas');
      const [filtroEstadoGastos, setFiltroEstadoGastos] = useState('Todos');
      const [filtroTiempoGastos, setFiltroTiempoGastos] = useState('todos'); // todos, hoy, semana, mes, mes_anterior, personalizado
      const [filtroDesdeGastos, setFiltroDesdeGastos] = useState('');
      const [filtroHastaGastos, setFiltroHastaGastos] = useState('');

      // ==================== 10. ESTADOS DE "ME DEBEN" (PUNTO 4) ====================
      const [formDeudaFavor, setFormDeudaFavor] = useState({
        deudor: '', motivo: '', telefono: '', monto: '', moneda: 'ARS'
      });
      const [modalPagoParcialDeuda, setModalPagoParcialDeuda] = useState(null);
      const [formAbonoDeuda, setFormAbonoDeuda] = useState({ monto: '', moneda: 'ARS' });
      const [busquedaDeudas, setBusquedaDeudas] = useState('');
      const [filtroEstadoDeudas, setFiltroEstadoDeudas] = useState('Pendiente');

      // ==================== 11. ESTADOS DE COMISIONES BRUNO (PUNTO 6) ====================
      const [formPagoComision, setFormPagoComision] = useState({
        monto: '', moneda: 'ARS', medio_pago: 'Efectivo ARS', nota: ''
      });

      // ==================== 12. ESTADOS DE GARANTÍAS, LOGS Y ASISTENTE ====================
      const [busquedaGarantias, setBusquedaGarantias] = useState('');
      const [filtroEstadoGarantia, setFiltroEstadoGarantia] = useState('Todas');
      const [filtroDesdeGarantia, setFiltroDesdeGarantia] = useState('');
      const [filtroHastaGarantia, setFiltroHastaGarantia] = useState('');

      const [filtroUsuarioLog, setFiltroUsuarioLog] = useState('todos');
      const [filtroFechaLogDia, setFiltroFechaLogDia] = useState('');
      const [filtroBuscadorLog, setFiltroBuscadorLog] = useState('');

      const [passActual, setPassActual] = useState('');
      const [passNueva, setPassNueva] = useState('');
      const [msgPass, setMsgPass] = useState('');

      const [queryDash, setQueryDash] = useState('');
      const [resDash, setResDash] = useState('');

      // ==================== PERSISTENCIA EN LOCALSTORAGE ====================
      useEffect(() => { localStorage.setItem('ic_usuarios', JSON.stringify(usuarios)); }, [usuarios]);
      useEffect(() => { localStorage.setItem('ic_ordenes', JSON.stringify(ordenes)); }, [ordenes]);
      useEffect(() => { localStorage.setItem('ic_reparaciones', JSON.stringify(reparaciones)); }, [reparaciones]);
      useEffect(() => { localStorage.setItem('ic_gastos_negocio', JSON.stringify(gastosNegocio)); }, [gastosNegocio]);
      useEffect(() => { localStorage.setItem('ic_deudas_favor', JSON.stringify(deudasFavor)); }, [deudasFavor]);
      useEffect(() => { localStorage.setItem('ic_comisiones_pagos', JSON.stringify(comisionesPagos)); }, [comisionesPagos]);
      useEffect(() => { localStorage.setItem('ic_logs', JSON.stringify(logs)); }, [logs]);
      useEffect(() => { localStorage.setItem('ic_gastos_personales', JSON.stringify(gastosPersonales)); }, [gastosPersonales]);
      useEffect(() => { localStorage.setItem('ic_gastos_fijos', JSON.stringify(gastosFijos)); }, [gastosFijos]);
      useEffect(() => { localStorage.setItem('ic_stock_repuestos', JSON.stringify(stockRepuestos)); }, [stockRepuestos]);
      useEffect(() => { localStorage.setItem('ic_lista_gremios', JSON.stringify(listaGremios)); }, [listaGremios]);
      useEffect(() => { localStorage.setItem('ic_cotizacion_dolar', cotizacionDolar.toString()); }, [cotizacionDolar]);
      useEffect(() => { localStorage.setItem('ic_fecha_cotizacion', fechaUltimaCotizacion); }, [fechaUltimaCotizacion]);
      useEffect(() => { localStorage.setItem('ic_pin_patrimonio', pinPatrimonio); }, [pinPatrimonio]);
      useEffect(() => { localStorage.setItem('ic_saldo_inicial_bruno', saldoInicialBruno.toString()); }, [saldoInicialBruno]);
      useEffect(() => { localStorage.setItem('ic_url_supa', urlSupabase); }, [urlSupabase]);
      useEffect(() => { localStorage.setItem('ic_key_supa', keySupabase); }, [keySupabase]);

      // ==================== HELPERS FINANCIEROS E INMUTABILIDAD ====================
      const registrarLog = (modulo, accion, detalles) => {
        const nuevo = {
          id: Date.now() + Math.floor(Math.random() * 1000),
          usuario: usuarioSesion ? usuarioSesion.nombre : 'Sistema',
          modulo,
          accion,
          detalles,
          fecha: new Date().toISOString()
        };
        setLogs(prev => [nuevo, ...prev]);
      };

      // Convierte un monto ingresado (ARS o USD) en un paquete contable congelado con la cotización actual
      const congelarMonto = (montoRaw, monedaSeleccionada) => {
        const val = parseFloat(montoRaw) || 0;
        const rate = parseFloat(cotizacionDolar) || 1450;
        const monto_usd = monedaSeleccionada === 'ARS' ? (val / rate) : val;
        const monto_ars_historico = monedaSeleccionada === 'ARS' ? val : (val * rate);
        return {
          monto_usd,
          monto_original: val,
          moneda_original: monedaSeleccionada,
          cotizacion_historica: rate,
          monto_ars_historico
        };
      };

      const fmtMoney = (amountUSD, currency = 'USD') => {
        if (modoOculto) return '*** ' + currency;
        const num = parseFloat(amountUSD) || 0;
        if (currency === 'ARS') {
          const ars = num * cotizacionDolar;
          return `$ ${ars.toLocaleString('es-AR', { maximumFractionDigits: 0 })} ARS`;
        }
        return `$ ${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
      };

      // Muestra la etiqueta histórica inmutable si fue cargado en ARS
      const fmtHistorico = (registro) => {
        if (modoOculto) return '***';
        if (!registro) return '';
        if (registro.moneda_original === 'ARS' && registro.monto_original) {
          return `Cargado: $${parseFloat(registro.monto_original).toLocaleString('es-AR', { maximumFractionDigits: 0 })} ARS (Dólar fijado: $${registro.cotizacion_historica})`;
        }
        if (registro.cotizacion_historica) {
          return `Cargado en USD (Dólar ref: $${registro.cotizacion_historica})`;
        }
        return 'Base USD';
      };

      // Validación estricta de 15 dígitos numéricos para IMEI (Punto 11)
      const validarImei = (imei) => {
        if (!imei || imei === '') return { valido: true, msg: '' };
        if (/\s/.test(imei)) return { valido: false, msg: 'No se permiten espacios.' };
        if (!/^\d+$/.test(imei)) return { valido: false, msg: 'Solo se permiten números (sin letras ni símbolos).' };
        if (imei.length < 15) return { valido: false, msg: `Faltan ${15 - imei.length} dígitos (tiene ${imei.length}/15).` };
        if (imei.length > 15) return { valido: false, msg: `Sobran ${imei.length - 15} dígitos (tiene ${imei.length}/15).` };
        return { valido: true, msg: 'IMEI válido (15 dígitos)' };
      };

      // Alerta de antigüedad de la cotización del dólar (>24 hs)
      const cotizacionVencida = useMemo(() => {
        const diffHoras = (new Date() - new Date(fechaUltimaCotizacion)) / (1000 * 60 * 60);
        return diffHoras >= 24;
      }, [fechaUltimaCotizacion]);

      // Historial clínico por IMEI en tiempo real al escribir en recepción
      const antecedentesImeiActual = useMemo(() => {
        const imei = formIngreso.imei_serie;
        if (!imei || imei.length !== 15) return [];
        const enOrdenes = ordenes.filter(o => o.imei_serie === imei);
        const enReparaciones = reparaciones.filter(r => r.imei_serie === imei);
        return { ordenes: enOrdenes, reparaciones: enReparaciones };
      }, [formIngreso.imei_serie, ordenes, reparaciones]);

      // ==================== HANDLERS DE NEGOCIO ====================
      const handleLogin = (e) => {
        e.preventDefault();
        const found = usuarios.find(u => u.nombre === loginUser);
        if (found && found.pass === loginPass) {
          setUsuarioSesion(found);
          setLoginError('');
          setLoginPass('');
          registrarLog('Seguridad', 'Inicio de Sesión', `Ingresó al sistema ${found.nombre} (${found.rol})`);
        } else {
          setLoginError('Contraseña incorrecta');
        }
      };

      const cambiarPasswordUsuario = (e) => {
        e.preventDefault();
        if (passActual !== usuarioSesion.pass) {
          setMsgPass('❌ La contraseña actual es incorrecta.');
          return;
        }
        if (!passNueva || passNueva.length < 4) {
          setMsgPass('❌ La nueva contraseña debe tener al menos 4 caracteres.');
          return;
        }
        const actualizados = usuarios.map(u => u.nombre === usuarioSesion.nombre ? { ...u, pass: passNueva } : u);
        setUsuarios(actualizados);
        setUsuarioSesion({ ...usuarioSesion, pass: passNueva });
        setPassActual('');
        setPassNueva('');
        setMsgPass('✅ Contraseña actualizada con éxito.');
        registrarLog('Seguridad', 'Cambio de Clave', `${usuarioSesion.nombre} actualizó su contraseña.`);
      };

      // Guardar Ingreso en Taller (Punto 7)
      const handleGuardarIngreso = (e) => {
        e.preventDefault();
        const checkImei = validarImei(formIngreso.imei_serie);
        if (formIngreso.imei_serie && !checkImei.valido) {
          alert(`❌ Error en IMEI: ${checkImei.msg}`);
          return;
        }

        let clienteNombreFinal = formIngreso.cliente_nombre;
        let clienteTelFinal = formIngreso.cliente_telefono;

        if (tipoReparacionIngreso === 'gremio') {
          if (gremioSeleccionado === 'NUEVO') {
            if (!nuevoGremioNombre.trim()) {
              alert('Ingresá el nombre del nuevo cliente de gremio.');
              return;
            }
            clienteNombreFinal = `Gremio: ${nuevoGremioNombre.trim()}`;
            if (!listaGremios.includes(nuevoGremioNombre.trim())) {
              setListaGremios([...listaGremios, nuevoGremioNombre.trim()]);
            }
          } else {
            clienteNombreFinal = `Gremio: ${gremioSeleccionado}`;
          }
          clienteTelFinal = 'Gremio';
        }

        const presCongelado = congelarMonto(formIngreso.presupuesto_estimado, formIngreso.moneda_presupuesto);

        const nuevaOrden = {
          id: Date.now(),
          tipo_cliente: tipoReparacionIngreso,
          cliente_nombre: clienteNombreFinal,
          cliente_telefono: clienteTelFinal,
          cliente_telefono_alt: tipoReparacionIngreso === 'minorista' ? formIngreso.cliente_telefono_alt : 'N/A',
          cliente_email: tipoReparacionIngreso === 'minorista' ? formIngreso.cliente_email : '',
          origen_cliente: tipoReparacionIngreso === 'minorista' ? formIngreso.origen_cliente : 'Gremio',
          equipo_modelo: formIngreso.equipo_modelo,
          imei_serie: formIngreso.imei_serie,
          prioridad: formIngreso.prioridad,
          falla_declarada: formIngreso.falla_declarada,
          presupuesto_usd: presCongelado.monto_usd,
          moneda_original: presCongelado.moneda_original,
          monto_original: presCongelado.monto_original,
          cotizacion_historica: presCongelado.cotizacion_historica,
          estado_fisico: formIngreso.estado_fisico,
          tuvo_reparacion_previa: formIngreso.tuvo_reparacion_previa,
          detalle_reparacion_previa: formIngreso.detalle_reparacion_previa,
          taller_previo: formIngreso.taller_previo,
          fecha_previa: formIngreso.fecha_previa,
          estado: 'Recibido',
          fecha_ingreso: new Date().toISOString()
        };

        setOrdenes([nuevaOrden, ...ordenes]);
        registrarLog('Taller', 'Ingreso de Equipo', `${formIngreso.equipo_modelo} (${clienteNombreFinal}) - Prioridad ${formIngreso.prioridad}`);

        setFormIngreso({
          cliente_nombre: '', cliente_telefono: '', cliente_telefono_alt: '', cliente_email: '',
          origen_cliente: 'Nuevo',
          equipo_modelo: '', imei_serie: '', prioridad: 'Moderada',
          falla_declarada: '', presupuesto_estimado: '', moneda_presupuesto: 'ARS',
          estado_fisico: '',
          tuvo_reparacion_previa: 'no', detalle_reparacion_previa: '', taller_previo: '', fecha_previa: ''
        });
        setNuevoGremioNombre('');
      };

      // Confirmar Reparación Realizada (Punto 9)
      const handleConfirmarReparacion = () => {
        if (!equipoSeleccionadoParaReparar) return;

        const rateActual = parseFloat(cotizacionDolar) || 1450;
        let costoRepuestosTotalUSD = 0;
        const repuestosProcesados = [];
        const descuentosDeStock = {};

        itemsRepuestosCarga.forEach(item => {
          if (item.tipo === 'stock' && item.stockId) {
            const st = stockRepuestos.find(s => s.id === parseInt(item.stockId));
            if (st) {
              costoRepuestosTotalUSD += parseFloat(st.costo_unitario_usd) || 0;
              repuestosProcesados.push({
                nombre: `${st.categoria}: ${st.modelo}`,
                costo_usd: parseFloat(st.costo_unitario_usd) || 0,
                origen: 'Stock'
              });
              descuentosDeStock[st.id] = (descuentosDeStock[st.id] || 0) + 1;
            }
          } else if (item.tipo === 'manual' && item.nombreManual.trim()) {
            const cCongelado = congelarMonto(item.costoManual, item.monedaManual);
            costoRepuestosTotalUSD += cCongelado.monto_usd;
            repuestosProcesados.push({
              nombre: item.nombreManual.trim(),
              costo_usd: cCongelado.monto_usd,
              moneda_original: cCongelado.moneda_original,
              monto_original: cCongelado.monto_original,
              cotizacion_historica: cCongelado.cotizacion_historica,
              origen: 'Manual'
            });
          }
        });

        // Descontar unidades del Stock si se usaron repuestos del inventario
        if (Object.keys(descuentosDeStock).length > 0) {
          setStockRepuestos(stockRepuestos.map(s => {
            if (descuentosDeStock[s.id]) {
              return { ...s, cantidad: Math.max(0, s.cantidad - descuentosDeStock[s.id]) };
            }
            return s;
          }));
        }

        const moCongelada = congelarMonto(manoObraInput, monedaManoObra);
        const gananciaNetaUSD = moCongelada.monto_usd;
        const totalCobradoUSD = costoRepuestosTotalUSD + gananciaNetaUSD;
        const esPagado = estadoPagoInicialCarga === 'Pagado';

        const nuevaRep = {
          id: Date.now(),
          orden_id: equipoSeleccionadoParaReparar.id,
          cliente_nombre: equipoSeleccionadoParaReparar.cliente_nombre,
          cliente_telefono: equipoSeleccionadoParaReparar.cliente_telefono,
          origen_cliente: equipoSeleccionadoParaReparar.origen_cliente || 'Nuevo',
          equipo_modelo: equipoSeleccionadoParaReparar.equipo_modelo,
          imei_serie: equipoSeleccionadoParaReparar.imei_serie,
          tipo_cliente: equipoSeleccionadoParaReparar.tipo_cliente,
          tecnico: tecnicoReparacion,
          repuestos: repuestosProcesados.length > 0 ? repuestosProcesados : [{ nombre: 'Sin repuesto / Mantenimiento', costo_usd: 0 }],
          costo_repuestos_usd: costoRepuestosTotalUSD,
          mano_obra_usd: gananciaNetaUSD,
          total_usd: totalCobradoUSD,
          moneda_original: moCongelada.moneda_original,
          monto_original: moCongelada.monto_original,
          cotizacion_historica: rateActual,
          medio_pago: medioPagoInput,
          estado_pago: estadoPagoInicialCarga,
          fecha_completado: new Date().toISOString(),
          fecha_pago: esPagado ? new Date().toISOString() : null,
          garantia_dias: parseInt(garantiaDiasInput) || 0
        };

        setReparaciones([nuevaRep, ...reparaciones]);
        setOrdenes(ordenes.map(o => o.id === equipoSeleccionadoParaReparar.id ? {
          ...o,
          estado: esPagado ? 'Entregado' : 'Listo para Entregar',
          fecha_entrega: esPagado ? new Date().toISOString() : null
        } : o));

        registrarLog('Reparaciones', 'Cierre de Reparación', `${nuevaRep.equipo_modelo} (${nuevaRep.cliente_nombre}) - Neto: $${gananciaNetaUSD.toFixed(2)} USD (${estadoPagoInicialCarga})`);

        setEquipoSeleccionadoParaReparar(null);
        setModalCargarReparacion(false);
        setItemsRepuestosCarga([{ tipo: 'stock', stockId: '', nombreManual: '', costoManual: '', monedaManual: 'USD' }]);
        setManoObraInput('');
      };

      const marcarPagadoReparacion = (id) => {
        const rep = reparaciones.find(r => r.id === id);
        if (!rep) return;
        const ahora = new Date().toISOString();
        setReparaciones(reparaciones.map(r => r.id === id ? { ...r, estado_pago: 'Pagado', fecha_pago: ahora } : r));
        setOrdenes(ordenes.map(o => o.id === rep.orden_id ? { ...o, estado: 'Entregado', fecha_entrega: ahora } : o));
        registrarLog('Finanzas', 'Cobro de Reparación', `Se cobró reparación de ${rep.equipo_modelo} (${rep.cliente_nombre}) por $${rep.total_usd.toFixed(2)} USD`);
      };

      // ==================== CÁLCULOS FINANCIEROS Y MÉTRICAS ====================
      const comisionesCalculadas = useMemo(() => {
        let ganadoGremio = 0;
        let ganadoMinoristaBruno = 0;
        let ganadoMinoristaMateo = 0;
        let pendienteCobroBruno = 0;

        const hoyStr = new Date().toISOString().split('T')[0];
        const mesStr = hoyStr.slice(0, 7);
        const anioStr = hoyStr.slice(0, 4);

        let brunoHoy = 0;
        let brunoMes = 0;
        let brunoAnio = 0;

        reparaciones.forEach(r => {
          const comisionBruno = r.tipo_cliente === 'gremio' ? (r.mano_obra_usd || 0) : ((r.mano_obra_usd || 0) * 0.5);
          const comisionMateo = r.tipo_cliente === 'gremio' ? 0 : ((r.mano_obra_usd || 0) * 0.5);

          if (r.estado_pago === 'Pagado') {
            if (r.tipo_cliente === 'gremio') ganadoGremio += comisionBruno;
            else {
              ganadoMinoristaBruno += comisionBruno;
              ganadoMinoristaMateo += comisionMateo;
            }
            const fechaRef = r.fecha_pago || r.fecha_completado || '';
            if (fechaRef.startsWith(hoyStr)) brunoHoy += comisionBruno;
            if (fechaRef.startsWith(mesStr)) brunoMes += comisionBruno;
            if (fechaRef.startsWith(anioStr)) brunoAnio += comisionBruno;
          } else {
            pendienteCobroBruno += comisionBruno;
          }
        });

        const totalHistoricoGanadoBruno = ganadoGremio + ganadoMinoristaBruno;
        const totalPagadoABruno = comisionesPagos.reduce((acc, p) => acc + (parseFloat(p.monto_usd) || 0), 0);
        // Si saldoDeudaNegocioConBruno > 0: El negocio le debe a Bruno (ROJO según Punto 6)
        // Si saldoDeudaNegocioConBruno <= 0: El negocio tiene saldo a favor con Bruno / Al día (VERDE según Punto 6)
        const saldoDeudaNegocioConBruno = totalHistoricoGanadoBruno - totalPagadoABruno;

        return {
          ganadoGremio,
          ganadoMinoristaBruno,
          ganadoMinoristaMateo,
          totalHistoricoGanadoBruno,
          totalPagadoABruno,
          saldoDeudaNegocioConBruno,
          pendienteCobroBruno,
          brunoHoy,
          brunoMes,
          brunoAnio
        };
      }, [reparaciones, comisionesPagos]);

      const totalValorStock = useMemo(() => {
        return stockRepuestos.reduce((acc, s) => acc + ((parseFloat(s.cantidad) || 0) * (parseFloat(s.costo_unitario_usd) || 0)), 0);
      }, [stockRepuestos]);

      const totalGastosFijosMensuales = useMemo(() => {
        return gastosFijos.reduce((acc, g) => acc + (parseFloat(g.monto_usd) || 0), 0);
      }, [gastosFijos]);

      // Notificaciones y Alertas Activas
      const alertasSistema = useMemo(() => {
        const hoy = new Date();
        const equiposDemorados = ordenes.filter(o => {
          if (o.estado === 'Entregado') return false;
          const dias = Math.floor((hoy - new Date(o.fecha_ingreso)) / (1000 * 60 * 60 * 24));
          return dias >= 3;
        });
        const deudasFavorPendientes = deudasFavor.filter(d => d.estado === 'Pendiente');
        const cuentasPorPagarPendientes = gastosNegocio.filter(g => g.estado === 'Pendiente');
        const stockBajo = stockRepuestos.filter(s => s.cantidad <= 2);
        const garantiasPorVencer = reparaciones.filter(r => {
          if (r.estado_pago !== 'Pagado' || !r.garantia_dias) return false;
          const diasPasados = Math.floor((hoy - new Date(r.fecha_pago || r.fecha_completado)) / (1000 * 60 * 60 * 24));
          const restantes = r.garantia_dias - diasPasados;
          return restantes >= 0 && restantes <= 3;
        });

        return {
          equiposDemorados,
          deudasFavorPendientes,
          cuentasPorPagarPendientes,
          stockBajo,
          garantiasPorVencer,
          totalAlertas: equiposDemorados.length + deudasFavorPendientes.length + cuentasPorPagarPendientes.length + stockBajo.length + garantiasPorVencer.length
        };
      }, [ordenes, deudasFavor, gastosNegocio, stockRepuestos, reparaciones]);

      // Asistente Financiero en Lenguaje Natural (Punto 10)
      const ejecutarAsistenteFinanciero = (preguntaManual) => {
        const q = (preguntaManual || queryDash).toLowerCase().trim();
        if (!q) return;

        const hoyStr = new Date().toISOString().split('T')[0];
        const mesStr = hoyStr.slice(0, 7);
        const pagadas = reparaciones.filter(r => r.estado_pago === 'Pagado');

        // Detectar si preguntó por una fecha específica YYYY-MM-DD
        const matchFecha = q.match(/\d{4}-\d{2}-\d{2}/);
        if (matchFecha) {
          const f = matchFecha[0];
          const ganDia = pagadas.filter(r => (r.fecha_pago || r.fecha_completado || '').startsWith(f)).reduce((acc, r) => acc + (r.mano_obra_usd || 0), 0);
          const gasDia = gastosNegocio.filter(g => (g.fecha || '').startsWith(f)).reduce((acc, g) => acc + (g.monto_usd || 0), 0);
          setResDash(`📅 Resumen del día ${f}: Ganancia Neta: ${fmtMoney(ganDia)} (${fmtMoney(ganDia, 'ARS')}) | Gastos del Negocio: ${fmtMoney(gasDia)} (${fmtMoney(gasDia, 'ARS')}).`);
          return;
        }

        if (q.includes('hoy')) {
          const ganHoy = pagadas.filter(r => (r.fecha_pago || r.fecha_completado || '').startsWith(hoyStr)).reduce((acc, r) => acc + (r.mano_obra_usd || 0), 0);
          const facHoy = pagadas.filter(r => (r.fecha_pago || r.fecha_completado || '').startsWith(hoyStr)).reduce((acc, r) => acc + (r.total_usd || 0), 0);
          const gasHoy = gastosNegocio.filter(g => (g.fecha || '').startsWith(hoyStr)).reduce((acc, g) => acc + (g.monto_usd || 0), 0);
          setResDash(`⚡ Hoy (${hoyStr}): Facturación Bruta: ${fmtMoney(facHoy)} | Ganancia Neta: ${fmtMoney(ganHoy)} (${fmtMoney(ganHoy, 'ARS')}) | Gastos hoy: ${fmtMoney(gasHoy)}.`);
        } else if (q.includes('mes')) {
          const ganMes = pagadas.filter(r => (r.fecha_pago || r.fecha_completado || '').startsWith(mesStr)).reduce((acc, r) => acc + (r.mano_obra_usd || 0), 0);
          const facMes = pagadas.filter(r => (r.fecha_pago || r.fecha_completado || '').startsWith(mesStr)).reduce((acc, r) => acc + (r.total_usd || 0), 0);
          const gasMes = gastosNegocio.filter(g => (g.fecha || '').startsWith(mesStr)).reduce((acc, g) => acc + (g.monto_usd || 0), 0);
          setResDash(`📊 Este Mes (${mesStr}): Facturación Bruta: ${fmtMoney(facMes)} | Ganancia Neta: ${fmtMoney(ganMes)} (${fmtMoney(ganMes, 'ARS')}) | Gastos del mes: ${fmtMoney(gasMes)} | Balance libre: ${fmtMoney(ganMes - gasMes)}.`);
        } else if (q.includes('gast')) {
          const gasTot = gastosNegocio.reduce((acc, g) => acc + (g.monto_usd || 0), 0);
          const gasPend = gastosNegocio.filter(g => g.estado === 'Pendiente').reduce((acc, g) => acc + (g.monto_usd || 0), 0);
          setResDash(`🧾 Gastos acumulados del negocio: ${fmtMoney(gasTot)} (${fmtMoney(gasTot, 'ARS')}). Cuentas por pagar pendientes: ${fmtMoney(gasPend)}.`);
        } else if (q.includes('deben') || q.includes('deuda')) {
          const totDeben = deudasFavor.filter(d => d.estado === 'Pendiente').reduce((acc, d) => acc + (d.monto_usd || 0), 0);
          setResDash(`🤝 Total en "Me Deben" pendiente de cobro: ${fmtMoney(totDeben)} (${fmtMoney(totDeben, 'ARS')}) en ${deudasFavor.filter(d => d.estado === 'Pendiente').length} cuenta(s).`);
        } else if (q.includes('bruno') || q.includes('comisi')) {
          setResDash(`👨‍🔧 Comisión Bruno: Total histórico ganado: ${fmtMoney(comisionesCalculadas.totalHistoricoGanadoBruno)}. Saldo pendiente que el negocio le debe a Bruno: ${fmtMoney(comisionesCalculadas.saldoDeudaNegocioConBruno)} (${fmtMoney(comisionesCalculadas.saldoDeudaNegocioConBruno, 'ARS')}).`);
        } else if (q.includes('stock') || q.includes('bater')) {
          setResDash(`🔋 Stock de Repuestos: Tenés ${stockRepuestos.reduce((acc, s) => acc + (parseInt(s.cantidad) || 0), 0)} unidades en taller valuadas en ${fmtMoney(totalValorStock)} (${fmtMoney(totalValorStock, 'ARS')}).`);
        } else {
          const ganTotal = pagadas.reduce((acc, r) => acc + (r.mano_obra_usd || 0), 0);
          const facTotal = pagadas.reduce((acc, r) => acc + (r.total_usd || 0), 0);
          setResDash(`💰 Histórico General del Sistema: Facturación Bruta: ${fmtMoney(facTotal)} | Ganancia Neta: ${fmtMoney(ganTotal)} (${fmtMoney(ganTotal, 'ARS')}) en ${pagadas.length} reparaciones cobradas.`);
        }
      };

      // Exportar Backup JSON
      const exportarBackup = () => {
        const data = {
          fecha_backup: new Date().toISOString(),
          cotizacionDolar,
          ordenes,
          reparaciones,
          stockRepuestos,
          gastosNegocio,
          deudasFavor,
          comisionesPagos,
          gastosPersonales,
          gastosFijos,
          saldoInicialBruno,
          logs
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ICONNECTURE_BACKUP_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      // ==================== PANTALLA DE LOGIN ====================
      if (!usuarioSesion) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 px-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 fade-in">
              <div className="text-center space-y-2">
                <div className="w-20 h-20 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-700 flex items-center justify-center text-white font-black text-3xl mx-auto shadow-lg shadow-purple-900/50">
                  IC
                </div>
                <h1 className="text-3xl font-extrabold text-white tracking-tight mt-3">ICONNECTURE</h1>
                <p className="text-xs text-purple-400 font-bold tracking-widest uppercase">System Suite Pro • Multimoneda</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-5 pt-2">
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-3 text-center uppercase tracking-wider">Seleccionar Usuario</label>
                  <div className="grid grid-cols-2 gap-3">
                    {usuarios.map(u => (
                      <button
                        key={u.id}
                        type="button"
                        onClick={() => { setLoginUser(u.nombre); setLoginError(''); }}
                        className={`py-3.5 px-3 rounded-2xl border text-xs font-semibold transition-all flex flex-col items-center justify-center ${
                          loginUser === u.nombre
                            ? 'bg-purple-600/20 border-purple-500 text-purple-300 shadow-md ring-2 ring-purple-500/30'
                            : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-600'
                        }`}
                      >
                        <span className="font-bold text-white text-base">{u.nombre}</span>
                        <span className="text-[10px] text-slate-400 mt-1">{u.rol}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-2 text-center uppercase tracking-wider">Contraseña de {loginUser}</label>
                  <input
                    type="password"
                    required
                    value={loginPass}
                    onChange={e => setLoginPass(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3.5 text-white focus:outline-none focus:border-purple-500 text-center font-mono text-2xl tracking-widest"
                  />
                </div>

                {loginError && (
                  <p className="text-xs text-rose-400 font-bold text-center bg-rose-950/40 border border-rose-900/50 py-2.5 rounded-xl">
                    {loginError}
                  </p>
                )}

                <button
                  type="submit"
                  className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-purple-950 text-sm uppercase tracking-wider"
                >
                  Ingresar al Sistema
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ==================== INTERFAZ PRINCIPAL ====================
      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden font-sans">
          
          {/* BARRA LATERAL AMPLIADA (w-72) CON BADGES DE NOTIFICACIÓN */}
          <aside className="w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-5 overflow-y-auto hide-scrollbar shrink-0">
            <div>
              <div className="flex items-center gap-3.5 px-2 py-3 mb-5 border-b border-slate-800">
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-700 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-purple-900/50">
                  IC
                </div>
                <div>
                  <h1 className="font-extrabold text-lg text-white leading-tight">ICONNECTURE</h1>
                  <p className="text-xs text-purple-400 font-semibold">Gestión & Taller Pro</p>
                </div>
              </div>

              <nav className="space-y-1.5">
                {[
                  { id: 'dashboard', label: 'Resumen General', icon: 'fa-chart-pie', badge: alertasSistema.totalAlertas > 0 ? alertasSistema.totalAlertas : null, badgeColor: 'bg-purple-500' },
                  { id: 'taller', label: 'Taller & Recepción', icon: 'fa-wrench', badge: alertasSistema.equiposDemorados.length > 0 ? alertasSistema.equiposDemorados.length : null, badgeColor: 'bg-rose-600' },
                  { id: 'reparaciones', label: 'Cargar Reparación', icon: 'fa-microchip', badge: reparaciones.filter(r => r.estado_pago === 'Pendiente').length || null, badgeColor: 'bg-amber-600' },
                  { id: 'garantias', label: 'Control Garantías', icon: 'fa-shield-halved', badge: alertasSistema.garantiasPorVencer.length || null, badgeColor: 'bg-amber-600' },
                  { id: 'stock', label: 'Stock Repuestos', icon: 'fa-boxes-stacked', badge: alertasSistema.stockBajo.length || null, badgeColor: 'bg-rose-600' },
                  { id: 'gastos', label: 'Gastos del Negocio', icon: 'fa-receipt', badge: alertasSistema.cuentasPorPagarPendientes.length || null, badgeColor: 'bg-rose-600' },
                  { id: 'medeben', label: 'Me Deben (Cuentas)', icon: 'fa-hand-holding-dollar', badge: alertasSistema.deudasFavorPendientes.length || null, badgeColor: 'bg-emerald-600' },
                  { id: 'comisiones', label: 'Comisiones Bruno', icon: 'fa-wallet' },
                  { id: 'socios', label: 'Socios y Reparto', icon: 'fa-users-gear' },
                  { id: 'estadisticas', label: 'Estadísticas Globales', icon: 'fa-chart-line' },
                  { id: 'actividad', label: 'Registro Actividad', icon: 'fa-clock-rotate-left' },
                  { id: 'cuentas', label: 'Gestión Cuentas', icon: 'fa-user-lock' },
                  { id: 'patrimonio', label: 'Patrimonio Bruno 🔒', icon: 'fa-lock' },
                  { id: 'config', label: 'Configuración API', icon: 'fa-gear' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => {
                      setVista(item.id);
                      if (item.id !== 'patrimonio') {
                        setPatrimonioDesbloqueado(false);
                        setPinInput('');
                        setPinErrorMsg('');
                      }
                    }}
                    className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl text-sm font-bold transition-all ${
                      vista === item.id 
                        ? 'bg-purple-600 text-white shadow-lg shadow-purple-900/50' 
                        : 'text-slate-400 hover:bg-slate-800/80 hover:text-slate-200'
                    }`}
                  >
                    <div className="flex items-center gap-3.5">
                      <i className={`fa-solid ${item.icon} w-5 text-center text-base ${vista === item.id ? 'text-white' : 'text-slate-400'}`}></i>
                      <span>{item.label}</span>
                    </div>
                    {item.badge && (
                      <span className={`${item.badgeColor} text-white text-[10px] font-black px-2 py-0.5 rounded-full`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>
            </div>

            <div className="border-t border-slate-800 pt-4 mt-4">

                            <label className="block text-slate-300 font-bold mb-1.5">Cómo Ingresa el Equipo (Estado Físico Inicial) *</label>
                            <div className="flex flex-wrap gap-1.5 mb-2">
                              {TAGS_ESTADO_FISICO.map(tag => (
                                <button
                                  key={tag}

                                  onClick={() => {
                                    const actual = formIngreso.estado_fisico;
                                    const nuevo = actual ? `${actual}, ${tag}` : tag;

                                  className="bg-slate-950 hover:bg-purple-950 border border-slate-700 hover:border-purple-500 text-slate-300 px-2.5 py-1 rounded-lg text-[10px] font-semibold transition"

                                  + {tag}
                                </button>
                              ))}
                            </div>
                            <textarea
                              rows="2"
                              required
                              value={formIngreso.estado_fisico}
                              onChange={e => setFormIngreso({...formIngreso, estado_fisico: e.target.value})}

                              className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-white"
                            />
                          </div>

                          {/* ¿TUVO REPARACIÓN PREVIA EN OTRO TALLER? */}
                          <div className="bg-slate-950/60 border border-slate-800 rounded-xl p-3 space-y-2">
                            <div className="flex justify-between items-center">
                              <span className="font-bold text-slate-300">¿Tuvo reparación previa anteriormente?</span>
                              <select
                                value={formIngreso.tuvo_reparacion_previa}
                                onChange={e => setFormIngreso({...formIngreso, tuvo_reparacion_previa: e.target.value})}
                                className="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-white font-bold"
                              >
                                <option value="no">No</option>
                                <option value="si">Sí</option>
                              </select>
                            </div>
                            {formIngreso.tuvo_reparacion_previa === 'si' && (
                              <div className="space-y-2 pt-2 border-t border-slate-800">
                                <input type="text" placeholder="¿Qué se le hizo?" value={formIngreso.detalle_reparacion_previa} onChange={e => setFormIngreso({...formIngreso, detalle_reparacion_previa: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white" />
                                <div className="grid grid-cols-2 gap-2">
                                  <input type="text" placeholder="¿En qué taller?" value={formIngreso.taller_previo} onChange={e => setFormIngreso({...formIngreso, taller_previo: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white" />
                                  <input type="text" placeholder="¿Cuándo aprox?" value={formIngreso.fecha_previa} onChange={e => setFormIngreso({...formIngreso, fecha_previa: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white" />
                                </div>
                              </div>
                            )}
                          </div>

                          <div>
                            <label className="block text-slate-300 font-bold mb-1">Falla Declarada / Trabajo a Realizar *</label>
                            <textarea rows="2" required value={formIngreso.falla_declarada} onChange={e => setFormIngreso({...formIngreso, falla_declarada: e.target.value})} placeholder="Ej: Cambio de batería iPhone 13 Pro..." className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-white" />
                          </div>

                          {/* PRESUPUESTO ESTIMADO EN ARS O USD */}
                          <div>
                            <label className="block text-slate-300 font-bold mb-1">Presupuesto Estimado Inicial (En Pesos o USD)</label>
                            <div className="flex gap-2">
                              <input
                                type="number"
                                step="any"
                                value={formIngreso.presupuesto_estimado}
                                onChange={e => setFormIngreso({...formIngreso, presupuesto_estimado: e.target.value})}
                                placeholder="Ej: 100000"
                                className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white font-mono"
                              />
                              <select
                                value={formIngreso.moneda_presupuesto}
                                onChange={e => setFormIngreso({...formIngreso, moneda_presupuesto: e.target.value})}
                                className="bg-slate-950 border border-purple-500/60 rounded-xl px-3 py-2.5 text-white font-bold"
                              >
                                <option value="ARS">ARS ($)</option>
                                <option value="USD">USD ($)</option>
                              </select>
                            </div>
                            <ConversionPreview monto={formIngreso.presupuesto_estimado} moneda={formIngreso.moneda_presupuesto} cotizacion={cotizacionDolar} />
                          </div>

                          <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-3.5 rounded-xl transition shadow-lg shadow-purple-950">
                            Confirmar Ingreso al Taller
                          </button>
                        </form>
                      </div>

                      {/* LISTADO Y FILTROS DE EQUIPOS EN TALLER */}
                      <div className="lg:col-span-7 space-y-5">
                        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-3">
                          <div className="flex justify-between items-center">
                            <h3 className="font-bold text-white text-base">Filtros de Taller ({equiposActivos.length} equipos)</h3>
                            <button
                              onClick={() => {
                                setBusquedaTaller(''); setFiltroPrioridadTaller('Todas');
                                setFiltroEstadoTaller('Todos'); setFiltroTipoTaller('Todos');
                                setFiltroFechaDesdeTaller(''); setFiltroFechaHastaTaller('');
                              }}
                              className="text-xs text-purple-400 hover:underline font-bold"
                            >
                              Limpiar filtros
                            </button>
                          </div>
                          <div className="grid grid-cols-1 md:grid-cols-3 gap-2.5 text-xs">
                            <input type="text" placeholder="Buscar modelo, cliente o IMEI..." value={busquedaTaller} onChange={e => setBusquedaTaller(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                            <select value={filtroPrioridadTaller} onChange={e => setFiltroPrioridadTaller(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white">
                              <option value="Todas">Todas las prioridades</option>
                              <option value="Alta">🔴 Prioridad Alta</option>
                              <option value="Moderada">🟡 Prioridad Moderada</option>
                              <option value="Baja">🟢 Prioridad Baja</option>
                            </select>
                            <select value={filtroEstadoTaller} onChange={e => setFiltroEstadoTaller(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white">
                              <option value="Todos">Todos los estados</option>
                              <option value="Recibido">Recibido</option>
                              <option value="En Diagnóstico">En Diagnóstico</option>
                              <option value="Esperando Repuesto">Esperando Repuesto</option>
                              <option value="Listo para Entregar">Listo para Entregar</option>
                            </select>

                              <option value="minorista">Solo Minorista</option>
                              <option value="gremio">Solo Gremio</option>
                            </select>
                            <input type="date" value={filtroFechaDesdeTaller} onChange={e => setFiltroFechaDesdeTaller(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" title="Desde fecha" />
                            <input type="date" value={filtroFechaHastaTaller} onChange={e => setFiltroFechaHastaTaller(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" title="Hasta fecha" />

                        </div>

                        {equiposActivos.length === 0 ? (
