<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICONNECTURE - Sistema de Servicio Técnico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [vista, setVista] = useState('ordenes');
      const [urlSupabase, setUrlSupabase] = useState(localStorage.getItem('iconnecture_url') || '');
      const [keySupabase, setKeySupabase] = useState(localStorage.getItem('iconnecture_key') || '');
      const [supabaseClient, setSupabaseClient] = useState(null);
      const [mensajeStatus, setMensajeStatus] = useState('');

      // Datos locales de respaldo
      const [ordenes, setOrdenes] = useState(JSON.parse(localStorage.getItem('st_ordenes') || '[]'));
      const [clientes, setClientes] = useState(JSON.parse(localStorage.getItem('st_clientes') || '[]'));
      const [repuestos, setRepuestos] = useState(JSON.parse(localStorage.getItem('st_repuestos') || '[]'));
      const [caja, setCaja] = useState(JSON.parse(localStorage.getItem('st_caja') || '[]'));
      const [logs, setLogs] = useState(JSON.parse(localStorage.getItem('st_logs') || '[]'));

      // Formularios
      const [busquedaImei, setBusquedaImei] = useState('');
      const [reciboActivo, setReciboActivo] = useState(null);

      // Form Orden
      const [formOrden, setFormOrden] = useState({
        cliente_nombre: '', cliente_telefono: '', tipo_cliente: 'minorista',
        equipo_modelo: '', imei_serie: '', falla_declarada: '', presupuesto: '', garantia_dias: '30'
      });

      // Inicializar Supabase si existen las llaves
      useEffect(() => {
        if (urlSupabase && keySupabase && window.supabase) {
          try {
            const client = window.supabase.createClient(urlSupabase, keySupabase);
            setSupabaseClient(client);
            cargarDatosSupabase(client);
          } catch (e) {
            console.error(e);
          }
        }
      }, [urlSupabase, keySupabase]);

      const cargarDatosSupabase = async (client) => {
        try {
          const { data: dataOrd } = await client.from('ordenes_reparacion').select('*').order('fecha_ingreso', { ascending: false });
          if (dataOrd) setOrdenes(dataOrd);
          
          const { data: dataCli } = await client.from('clientes').select('*');
          if (dataCli) setClientes(dataCli);

          const { data: dataRep } = await client.from('repuestos').select('*');
          if (dataRep) setRepuestos(dataRep);

          const { data: dataCaj } = await client.from('movimientos_caja').select('*');
          if (dataCaj) setCaja(dataCaj);
        } catch (err) {
          console.error("Error al sincronizar datos:", err);
        }
      };

      const guardarConfiguracion = () => {
        localStorage.setItem('iconnecture_url', urlSupabase);
        localStorage.setItem('iconnecture_key', keySupabase);
        setMensajeStatus('✅ Configuración guardada correctamente.');
        setTimeout(() => setMensajeStatus(''), 3000);
      };

      const agregarOrden = async (e) => {
        e.preventDefault();
        const nuevaOrden = {
          id: Date.now(),
          ...formOrden,
          presupuesto: parseFloat(formOrden.presupuesto) || 0,
          garantia_dias: parseInt(formOrden.garantia_dias) || 30,
          estado: 'Recibido',
          fecha_ingreso: new Date().toISOString()
        };

        const ordenesActualizadas = [nuevaOrden, ...ordenes];
        setOrdenes(ordenesActualizadas);
        localStorage.setItem('st_ordenes', JSON.stringify(ordenesActualizadas));

        if (supabaseClient) {
          await supabaseClient.from('ordenes_reparacion').insert([{
            equipo_modelo: formOrden.equipo_modelo,
            imei_serie: formOrden.imei_serie,
            falla_declarada: formOrden.falla_declarada,
            presupuesto: parseFloat(formOrden.presupuesto) || 0,
            garantia_dias: parseInt(formOrden.garantia_dias) || 30,
            estado: 'Recibido'
          }]);
        }

        setFormOrden({ cliente_nombre: '', cliente_telefono: '', tipo_cliente: 'minorista', equipo_modelo: '', imei_serie: '', falla_declarada: '', presupuesto: '', garantia_dias: '30' });
        alert('Orden de reparación registrada con éxito');
      };

      const cambiarEstado = async (id, nuevoEstado) => {
        const actualizadas = ordenes.map(o => o.id === id ? { ...o, estado: nuevoEstado, fecha_entrega: nuevoEstado === 'Entregado' ? new Date().toISOString() : o.fecha_entrega } : o);
        setOrdenes(actualizadas);
        localStorage.setItem('st_ordenes', JSON.stringify(actualizadas));

        if (supabaseClient) {
          await supabaseClient.from('ordenes_reparacion').update({ estado: nuevoEstado }).eq('id', id);
        }
      };

      const calcularGarantia = (fechaEntrega, diasGarantia) => {
        if (!fechaEntrega) return { estado: 'Pendiente de entrega', diasRestantes: diasGarantia, color: 'text-amber-400' };
        const entrega = new Date(fechaEntrega);
        const hoy = new Date();
        const diasPasados = Math.floor((hoy - entrega) / (1000 * 60 * 60 * 24));
        const restantes = diasGarantia - diasPasados;
        if (restantes >= 0) {
          return { estado: 'Garantía Vigente', diasRestantes: restantes, color: 'text-emerald-400' };
        } else {
          return { estado: 'Garantía Vencida', diasRestantes: Math.abs(restantes), color: 'text-rose-500' };
        }
      };

      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden">
          {/* Menú Lateral */}
          <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4">
            <div>
              <div className="flex items-center gap-3 px-2 py-4 mb-6 border-b border-slate-800">
                <div className="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-purple-900/50">
                  IC
                </div>
                <div>
                  <h1 className="font-bold text-lg text-white leading-tight">ICONNECTURE</h1>
                  <p className="text-xs text-purple-400 font-medium">Servicio Técnico</p>
                </div>
              </div>

              <nav className="space-y-1">
                {[
                  { id: 'ordenes', label: 'Taller & Órdenes', icon: 'fa-wrench' },
                  { id: 'garantias', label: 'Control Garantías', icon: 'fa-shield-halved' },
                  { id: 'clientes', label: 'Clientes & Cuentas', icon: 'fa-users' },
                  { id: 'repuestos', label: 'Stock Repuestos', icon: 'fa-microchip' },
                  { id: 'caja', label: 'Caja & Gastos', icon: 'fa-wallet' },
                  { id: 'config', label: 'Configuración API', icon: 'fa-gear' },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setVista(item.id)}
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                      vista === item.id 
                        ? 'bg-purple-600 text-white shadow-md shadow-purple-950' 
                        : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                    }`}
                  >
                    <i className={`fa-solid ${item.icon} w-5 text-center`}></i>
                    {item.label}
                  </button>
                ))}
              </nav>
            </div>

            <div className="text-xs text-slate-500 px-2">
              <p>Estado DB: {supabaseClient ? <span className="text-emerald-400 font-bold">Conectado Cloud</span> : <span className="text-amber-400 font-bold">Modo Local</span>}</p>
            </div>
          </aside>

          {/* Panel Principal */}
          <main className="flex-1 overflow-y-auto p-8 bg-slate-950">
            {/* VISTA 1: ÓRDENES DE TALLER */}
            {vista === 'ordenes' && (
              <div className="space-y-6">
                <header className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Recepción y Órdenes de Servicio</h2>
                    <p className="text-slate-400 text-sm">Registro de ingresos de equipos y estado de reparación</p>
                  </div>
                </header>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  {/* Formulario Ingreso */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <h3 className="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                      <i className="fa-solid fa-plus text-purple-400"></i> Nuevo Ingreso
                    </h3>
                    <form onSubmit={agregarOrden} className="space-y-4">
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Nombre del Cliente</label>
                        <input
                          type="text"
                          required
                          value={formOrden.cliente_nombre}
                          onChange={e => setFormOrden({...formOrden, cliente_nombre: e.target.value})}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500"
                          placeholder="Ej. Juan Pérez"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Teléfono</label>
                          <input
                            type="text"
                            value={formOrden.cliente_telefono}
                            onChange={e => setFormOrden({...formOrden, cliente_telefono: e.target.value})}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500"
                            placeholder="341..."
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Tipo Cliente</label>
                          <select
                            value={formOrden.tipo_cliente}
                            onChange={e => setFormOrden({...formOrden, tipo_cliente: e.target.value})}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500"
                          >
                            <option value="minorista">Minorista</option>
                            <option value="gremio">Gremio / Mayorista</option>
                          </select>
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Modelo de Equipo</label>
                          <input
                            type="text"
                            required
                            value={formOrden.equipo_modelo}
                            onChange={e => setFormOrden({...formOrden, equipo_modelo: e.target.value})}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500"
                            placeholder="Ej. iPhone 13 Pro"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">IMEI / N° Serie</label>
                          <input
                            type="text"
                            value={formOrden.imei_serie}
                            onChange={e => setFormOrden({...formOrden, imei_serie: e.target.value})}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500"
                            placeholder="15 dígitos..."
                          />
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Falla Declarada</label>
                        <textarea
                          rows="2"
                          value={formOrden.falla_declarada}
                          onChange={e => setFormOrden({...formOrden, falla_declarada: e.target.value})}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500"
                          placeholder="Cambio de módulo, batería, no enciende..."
                        ></textarea>
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Presupuesto ($)</label>
                          <input
                            type="number"
                            value={formOrden.presupuesto}
                            onChange={e => setFormOrden({...formOrden, presupuesto: e.target.value})}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500"
                            placeholder="0.00"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Garantía (Días)</label>
                          <input
                            type="number"
                            value={formOrden.garantia_dias}
                            onChange={e => setFormOrden({...formOrden, garantia_dias: e.target.value})}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500"
                          />
                        </div>
                      </div>
                      <button
                        type="submit"
                        className="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-purple-900/40"
                      >
                        Ingresar a Taller
                      </button>
                    </form>
                  </div>

                  {/* Lista de Órdenes */}
                  <div className="lg:col-span-2 space-y-4">
                    <h3 className="text-lg font-semibold text-white mb-2">Equipos en Taller ({ordenes.length})</h3>
                    {ordenes.length === 0 ? (
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-500">
                        No hay órdenes registradas aún.
                      </div>
                    ) : (
                      ordenes.map(ord => (
                        <div key={ord.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 hover:border-slate-700 transition">
                          <div className="flex justify-between items-start">
                            <div>
                              <span className="text-xs text-purple-400 font-mono">#ORD-{String(ord.id).slice(-4)}</span>
                              <h4 className="font-bold text-white text-lg">{ord.equipo_modelo}</h4>
                              <p className="text-xs text-slate-400">Cliente: <strong className="text-slate-200">{ord.cliente_nombre}</strong> ({ord.tipo_cliente})</p>
                            </div>
                            <select
                              value={ord.estado}
                              onChange={e => cambiarEstado(ord.id, e.target.value)}
                              className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1 text-xs text-white font-semibold focus:outline-none"
                            >
                              <option value="Recibido">Recibido</option>
                              <option value="En Diagnóstico">En Diagnóstico</option>
                              <option value="Esperando Repuesto">Esperando Repuesto</option>
                              <option value="Listo para Entregar">Listo para Entregar</option>
                              <option value="Entregado">Entregado</option>
                            </select>
                          </div>
                          <div className="bg-slate-950 rounded-xl p-3 text-xs text-slate-300 space-y-1">
                            <p><strong>Falla:</strong> {ord.falla_declarada || 'Sin detalle'}</p>
                            <p><strong>IMEI/Serie:</strong> {ord.imei_serie || 'No cargado'}</p>
                            <p><strong>Presupuesto:</strong> ${ord.presupuesto} | <strong>Garantía:</strong> {ord.garantia_dias} días</p>
                          </div>
                          <div className="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-800">
                            <span>Fecha: {new Date(ord.fecha_ingreso).toLocaleDateString()}</span>
                            <button
                              onClick={() => setReciboActivo(ord)}
                              className="text-purple-400 hover:text-purple-300 font-medium flex items-center gap-1"
                            >
                              <i className="fa-solid fa-print"></i> Generar Recibo
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* VISTA 2: GARANTÍAS POR IMEI */}
            {vista === 'garantias' && (
              <div className="space-y-6">
                <header>
                  <h2 className="text-2xl font-bold text-white">Consulta de Garantías por IMEI</h2>
                  <p className="text-slate-400 text-sm">Verificá al instante si la reparación de un equipo sigue cubierta</p>
                </header>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-xl space-y-4">
                  <label className="block text-xs text-slate-400">Ingresá el IMEI o Número de Serie del Equipo</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={busquedaImei}
                      onChange={e => setBusquedaImei(e.target.value)}
                      placeholder="Ej. 3568940..."
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500"
                    />
                  </div>
                </div>

                <div className="space-y-4">
                  {ordenes
                    .filter(o => busquedaImei === '' || (o.imei_serie && o.imei_serie.includes(busquedaImei)))
                    .map(o => {
                      const resGarantia = calcularGarantia(o.fecha_entrega, o.garantia_dias);
                      return (
                        <div key={o.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex justify-between items-center">
                          <div>
                            <h4 className="font-bold text-white text-lg">{o.equipo_modelo}</h4>
                            <p className="text-xs text-slate-400">IMEI: {o.imei_serie || 'N/A'} | Cliente: {o.cliente_nombre}</p>
                            <p className="text-xs text-slate-400">Fecha Entrega: {o.fecha_entrega ? new Date(o.fecha_entrega).toLocaleDateString() : 'Aún sin entregar'}</p>
                          </div>
                          <div className="text-right">
                            <span className={`text-lg font-bold ${resGarantia.color}`}>{resGarantia.estado}</span>
                            <p className="text-xs text-slate-400">
                              {o.fecha_entrega ? `${resGarantia.diasRestantes} días ${resGarantia.estado.includes('Vigente') ? 'restantes' : 'de vencido'}` : 'Plazo de ' + o.garantia_dias + ' días'}
                            </p>
                          </div>
                        </div>
                      );
                    })}
                </div>
              </div>
            )}

            {/* VISTA 6: CONFIGURACIÓN API */}
            {vista === 'config' && (
              <div className="space-y-6 max-w-2xl">
                <header>
                  <h2 className="text-2xl font-bold text-white">Configuración de Base de Datos Cloud</h2>
                  <p className="text-slate-400 text-sm">Conectá la aplicación con tu proyecto gratuito de Supabase</p>
                </header>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Project URL de Supabase</label>
                    <input
                      type="text"
                      value={urlSupabase}
                      onChange={e => setUrlSupabase(e.target.value)}
                      placeholder="https://xxxxxxx.supabase.co"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 font-mono text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Publishable / Anon Key de Supabase</label>
                    <input
                      type="password"
                      value={keySupabase}
                      onChange={e => setKeySupabase(e.target.value)}
                      placeholder="sb_publishable_..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 font-mono text-sm"
                    />
                  </div>
                  {mensajeStatus && <p className="text-sm font-semibold">{mensajeStatus}</p>}
                  <button
                    onClick={guardarConfiguracion}
                    className="bg-purple-600 hover:bg-purple-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-purple-900/40"
                  >
                    Guardar Conexión
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Recibo Imprimible (Modal) */}
          {reciboActivo && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-white text-slate-900 rounded-2xl p-6 max-w-md w-full space-y-4" id="printable-receipt">
                <div className="text-center border-b pb-4">
                  <h2 className="font-bold text-2xl tracking-tight">ICONNECTURE</h2>
                  <p className="text-xs text-slate-500">Servicio Técnico Profesional & Garantía</p>
                </div>
                <div className="text-xs space-y-2">
                  <p><strong>N° Orden:</strong> #ORD-{String(reciboActivo.id).slice(-4)}</p>
                  <p><strong>Fecha:</strong> {new Date(reciboActivo.fecha_ingreso).toLocaleString()}</p>
                  <p><strong>Cliente:</strong> {reciboActivo.cliente_nombre} ({reciboActivo.cliente_telefono})</p>
                  <p><strong>Equipo:</strong> {reciboActivo.equipo_modelo}</p>
                  <p><strong>IMEI / Serie:</strong> {reciboActivo.imei_serie || 'N/A'}</p>
                  <p><strong>Falla Declarada:</strong> {reciboActivo.falla_declarada}</p>
                  <p><strong>Presupuesto Est.:</strong> ${reciboActivo.presupuesto}</p>
                  <p><strong>Garantía:</strong> {reciboActivo.garantia_dias} días post-entrega</p>
                </div>
                <div className="pt-4 border-t text-center space-y-2">
                  <p className="text-[10px] text-slate-500">Conserve este comprobante para retirar su equipo.</p>
                  <div className="flex justify-end gap-2 no-print">
                    <button onClick={() => window.print()} className="bg-purple-600 text-white text-xs px-4 py-2 rounded-lg font-bold">Imprimir</button>
                    <button onClick={() => setReciboActivo(null)} className="bg-slate-200 text-slate-700 text-xs px-4 py-2 rounded-lg font-bold">Cerrar</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
