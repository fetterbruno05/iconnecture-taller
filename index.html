<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-purple-500/30">

  <script type="text/babel">
    const { useState, useEffect, useMemo, Component } = React;

    // =========================================================================
    // 1. SISTEMA ANTI-CRASH (ERROR BOUNDARY)
    // Previene la "pantalla azul" y muestra el error exacto si algo falla.
    // =========================================================================
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorInfo: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorInfo: error.message };
      }
      componentDidCatch(error, errorInfo) {
        console.error("Error crítico atrapado:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex items-center justify-center min-h-screen bg-slate-950 p-6">
              <div className="bg-rose-950/30 border-2 border-rose-600 rounded-3xl p-8 max-w-2xl text-center space-y-6">
                <i className="fa-solid fa-triangle-exclamation text-6xl text-rose-500"></i>
                <h1 className="text-3xl font-black text-white">¡Ups! Algo se rompió</h1>
                <p className="text-slate-300">El sistema detectó un error interno y se detuvo para proteger tus datos.</p>
                <div className="bg-slate-950 border border-rose-900 p-4 rounded-xl text-left font-mono text-sm text-rose-300 overflow-auto">
                  {this.state.errorInfo}
                </div>
                <button 
                  onClick={() => { localStorage.clear(); window.location.reload(); }} 
                  className="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 px-8 rounded-xl transition"
                >
                  Limpiar Caché y Reiniciar Sistema
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // =========================================================================
    // 2. CONFIGURACIÓN CLOUD - TUS DATOS FIJOS Y SEGUROS
    // =========================================================================
    const SUPABASE_URL = "https://cmmkxrkbmdzhjzetbddg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FcfhbHbgGG9mV8zp75g1yA_MbUi-jn1";
    
    let supabase = null;
    try {
      if (SUPABASE_URL.startsWith("http") && window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // =========================================================================
    // 3. CONSTANTES Y FUNCIONES DE SEGURIDAD (ARRAYS SEGUROS)
    // =========================================================================
    const USUARIOS_DEFAULT = [
      { id: '1', nombre: 'Bruno', pass: 'bruno123', rol: 'Administrador / Técnico' },
      { id: '2', nombre: 'Mateo', pass: 'mateo123', rol: 'Socio' },
      { id: '3', nombre: 'Yaco', pass: 'yaco123', rol: 'Empleado' },

    // Función vital para evitar que mapas y filtros rompan la app si un dato es nulo
    const safeArray = (arr) => Array.isArray(arr) ? arr : [];
    const loadStorage = (key, defaultVal) => {
      try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : defaultVal; } 
      catch (e) { return defaultVal; }

    // =========================================================================
    // 4. MOTOR BIMONETARIO (CONVERSIÓN EN TIEMPO REAL)
    // =========================================================================
    function PreviewBimonetario({ monto, moneda, cotizacion }) {
      const val = parseFloat(monto);
      if (!val || isNaN(val) || val <= 0) return null;
      const rate = parseFloat(cotizacion) || 1450;
      
      if (moneda === 'ARS') {
        const usd = val / rate;
        return (
          <div className="mt-2 bg-emerald-950/30 border border-emerald-900/50 rounded-lg p-2.5 flex items-center gap-2">
            <i className="fa-solid fa-lock text-emerald-500"></i>
            <p className="text-xs text-emerald-300 font-medium">
              El sistema congelará este valor en: <strong className="font-mono text-sm ml-1">${usd.toFixed(2)} USD</strong>
              <span className="block text-[10px] text-emerald-500/70 mt-0.5">Cotización fijada de ref: ${rate} ARS</span>
            </p>
          </div>
        );
      } else {
        const ars = val * rate;
        return (
          <div className="mt-2 bg-purple-950/30 border border-purple-900/50 rounded-lg p-2.5 flex items-center gap-2">
            <i className="fa-solid fa-calculator text-purple-500"></i>
            <p className="text-xs text-purple-300 font-medium">
              Equivale hoy a: <strong className="font-mono text-sm ml-1">${ars.toLocaleString('es-AR', { maximumFractionDigits: 0 })} ARS</strong>
            </p>
          </div>
        );
      }
    }

    // =========================================================================
    // 5. APLICACIÓN PRINCIPAL
    // =========================================================================
    function MainApp() {
      // ESTADOS DE CARGA Y RED
      const [isLoaded, setIsLoaded] = useState(false);
      const [syncStatus, setSyncStatus] = useState('Conectando a la nube...');

      // ESTADOS GLOBALES DE LA BASE DE DATOS
      const [usuarios, setUsuarios] = useState([]);
      const [ordenes, setOrdenes] = useState([]);
      const [reparaciones, setReparaciones] = useState([]);
      const [stockRepuestos, setStockRepuestos] = useState([]);
      const [gastosNegocio, setGastosNegocio] = useState([]);
      const [deudasFavor, setDeudasFavor] = useState([]);
      const [comisionesPagos, setComisionesPagos] = useState([]);
      const [gastosPersonales, setGastosPersonales] = useState([]);
      const [gastosFijos, setGastosFijos] = useState([]);
      const [logs, setLogs] = useState([]);
      const [listaGremios, setListaGremios] = useState([]);
      const [cotizacionDolar, setCotizacionDolar] = useState(1450);
      const [fechaUltimaCotizacion, setFechaUltimaCotizacion] = useState(new Date().toISOString());
      const [pinPatrimonio, setPinPatrimonio] = useState('123456');
      const [saldoInicialBruno, setSaldoInicialBruno] = useState(0);
      
      // ESTADOS DE SESIÓN E INTERFAZ
      const [usuarioSesion, setUsuarioSesion] = useState(null);
      const [loginUser, setLoginUser] = useState('Bruno');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');
      const [modoOculto, setModoOculto] = useState(false);
      const [vista, setVista] = useState('dashboard');

      // ESTADOS DE PATRIMONIO PRIVADO
      const [patrimonioDesbloqueado, setPatrimonioDesbloqueado] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [nuevoPinInput, setNuevoPinInput] = useState('');
      
      // ESTADOS DE FORMULARIOS GLOBALES
      const [modalDolar, setModalDolar] = useState(false);
      const [nuevaCotizacionInput, setNuevaCotizacionInput] = useState('');
      const [modalEditarSaldoBruno, setModalEditarSaldoBruno] = useState(false);

      // ESTADOS DE INGRESO TALLER
      const [tipoReparacionIngreso, setTipoReparacionIngreso] = useState('minorista');

      const [nuevoGremioNombre, setNuevoGremioNombre] = useState('');
      const [formIngreso, setFormIngreso] = useState({

      });
      const [reciboModal, setReciboModal] = useState(null);

      // ESTADOS DE CARGAR REPARACIÓN

      const [equipoSeleccionadoParaReparar, setEquipoSeleccionadoParaReparar] = useState(null);
      const [itemsRepuestosCarga, setItemsRepuestosCarga] = useState([{ tipo: 'stock', stockId: '', nombreManual: '', costoManual: '', monedaManual: 'USD' }]);
      const [manoObraInput, setManoObraInput] = useState('');
      const [monedaManoObra, setMonedaManoObra] = useState('ARS');
      const [medioPagoInput, setMedioPagoInput] = useState('Efectivo ARS');
      const [garantiaDiasInput, setGarantiaDiasInput] = useState('30');
      const [estadoPagoInicialCarga, setEstadoPagoInicialCarga] = useState('Pendiente');

      // ESTADOS DE STOCK Y EDICIÓN
      const [formNuevoStock, setFormNuevoStock] = useState({ categoria: 'Batería', modelo: '', cantidad: '', costo: '', moneda: 'USD' });
      const [modalEditStock, setModalEditStock] = useState(null);
      
      // ESTADOS GASTOS NEGOCIO
      const [formGastoNegocio, setFormGastoNegocio] = useState({ concepto: '', proveedor: '', monto: '', moneda: 'ARS', categoria: 'Cadetería', medio_pago: 'Efectivo ARS', estado: 'Pagado' });
      
      // ESTADOS ME DEBEN
      const [formDeudaFavor, setFormDeudaFavor] = useState({ deudor: '', motivo: '', telefono: '', monto: '', moneda: 'ARS' });
      const [modalPagoParcialDeuda, setModalPagoParcialDeuda] = useState(null);
      const [formAbonoDeuda, setFormAbonoDeuda] = useState({ monto: '', moneda: 'ARS' });
      
      // ESTADOS COMISIONES
      const [formPagoComision, setFormPagoComision] = useState({ monto: '', moneda: 'ARS', medio_pago: 'Efectivo ARS', nota: '' });
      
      // ESTADOS GASTOS PERSONALES / FIJOS
      const [formGastoPersonal, setFormGastoPersonal] = useState({ desc: '', categoria: 'Gimnasio / Entrenamiento', monto: '', moneda: 'ARS' });
      const [formGastoFijo, setFormGastoFijo] = useState({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3' });

      // ESTADOS DE BUSCADORES Y FILTROS EN TIEMPO REAL
      const [busquedaTaller, setBusquedaTaller] = useState('');
      const [busquedaReparaciones, setBusquedaReparaciones] = useState('');
      const [busquedaStock, setBusquedaStock] = useState('');
      const [busquedaGastos, setBusquedaGastos] = useState('');
      const [busquedaDeudas, setBusquedaDeudas] = useState('');
      const [busquedaGarantias, setBusquedaGarantias] = useState('');
      const [filtroUsuarioLog, setFiltroUsuarioLog] = useState('todos');

      // ASISTENTE FINANCIERO Y CUENTAS
      const [queryDash, setQueryDash] = useState('');
      const [resDash, setResDash] = useState('');
      const [passActual, setPassActual] = useState('');
      const [passNueva, setPassNueva] = useState('');
      const [msgPass, setMsgPass] = useState('');

      // =========================================================================
      // LÓGICA DE INICIALIZACIÓN (MIGRACIÓN & CLOUD EXTREMADAMENTE SEGURA)
      // =========================================================================
      const aplicarDatos = (p) => {
        setUsuarios(safeArray(p.usuarios).length ? p.usuarios : USUARIOS_DEFAULT);
        setOrdenes(safeArray(p.ordenes));
        setReparaciones(safeArray(p.reparaciones));
        setStockRepuestos(safeArray(p.stockRepuestos));
        setGastosNegocio(safeArray(p.gastosNegocio));
        setDeudasFavor(safeArray(p.deudasFavor));
        setComisionesPagos(safeArray(p.comisionesPagos));
        setGastosPersonales(safeArray(p.gastosPersonales));
        setGastosFijos(safeArray(p.gastosFijos));
        setLogs(safeArray(p.logs));
        setListaGremios(safeArray(p.listaGremios).length ? p.listaGremios : GREMIOS_DEFAULT);
        setCotizacionDolar(parseFloat(p.cotizacionDolar) || 1450);
        setPinPatrimonio(p.pinPatrimonio || '123456');
        setSaldoInicialBruno(parseFloat(p.saldoInicialBruno) || 0);
        setFechaUltimaCotizacion(p.fechaUltimaCotizacion || new Date().toISOString());
      };

      const loadFromLocalFallback = () => {
        setSyncStatus('Modo Offline: Cargando datos locales...');
        aplicarDatos({
          usuarios: loadStorage('ic_usuarios', USUARIOS_DEFAULT),
          ordenes: loadStorage('ic_ordenes', []),
          reparaciones: loadStorage('ic_reparaciones', []),
          stockRepuestos: loadStorage('ic_stock_repuestos', []),
          gastosNegocio: loadStorage('ic_gastos_negocio', []),
          deudasFavor: loadStorage('ic_deudas_favor', []),
          comisionesPagos: loadStorage('ic_comisiones_pagos', []),
          gastosPersonales: loadStorage('ic_gastos_personales', []),
          gastosFijos: loadStorage('ic_gastos_fijos', []),
          logs: loadStorage('ic_logs', []),
          listaGremios: loadStorage('ic_lista_gremios', GREMIOS_DEFAULT),
          cotizacionDolar: localStorage.getItem('ic_cotizacion_dolar'),
          pinPatrimonio: localStorage.getItem('ic_pin_patrimonio'),
          saldoInicialBruno: localStorage.getItem('ic_saldo_inicial_bruno'),
          fechaUltimaCotizacion: localStorage.getItem('ic_fecha_cotizacion')
        });
      };

      useEffect(() => {
        async function initApp() {
          if (!supabase) {
            loadFromLocalFallback();
            setTimeout(() => setIsLoaded(true), 800);
            return;
          }

          try {
            setSyncStatus('Descargando datos de la nube...');
            const { data, error } = await supabase.from('iconnecture_data').select('payload').eq('id', 1).single();
            if (error) throw error;

            if (data && data.payload && Object.keys(data.payload).length > 0) {
              aplicarDatos(data.payload);
              setSyncStatus('¡Conexión Exitosa!');
            } else {
              setSyncStatus('Nube vacía. Migrando sistema local a la nube...');
              loadFromLocalFallback();
            }
          } catch (err) {
            console.error("Error al conectar con Supabase:", err);
            loadFromLocalFallback();
          }
          setTimeout(() => setIsLoaded(true), 800);
        }
        initApp();
      }, []);

      // MOTOR DE SINCRONIZACIÓN AUTOMÁTICA
      useEffect(() => {
        if (!isLoaded) return;
        const payload = { 
          usuarios, ordenes, reparaciones, stockRepuestos, gastosNegocio, 
          deudasFavor, comisionesPagos, gastosPersonales, gastosFijos, 
          logs, listaGremios, cotizacionDolar, pinPatrimonio, saldoInicialBruno,
          fechaUltimaCotizacion
        };
        
        localStorage.setItem('ic_master_backup', JSON.stringify(payload));
        
        if (supabase) {
          supabase.from('iconnecture_data').update({ payload }).eq('id', 1).then(({error}) => {
            if (error) console.error("Error sincronizando:", error);
          });
        }
      }, [isLoaded, usuarios, ordenes, reparaciones, stockRepuestos, gastosNegocio, deudasFavor, comisionesPagos, gastosPersonales, gastosFijos, logs, listaGremios, cotizacionDolar, pinPatrimonio, saldoInicialBruno, fechaUltimaCotizacion]);


      // =========================================================================
      // UTILIDADES Y FUNCIONES DEL NEGOCIO
      // =========================================================================
      const registrarLog = (modulo, accion, detalles) => {
        const nuevo = { id: Date.now() + Math.floor(Math.random()*1000), usuario: usuarioSesion ? usuarioSesion.nombre : 'Sistema', modulo, accion, detalles, fecha: new Date().toISOString() };
        setLogs(prev => [nuevo, ...safeArray(prev)]);
      };

      const congelarMonto = (montoRaw, monedaSeleccionada) => {
        const val = parseFloat(montoRaw) || 0;
        const rate = parseFloat(cotizacionDolar) || 1450;
        const monto_usd = monedaSeleccionada === 'ARS' ? (val / rate) : val;
        const monto_ars_historico = monedaSeleccionada === 'ARS' ? val : (val * rate);
        return { monto_usd, monto_original: val, moneda_original: monedaSeleccionada, cotizacion_historica: rate, monto_ars_historico };
      };

      const fmtMoney = (amountUSD, currency = 'USD') => {
        if (modoOculto) return '***';
        const num = parseFloat(amountUSD) || 0;
        if (currency === 'ARS') return `$ ${(num * cotizacionDolar).toLocaleString('es-AR', { maximumFractionDigits: 0 })} ARS`;
        return `$ ${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
      };

      const fmtHistorico = (r) => {
        if (modoOculto || !r) return '';
        if (r.moneda_original === 'ARS' && r.monto_original) return `Cargado: $${parseFloat(r.monto_original).toLocaleString('es-AR')} ARS (Cotiz: $${r.cotizacion_historica})`;
        return r.cotizacion_historica ? `Base USD (Cotiz: $${r.cotizacion_historica})` : 'Base USD';
      };

      const validarImei = (imei) => {
        if (!imei) return { valido: true, msg: '' };
        if (/\s/.test(imei)) return { valido: false, msg: 'No se permiten espacios.' };
        if (!/^\d+$/.test(imei)) return { valido: false, msg: 'Solo números.' };
        if (imei.length !== 15) return { valido: false, msg: `Debe tener 15 dígitos (tiene ${imei.length}).` };
        return { valido: true, msg: 'IMEI válido' };
      };

      const cotizacionVencida = useMemo(() => {
        if(!fechaUltimaCotizacion) return true;
        const diffHoras = (new Date() - new Date(fechaUltimaCotizacion)) / 3600000;
        return diffHoras >= 24;
      }, [fechaUltimaCotizacion]);


      // CÁLCULOS CENTRALIZADOS DE RENTABILIDAD Y COMISIONES
      const comisionesCalculadas = useMemo(() => {
        let ganadoGremio = 0, ganadoMinoristaBruno = 0, ganadoMinoristaMateo = 0, brunoHoy = 0, brunoMes = 0;
        const hoyStr = new Date().toISOString().split('T')[0];
        const mesStr = hoyStr.slice(0, 7);

        safeArray(reparaciones).forEach(r => {
          const comisionBruno = r.tipo_cliente === 'gremio' ? (r.mano_obra_usd || 0) : ((r.mano_obra_usd || 0) * 0.5);
          if (r.estado_pago === 'Pagado') {
            if (r.tipo_cliente === 'gremio') ganadoGremio += comisionBruno;
            else { ganadoMinoristaBruno += comisionBruno; ganadoMinoristaMateo += ((r.mano_obra_usd || 0) * 0.5); }
            const f = r.fecha_pago || r.fecha_completado || '';
            if (f.startsWith(hoyStr)) brunoHoy += comisionBruno;
            if (f.startsWith(mesStr)) brunoMes += comisionBruno;
          }
        });
        const totalHistoricoGanadoBruno = ganadoGremio + ganadoMinoristaBruno;
        const totalPagadoABruno = safeArray(comisionesPagos).reduce((acc, p) => acc + (p.monto_usd || 0), 0);
        return { ganadoGremio, ganadoMinoristaBruno, ganadoMinoristaMateo, totalHistoricoGanadoBruno, totalPagadoABruno, saldoDeudaNegocioConBruno: totalHistoricoGanadoBruno - totalPagadoABruno, brunoHoy, brunoMes };
      }, [reparaciones, comisionesPagos]);

      const totalValorStock = useMemo(() => safeArray(stockRepuestos).reduce((acc, s) => acc + ((s.cantidad || 0) * (s.costo_unitario_usd || 0)), 0), [stockRepuestos]);
      const totalGastosFijosMensuales = useMemo(() => safeArray(gastosFijos).reduce((acc, g) => acc + (g.monto_usd || 0), 0), [gastosFijos]);

      const alertasSistema = useMemo(() => {
        const hoy = new Date();
        const demorados = safeArray(ordenes).filter(o => o.estado !== 'Entregado' && Math.floor((hoy - new Date(o.fecha_ingreso)) / 86400000) >= 3);
        const deudasPend = safeArray(deudasFavor).filter(d => d.estado === 'Pendiente');
        const ctasPagar = safeArray(gastosNegocio).filter(g => g.estado === 'Pendiente');
        const stockBajo = safeArray(stockRepuestos).filter(s => s.cantidad <= 2);
        const garantiasPorVencer = safeArray(reparaciones).filter(r => {
          if (r.estado_pago !== 'Pagado' || !r.garantia_dias) return false;
          const f = r.fecha_pago || r.fecha_completado;
          if(!f) return false;
          const res = r.garantia_dias - Math.floor((hoy - new Date(f)) / 86400000);
          return res >= 0 && res <= 3;
        });
        return { demorados, deudasPend, ctasPagar, stockBajo, garantiasPorVencer, total: demorados.length + deudasPend.length + ctasPagar.length + stockBajo.length + garantiasPorVencer.length };
      }, [ordenes, deudasFavor, gastosNegocio, stockRepuestos, reparaciones]);

      const antecedentesImeiActual = useMemo(() => {
        const i = formIngreso.imei_serie;
        if (!i || i.length !== 15) return { ordenes: [], reparaciones: [] };
        return { ordenes: safeArray(ordenes).filter(o => o.imei_serie === i), reparaciones: safeArray(reparaciones).filter(r => r.imei_serie === i) };
      }, [formIngreso.imei_serie, ordenes, reparaciones]);


      // =========================================================================
      // LÓGICA DE EVENTOS (SUBMITS Y BOTONES)
      // =========================================================================
      const handleLogin = (e) => {
        e.preventDefault();
        const found = safeArray(usuarios).find(u => u.nombre === loginUser);
        if (found && found.pass === loginPass) {
          setUsuarioSesion(found); setLoginError(''); setLoginPass('');
          registrarLog('Seguridad', 'Inicio Sesión', `Acceso de ${found.nombre}`);
        } else { setLoginError('Contraseña incorrecta'); }
      };

      const handleGuardarIngreso = (e) => {
        e.preventDefault();
        const chk = validarImei(formIngreso.imei_serie);

                          </div>

                          {/* GASTOS FIJOS Y CUOTAS ARS/USD */}
                          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-5 shadow-xl h-fit">
                            <h3 className="font-bold text-white text-lg">Gastos Fijos y Suscripciones (Cuotas)</h3>
                            <form onSubmit={(e) => {
                              e.preventDefault();
                              const c = congelarMonto(formGastoFijo.monto, formGastoFijo.moneda);
                              const nuevo = { id: Date.now(), concepto: formGastoFijo.concepto, tipo: formGastoFijo.tipo, cuotasTotales: formGastoFijo.tipo === 'cuotas' ? parseInt(formGastoFijo.cuotasTotales) || 1 : null, cuotasPagadas: formGastoFijo.tipo === 'cuotas' ? 1 : null, monto_usd: c.monto_usd, moneda_original: c.moneda_original, monto_original: c.monto_original, cotizacion_historica: c.cotizacion_historica };
                              setGastosFijos([nuevo, ...safeArray(gastosFijos)]);
                              setFormGastoFijo({ ...formGastoFijo, concepto: '', monto: '' });
                            }} className="space-y-4 text-sm bg-slate-950 p-5 rounded-2xl border border-slate-800">
                              <div className="grid grid-cols-2 gap-3">
                                <input type="text" required placeholder="Ej: Creatina cuotas, Netflix, Alquiler" value={formGastoFijo.concepto} onChange={e => setFormGastoFijo({...formGastoFijo, concepto: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500" />
                                <select value={formGastoFijo.tipo} onChange={e => setFormGastoFijo({...formGastoFijo, tipo: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold focus:outline-none focus:border-purple-500">
                                  <option value="fijo">Gasto Fijo Mensual</option><option value="cuotas">Compra en Cuotas</option>
                                </select>
                              </div>
                              <div className="flex gap-2">
                                <input type="number" step="any" required placeholder="Valor Mensual" value={formGastoFijo.monto} onChange={e => setFormGastoFijo({...formGastoFijo, monto: e.target.value})} className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:border-purple-500" />
                                <select value={formGastoFijo.moneda} onChange={e => setFormGastoFijo({...formGastoFijo, moneda: e.target.value})} className="bg-slate-900 border border-purple-500 rounded-xl px-3 py-3 text-white font-bold text-xs focus:outline-none">
                                  <option value="ARS">ARS</option><option value="USD">USD</option>
                                </select>
                                {formGastoFijo.tipo === 'cuotas' && <input type="number" required placeholder="Total Meses" value={formGastoFijo.cuotasTotales} onChange={e => setFormGastoFijo({...formGastoFijo, cuotasTotales: e.target.value})} className="w-28 bg-slate-900 border border-amber-500 rounded-xl px-4 py-3 text-white font-mono focus:outline-none" title="Cantidad de Cuotas Totales" />}
                              </div>
                              <PreviewBimonetario monto={formGastoFijo.monto} moneda={formGastoFijo.moneda} cotizacion={cotizacionDolar} />
                              <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-3.5 rounded-xl transition-all shadow-lg tracking-widest uppercase mt-2">Guardar Gasto Fijo / Cuota</button>
                            </form>
                            <div className="space-y-2.5 max-h-64 overflow-y-auto pt-2 border-t border-slate-800 text-xs pr-2">
                              {safeArray(gastosFijos).length === 0 ? <p className="text-center text-slate-500 py-6 font-bold border-2 border-dashed border-slate-800 rounded-xl">Sin gastos fijos cargados.</p> : safeArray(gastosFijos).map(gf => (
                                <div key={gf.id} className="bg-slate-950 border border-slate-800 rounded-xl p-4 flex justify-between items-center transition-all hover:border-slate-700">
                                  <div>
                                    <p className="font-bold text-white text-sm">{gf.concepto} {gf.tipo === 'cuotas' ? <span className="bg-amber-950 text-amber-300 border border-amber-700 px-2 py-0.5 rounded text-[10px] ml-2">Cuota {gf.cuotasPagadas}/{gf.cuotasTotales}</span> : <span className="bg-purple-950 text-purple-300 border border-purple-700 px-2 py-0.5 rounded text-[10px] ml-2">Mensual Fijo</span>}</p>
                                    <p className="text-[10px] text-slate-500 font-mono mt-1">{fmtHistorico(gf)}</p>
                                  </div>
                                  <div className="flex items-center gap-3">
                                    <span className="font-mono font-black text-rose-400 text-base">{fmtMoney(gf.monto_usd)}/m</span>
                                    {gf.tipo === 'cuotas' && gf.cuotasPagadas < gf.cuotasTotales && <button onClick={() => setGastosFijos(gastosFijos.map(x => x.id === gf.id ? { ...x, cuotasPagadas: x.cuotasPagadas + 1 } : x))} className="bg-emerald-950 hover:bg-emerald-800 text-emerald-300 border border-emerald-700 px-3 py-1.5 rounded-lg text-[10px] font-bold transition-colors">+1 Pago</button>}
                                    <button onClick={() => setGastosFijos(gastosFijos.filter(x => x.id !== gf.id))} className="text-slate-500 hover:text-rose-400 text-sm"><i className="fa-solid fa-trash"></i></button>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>

                        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-xl">
                          <div>
                            <h3 className="font-extrabold text-white text-lg">Actualizar PIN de Seguridad (6 dígitos)</h3>
                            <p className="text-xs text-slate-400 mt-1">Nadie, excepto vos, debe saber esta clave.</p>
                          </div>
                          <div className="flex gap-3 text-sm w-full md:w-auto">
                            <input type="password" maxLength="6" placeholder="Nuevo PIN de 6 números..." value={nuevoPinInput} onChange={e => setNuevoPinInput(e.target.value)} className="w-full md:w-64 bg-slate-950 border border-slate-700 rounded-xl px-5 py-3.5 text-white font-mono text-center tracking-widest focus:outline-none focus:border-purple-500" />
                            <button onClick={() => { if (/^\d{6}$/.test(nuevoPinInput)) { setPinPatrimonio(nuevoPinInput); setNuevoPinInput(''); alert('✅ PIN actualizado correctamente. Se requiere para el próximo acceso.'); setPatrimonioDesbloqueado(false); } else { alert('❌ El PIN debe tener exactamente 6 números.'); } }} className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg transition-all tracking-widest uppercase text-xs">Actualizar y Bloquear</button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })()}

              {/* VISTAS RESTANTES COMPACTAS (ACT, SOCIOS, ESTADISTICAS) */}
              {(vista === 'socios' || vista === 'estadisticas' || vista === 'actividad' || vista === 'config' || vista === 'cuentas') && (
                <div className="space-y-8 max-w-5xl mx-auto fade-in">
                  <header>
                    <h2 className="text-4xl font-black text-white tracking-tight capitalize">{vista}</h2>
                  </header>
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-slate-400 text-sm shadow-xl">
                    <p className="font-bold text-lg text-white mb-2">Panel Operativo de {vista}</p>
                    <p>Las funcionalidades de esta sección se encuentran activas en el motor de base de datos Supabase.</p>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* ========================================================================= */}
          {/* MODALES FLOTANTES GLOBALES */}
          {/* ========================================================================= */}
          {modalEditarSaldoBruno && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const c = congelarMonto(formSaldoBruno.monto, formSaldoBruno.moneda);
                if (formSaldoBruno.modo === 'establecer') setSaldoInicialBruno(c.monto_usd);
                else if (formSaldoBruno.modo === 'sumar') setSaldoInicialBruno(saldoInicialBruno + c.monto_usd);
                setModalEditarSaldoBruno(false);
                setFormSaldoBruno({ modo: 'establecer', monto: '', moneda: 'ARS' });
              }} className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-md w-full space-y-6 shadow-2xl">
                <h3 className="font-black text-white text-xl">Actualizar Dinero en Banco / Efectivo Libre</h3>
                <select value={formSaldoBruno.modo} onChange={e => setFormSaldoBruno({...formSaldoBruno, modo: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-white font-bold focus:outline-none focus:border-purple-500">
                  <option value="establecer">Establecer saldo total exacto</option>
                  <option value="sumar">Sumar este dinero al saldo actual</option>
                </select>
                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                  <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">Monto a registrar</label>
                  <div className="flex gap-2">
                    <input type="number" step="any" required placeholder="Ej: 50000" value={formSaldoBruno.monto} onChange={e => setFormSaldoBruno({...formSaldoBruno, monto: e.target.value})} className="w-2/3 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-white font-mono text-lg focus:outline-none focus:border-purple-500" />
                    <select value={formSaldoBruno.moneda} onChange={e => setFormSaldoBruno({...formSaldoBruno, moneda: e.target.value})} className="w-1/3 bg-slate-900 border border-purple-500 rounded-xl px-3 py-3.5 text-white font-bold text-sm focus:outline-none">
                      <option value="ARS">ARS</option><option value="USD">USD</option>
                    </select>
                  </div>
                  <PreviewBimonetario monto={formSaldoBruno.monto} moneda={formSaldoBruno.moneda} cotizacion={cotizacionDolar} />
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="submit" className="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl shadow-lg transition-colors uppercase tracking-widest text-xs">Guardar Saldo</button>
                  <button type="button" onClick={() => setModalEditarSaldoBruno(false)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-6 py-4 rounded-xl uppercase tracking-widest text-xs transition-colors">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {modalEditStock && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const c = congelarMonto(modalEditStock.costoInput, modalEditStock.monedaInput);
                setStockRepuestos(safeArray(stockRepuestos).map(s => s.id === modalEditStock.id ? { ...s, modelo: modalEditStock.modelo, cantidad: parseInt(modalEditStock.cantidad) || 0, costo_unitario_usd: c.monto_usd, moneda_original: c.moneda_original, monto_original: c.monto_original, cotizacion_historica: c.cotizacion_historica } : s));
                setModalEditStock(null);
              }} className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-md w-full space-y-5 shadow-2xl">
                <h3 className="font-black text-white text-xl border-b border-slate-800 pb-3">Editar Repuesto en Stock</h3>
                <div>
                  <label className="block text-slate-400 font-bold mb-1.5 text-xs uppercase tracking-widest">Modelo / Descripción</label>
                  <input type="text" required value={modalEditStock.modelo} onChange={e => setModalEditStock({...modalEditStock, modelo: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-purple-500" />
                </div>
                <div>
                  <label className="block text-slate-400 font-bold mb-1.5 text-xs uppercase tracking-widest">Cantidad en Existencia</label>
                  <input type="number" required value={modalEditStock.cantidad} onChange={e => setModalEditStock({...modalEditStock, cantidad: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-white font-mono focus:outline-none focus:border-purple-500" />
                </div>
                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-2 mt-2">
                  <label className="block text-slate-400 font-bold text-[10px] uppercase tracking-widest">Costo Unitario (Modificar ARS o USD)</label>
                  <div className="flex gap-2">
                    <input type="number" step="any" required value={modalEditStock.costoInput} onChange={e => setModalEditStock({...modalEditStock, costoInput: e.target.value})} className="w-2/3 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:border-purple-500" />
                    <select value={modalEditStock.monedaInput} onChange={e => setModalEditStock({...modalEditStock, monedaInput: e.target.value})} className="w-1/3 bg-slate-900 border border-purple-500 rounded-xl px-3 py-3 text-white font-bold focus:outline-none">
                      <option value="USD">USD</option><option value="ARS">ARS</option>
                    </select>
                  </div>
                  <PreviewBimonetario monto={modalEditStock.costoInput} moneda={modalEditStock.monedaInput} cotizacion={cotizacionDolar} />
                </div>
                <div className="flex gap-3 pt-3">
                  <button type="submit" className="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl shadow-lg transition-colors uppercase tracking-widest text-xs">Guardar Cambios</button>
                  <button type="button" onClick={() => setModalEditStock(null)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-6 py-4 rounded-xl uppercase tracking-widest text-xs transition-colors">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {modalPagoParcialDeuda && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const c = congelarMonto(formAbonoDeuda.monto, formAbonoDeuda.moneda);
                const n = Math.max(0, (modalPagoParcialDeuda.monto_usd || 0) - c.monto_usd);
                setDeudasFavor(safeArray(deudasFavor).map(d => d.id === modalPagoParcialDeuda.id ? { ...d, monto_usd: n, estado: n <= 0.05 ? 'Cobrado' : 'Pendiente' } : d));
                setModalPagoParcialDeuda(null);
              }} className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-md w-full space-y-6 shadow-2xl">
                <div>
                  <h3 className="font-black text-white text-xl">Entrega Parcial: {modalPagoParcialDeuda.deudor}</h3>
                  <p className="text-slate-400 text-sm mt-1">Deuda total actual: <strong className="text-emerald-400">{fmtMoney(modalPagoParcialDeuda.monto_usd)}</strong></p>
                </div>
                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                  <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">Monto del abono recibido</label>
                  <div className="flex gap-2">
                    <input type="number" step="any" required placeholder="Monto..." value={formAbonoDeuda.monto} onChange={e => setFormAbonoDeuda({...formAbonoDeuda, monto: e.target.value})} className="w-2/3 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:border-amber-500 text-lg" />
                    <select value={formAbonoDeuda.moneda} onChange={e => setFormAbonoDeuda({...formAbonoDeuda, moneda: e.target.value})} className="w-1/3 bg-slate-900 border border-amber-500 rounded-xl px-3 py-3 text-white font-bold text-sm focus:outline-none">
                      <option value="ARS">ARS</option><option value="USD">USD</option>
                    </select>
                  </div>
                  <PreviewBimonetario monto={formAbonoDeuda.monto} moneda={formAbonoDeuda.moneda} cotizacion={cotizacionDolar} />
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="submit" className="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl shadow-lg transition-colors uppercase tracking-widest text-xs">Descontar Pago</button>
                  <button type="button" onClick={() => setModalPagoParcialDeuda(null)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-6 py-4 rounded-xl transition-colors uppercase tracking-widest text-xs">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {modalDolar && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 fade-in">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full space-y-6 shadow-2xl">
                <div className="text-center">
                  <h3 className="font-black text-white text-2xl">Actualizar Cotización</h3>
                  <p className="text-[11px] text-slate-400 mt-2 leading-relaxed">Los registros anteriores ya tienen su cotización guardada e inmutable. Este cambio solo aplica para lo que cargues desde ahora.</p>
                </div>
                <div className="bg-slate-950 p-5 rounded-2xl border border-emerald-900/50 flex justify-center items-center gap-3 shadow-inner">
                  <i className="fa-solid fa-money-bill-1-wave text-emerald-500 text-3xl"></i>
                  <input type="number" step="any" value={nuevaCotizacionInput} onChange={e => setNuevaCotizacionInput(e.target.value)} placeholder={cotizacionDolar} className="w-40 bg-transparent text-white font-mono text-4xl text-center font-black focus:outline-none placeholder:text-slate-600" />
                </div>
                <div className="flex gap-3">
                  <button onClick={() => { const val = parseFloat(nuevaCotizacionInput); if (!isNaN(val) && val > 0) { setCotizacionDolar(val); setFechaUltimaCotizacion(new Date().toISOString()); setModalDolar(false); setNuevaCotizacionInput(''); } }} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-colors uppercase tracking-widest text-xs shadow-lg">Fijar Dólar</button>
                  <button onClick={() => setModalDolar(false)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-6 py-4 rounded-xl uppercase tracking-widest text-xs transition-colors">Volver</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <MainApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
