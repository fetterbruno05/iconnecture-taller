                          </div>
                        ) : (
                          <div className="space-y-4">
                            {equiposActivos.map(ord => {
                              const diasEnTaller = Math.floor((new Date() - new Date(ord.fecha_ingreso)) / (1000 * 60 * 60 * 24));
                              const esDemorado = diasEnTaller >= 3;
                              const msgWspIngreso = `Hola ${ord.cliente_nombre}, recibimos tu ${ord.equipo_modelo} en ICONNECTURE. Tu N° de Orden es #ORD-${String(ord.id).slice(-4)}. Estado de ingreso: ${ord.estado_fisico}.`;
                              const msgWspListo = `Hola ${ord.cliente_nombre}, te avisamos de ICONNECTURE que tu ${ord.equipo_modelo} (Orden #ORD-${String(ord.id).slice(-4)}) ya está listo para retirar.`;

                              return (
                                <div key={ord.id} className={`bg-slate-900 border-2 rounded-3xl p-5 space-y-3 transition ${esDemorado ? 'border-rose-600 bg-rose-950/15' : 'border-slate-800'}`}>
                                  {esDemorado && (
                                    <div className="bg-rose-600/20 border border-rose-500 text-rose-300 px-3.5 py-2 rounded-xl text-xs font-bold flex items-center justify-between">
                                      <span><i className="fa-solid fa-triangle-exclamation mr-2"></i>ALERTA DE DEMORA: Equipo lleva {diasEnTaller} días en el taller</span>
                                      <span className="uppercase text-[10px] bg-rose-600 text-white px-2 py-0.5 rounded">Revisar urgente</span>
                                    </div>
                                  )}

                                  <div className="flex justify-between items-start gap-3">
                                    <div>
                                      <div className="flex flex-wrap items-center gap-2">
                                        <span className="text-xs font-mono text-purple-400 font-bold">#ORD-{String(ord.id).slice(-4)}</span>
                                        <span className={`text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase ${ord.tipo_cliente === 'gremio' ? 'bg-amber-950 text-amber-300 border border-amber-700' : 'bg-blue-950 text-blue-300 border border-blue-700'}`}>
                                          {ord.tipo_cliente}
                                        </span>
                                        <span className={`text-[10px] font-black px-2.5 py-0.5 rounded-full ${
                                          ord.prioridad === 'Alta' ? 'bg-rose-950 text-rose-300 border border-rose-700' :
                                          ord.prioridad === 'Moderada' ? 'bg-amber-950 text-amber-300' : 'bg-emerald-950 text-emerald-300'
                                        }`}>
                                          Prioridad {ord.prioridad}
                                        </span>
                                      </div>
                                      <h4 className="text-xl font-extrabold text-white mt-1">{ord.equipo_modelo}</h4>
                                      <p className="text-xs text-slate-300">
                                        Cliente: <strong>{ord.cliente_nombre}</strong> • Tel: {ord.cliente_telefono} {ord.cliente_telefono_alt !== 'N/A' ? `| Alt: ${ord.cliente_telefono_alt}` : ''}
                                      </p>
                                    </div>

                                    <select
                                      value={ord.estado}
                                      onChange={e => setOrdenes(ordenes.map(o => o.id === ord.id ? { ...o, estado: e.target.value } : o))}
                                      className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-white"
                                    >
                                      <option value="Recibido">Recibido</option>
                                      <option value="En Diagnóstico">En Diagnóstico</option>
                                      <option value="Esperando Repuesto">Esperando Repuesto</option>
                                      <option value="Listo para Entregar">Listo para Entregar</option>
                                      <option value="Entregado">Entregado</option>
                                    </select>
                                  </div>

                                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-xs space-y-1.5 text-slate-300">
                                    <p><strong className="text-slate-400">Trabajo / Falla:</strong> {ord.falla_declarada}</p>
                                    <p><strong className="text-slate-400">Estado de Ingreso:</strong> {ord.estado_fisico}</p>
                                    {ord.tuvo_reparacion_previa === 'si' && (
                                      <p className="text-amber-300"><strong>Reparación previa:</strong> {ord.detalle_reparacion_previa} ({ord.taller_previo} - {ord.fecha_previa})</p>
                                    )}
                                    <div className="flex flex-wrap justify-between pt-1 text-[11px] text-slate-400 font-mono">
                                      <span>IMEI: {ord.imei_serie || 'Sin IMEI'}</span>
                                      {ord.presupuesto_usd > 0 && (
                                        <span className="text-emerald-400 font-bold">
                                          Presupuesto: {fmtMoney(ord.presupuesto_usd)} ({fmtHistorico(ord)})
                                        </span>
                                      )}
                                    </div>
                                  </div>

                                  <div className="flex flex-wrap justify-between items-center gap-2 pt-2 border-t border-slate-800 text-xs">
                                    <span className="text-slate-500 text-[11px]">Ingresó: {new Date(ord.fecha_ingreso).toLocaleString()}</span>
                                    <div className="flex flex-wrap gap-2">
                                      {ord.tipo_cliente === 'minorista' && (
                                        <>
                                          <a
                                            href={`https://wa.me/${(ord.cliente_telefono || '').replace(/\D/g, '')}?text=${encodeURIComponent(msgWspIngreso)}`}
                                            target="_blank" rel="noreferrer"
                                            className="bg-emerald-950 hover:bg-emerald-900 text-emerald-300 border border-emerald-700 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5"
                                          >
                                            <i className="fa-brands fa-whatsapp"></i> Wsp Ingreso
                                          </a>
                                          <a
                                            href={`https://wa.me/${(ord.cliente_telefono || '').replace(/\D/g, '')}?text=${encodeURIComponent(msgWspListo)}`}
                                            target="_blank" rel="noreferrer"
                                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5"
                                          >
                                            <i className="fa-brands fa-whatsapp"></i> Wsp Listo
                                          </a>
                                        </>
                                      )}
                                      <button onClick={() => setReciboModal(ord)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl font-bold">
                                        <i className="fa-solid fa-print mr-1"></i> Orden PDF
                                      </button>
                                      <button
                                        onClick={() => {
                                          setEquipoSeleccionadoParaReparar(ord);
                                          setModalCargarReparacion(true);
                                        }}
                                        className="bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded-xl font-bold"
                                      >
                                        Finalizar Reparación
                                      </button>
                                    </div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })()}

              {/* ========================================================================= */}
              {/* VISTA 3: CARGAR REPARACIÓN + HISTORIAL + ESTADÍSTICAS DE REPARACIÓN (P.9) */}
              {/* ========================================================================= */}
              {vista === 'reparaciones' && (() => {
                const repFiltradas = reparaciones
                  .filter(r => filtroEstadoPagoRep === 'Todos' || r.estado_pago === filtroEstadoPagoRep)
                  .filter(r => filtroTipoClienteRep === 'Todos' || r.tipo_cliente === filtroTipoClienteRep)
                  .filter(r => !filtroFechaDesdeRep || (r.fecha_completado || '').split('T')[0] >= filtroFechaDesdeRep)
                  .filter(r => !filtroFechaHastaRep || (r.fecha_completado || '').split('T')[0] <= filtroFechaHastaRep)
                  .filter(r => {
                    const q = busquedaReparaciones.toLowerCase();
                    return !q ||
                      (r.equipo_modelo || '').toLowerCase().includes(q) ||
                      (r.cliente_nombre || '').toLowerCase().includes(q) ||
                      (r.imei_serie || '').includes(q);
                  });

                const pagadas = reparaciones.filter(r => r.estado_pago === 'Pagado');
                const cantNuevos = reparaciones.filter(r => r.origen_cliente === 'Nuevo').length;
                const cantRecurrentes = reparaciones.filter(r => r.origen_cliente === 'Recurrente').length;
                const cantReferidos = reparaciones.filter(r => r.origen_cliente === 'Referido').length;

                return (
                  <div className="space-y-7 max-w-7xl mx-auto fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                      <div>
                        <h2 className="text-3xl font-extrabold text-white">Reparaciones Realizadas y Cobranzas</h2>
                        <p className="text-slate-400 text-sm">Cierre técnico con descuento automático de stock, estados Pendiente/Pagado y métricas</p>
                      </div>
                      <button
                        onClick={() => setModalCargarReparacion(true)}
                        className="bg-purple-600 hover:bg-purple-500 text-white font-black px-6 py-3.5 rounded-2xl text-sm flex items-center gap-2 shadow-lg shadow-purple-950"
                      >
                        <i className="fa-solid fa-plus"></i> Cargar Reparación Realizada
                      </button>
                    </div>

                    {/* ESTADÍSTICAS DEL MÓDULO DE REPARACIONES (PUNTO 9) */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                        <p className="text-xs text-slate-400 font-bold">Total Reparaciones / Cobradas</p>
                        <h4 className="text-2xl font-black text-white mt-1">{reparaciones.length} <span className="text-sm text-emerald-400">({pagadas.length} pagadas)</span></h4>
                      </div>
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                        <p className="text-xs text-slate-400 font-bold">Facturación Bruta Total</p>
                        <h4 className="text-2xl font-black text-blue-400 mt-1">{fmtMoney(pagadas.reduce((a, r) => a + (r.total_usd || 0), 0))}</h4>
                      </div>
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                        <p className="text-xs text-slate-400 font-bold">Ganancia Neta (Mano de Obra)</p>
                        <h4 className="text-2xl font-black text-emerald-400 mt-1">{fmtMoney(pagadas.reduce((a, r) => a + (r.mano_obra_usd || 0), 0))}</h4>
                      </div>
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                        <p className="text-xs text-slate-400 font-bold">Fidelidad de Clientes</p>
                        <p className="text-xs text-slate-300 mt-2 font-mono">
                          Nuevos: <strong>{cantNuevos}</strong> | Recurr: <strong>{cantRecurrentes}</strong> | Referidos: <strong>{cantReferidos}</strong>
                        </p>
                      </div>
                    </div>

                    {/* FILTROS DE REPARACIONES */}
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-3">
                      <div className="flex justify-between items-center">
                        <h3 className="text-sm font-bold text-white">Filtrar Historial de Reparaciones</h3>
                        <button
                          onClick={() => {
                            setBusquedaReparaciones(''); setFiltroEstadoPagoRep('Todos');
                            setFiltroTipoClienteRep('Todos'); setFiltroFechaDesdeRep(''); setFiltroFechaHastaRep('');
                          }}
                          className="text-xs text-purple-400 hover:underline font-bold"
                        >
                          Limpiar filtros
                        </button>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-5 gap-3 text-xs">
                        <input type="text" placeholder="Buscar equipo, cliente, IMEI..." value={busquedaReparaciones} onChange={e => setBusquedaReparaciones(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white" />
                        <select value={filtroEstadoPagoRep} onChange={e => setFiltroEstadoPagoRep(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-bold">
                          <option value="Todos">Todos (Pendientes + Pagados)</option>
                          <option value="Pendiente">⏳ Solo Pendientes de Cobro</option>
                          <option value="Pagado">✅ Solo Pagados</option>
                        </select>
                        <select value={filtroTipoClienteRep} onChange={e => setFiltroTipoClienteRep(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white">
                          <option value="Todos">Gremio + Minorista</option>
                          <option value="gremio">Solo Gremio (100% Bruno)</option>
                          <option value="minorista">Solo Minorista (50/50)</option>
                        </select>
                        <input type="date" value={filtroFechaDesdeRep} onChange={e => setFiltroFechaDesdeRep(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white" />
                        <input type="date" value={filtroFechaHastaRep} onChange={e => setFiltroFechaHastaRep(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white" />
                      </div>
                    </div>

                    {/* TABLA DE REPARACIONES */}
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 overflow-x-auto">
                      <table className="w-full text-left text-xs text-slate-300">
                        <thead className="bg-slate-950 text-slate-400 uppercase font-bold border-b border-slate-800">
                          <tr>
                            <th className="px-4 py-3.5">Fecha / Equipo / Cliente</th>
                            <th className="px-4 py-3.5">Tipo</th>
                            <th className="px-4 py-3.5">Repuestos</th>
                            <th className="px-4 py-3.5">Costo Rep.</th>
                            <th className="px-4 py-3.5">Ganancia Neta</th>
                            <th className="px-4 py-3.5">Total Cobrado</th>
                            <th className="px-4 py-3.5">Estado</th>
                            <th className="px-4 py-3.5">Acción</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800">
                          {repFiltradas.length === 0 ? (
                            <tr><td colSpan="8" className="px-4 py-8 text-center text-slate-500">No hay reparaciones registradas para este filtro.</td></tr>
                          ) : (
                            repFiltradas.map(r => (
                              <tr key={r.id} className="hover:bg-slate-950/50">
                                <td className="px-4 py-3.5">
                                  <p className="font-bold text-white text-sm">{r.equipo_modelo}</p>
                                  <p className="text-slate-400">{r.cliente_nombre} • {new Date(r.fecha_completado).toLocaleDateString()}</p>
                                  <p className="text-[10px] text-slate-500 font-mono">{fmtHistorico(r)}</p>
                                </td>
                                <td className="px-4 py-3.5">
                                  <span className={`px-2.5 py-1 rounded-md font-bold text-[10px] uppercase ${r.tipo_cliente === 'gremio' ? 'bg-amber-950 text-amber-300' : 'bg-blue-950 text-blue-300'}`}>
                                    {r.tipo_cliente}
                                  </span>
                                </td>
                                <td className="px-4 py-3.5 text-slate-300">
                                  {(r.repuestos || []).map((rep, i) => <div key={i}>• {rep.nombre}</div>)}
                                </td>
                                <td className="px-4 py-3.5 font-mono text-rose-300">{fmtMoney(r.costo_repuestos_usd)}</td>
                                <td className="px-4 py-3.5 font-mono font-bold text-emerald-400">
                                  {fmtMoney(r.mano_obra_usd)}
                                  <div className="text-[10px] text-slate-400">{fmtMoney(r.mano_obra_usd, 'ARS')}</div>
                                </td>
                                <td className="px-4 py-3.5 font-mono font-black text-white text-sm">{fmtMoney(r.total_usd)}</td>
                                <td className="px-4 py-3.5">
                                  <span className={`px-3 py-1 rounded-full font-bold text-[10px] uppercase ${
                                    r.estado_pago === 'Pagado'
                                      ? 'bg-emerald-950 text-emerald-400 border border-emerald-700'
                                      : 'bg-slate-800 text-amber-300 border border-amber-700/60'
                                  }`}>
                                    {r.estado_pago}
                                  </span>
                                </td>
                                <td className="px-4 py-3.5">
                                  {r.estado_pago === 'Pendiente' ? (
                                    <button
                                      onClick={() => marcarPagadoReparacion(r.id)}
                                      className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl font-bold text-xs shadow"
                                    >
                                      Marcar Pagado
                                    </button>
                                  ) : (
                                    <span className="text-emerald-500 font-bold"><i className="fa-solid fa-check-double mr-1"></i>Acreditado</span>
                                  )}
                                </td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                );
              })()}

              {/* ========================================================================= */}
              {/* VISTA 4: CONTROL DE GARANTÍAS (PUNTO 8 COMPLETO)                          */}
              {/* ========================================================================= */}
              {vista === 'garantias' && (() => {
                const equiposEntregados = reparaciones
                  .filter(r => r.estado_pago === 'Pagado')
                  .filter(r => !filtroDesdeGarantia || (r.fecha_pago || r.fecha_completado || '').split('T')[0] >= filtroDesdeGarantia)
                  .filter(r => !filtroHastaGarantia || (r.fecha_pago || r.fecha_completado || '').split('T')[0] <= filtroHastaGarantia)
                  .filter(r => {
                    const q = busquedaGarantias.toLowerCase();
                    return !q ||
                      (r.imei_serie || '').includes(q) ||
                      (r.equipo_modelo || '').toLowerCase().includes(q) ||
                      (r.cliente_nombre || '').toLowerCase().includes(q);
                  });

                return (
                  <div className="space-y-7 max-w-7xl mx-auto fade-in">
                    <header>
                      <h2 className="text-3xl font-extrabold text-white">Control Histórico de Garantías</h2>
                      <p className="text-slate-400 text-sm">Todos los equipos reparados con cuenta regresiva diaria en Verde (activa) o Rojo (0 - finalizada)</p>
                    </header>

                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 grid grid-cols-1 md:grid-cols-5 gap-3 text-xs">
                      <input
                        type="text"
                        placeholder="Buscar por IMEI (15 dígitos), cliente o modelo..."
                        value={busquedaGarantias}
                        onChange={e => setBusquedaGarantias(e.target.value)}
                        className="md:col-span-2 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white"
                      />
                      <select value={filtroEstadoGarantia} onChange={e => setFiltroEstadoGarantia(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-bold">
                        <option value="Todas">Todas (Vigentes + Finalizadas)</option>
                        <option value="Vigentes">🟢 Solo Garantías Vigentes</option>
                        <option value="Finalizadas">🔴 Solo Garantías Finalizadas (0 días)</option>
                      </select>
                      <input type="date" value={filtroDesdeGarantia} onChange={e => setFiltroDesdeGarantia(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white" />
                      <button
                        onClick={() => { setBusquedaGarantias(''); setFiltroEstadoGarantia('Todas'); setFiltroDesdeGarantia(''); setFiltroHastaGarantia(''); }}
                        className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl px-3 py-2.5"
                      >
                        Limpiar Filtros
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                      {equiposEntregados
                        .filter(r => {
                          const diasPasados = Math.floor((new Date() - new Date(r.fecha_pago || r.fecha_completado)) / (1000 * 60 * 60 * 24));
                          const restantes = Math.max(0, (r.garantia_dias || 0) - diasPasados);
                          if (filtroEstadoGarantia === 'Vigentes') return restantes > 0;
                          if (filtroEstadoGarantia === 'Finalizadas') return restantes === 0;
                          return true;
                        })
                        .map(r => {
                          const entrega = new Date(r.fecha_pago || r.fecha_completado);
                          const diasPasados = Math.floor((new Date() - entrega) / (1000 * 60 * 60 * 24));
                          const restantes = Math.max(0, (r.garantia_dias || 0) - diasPasados);
                          const vigente = restantes > 0;

                          return (
                            <div key={r.id} className={`bg-slate-900 border-2 rounded-3xl p-6 space-y-3 ${vigente ? 'border-emerald-700/60' : 'border-rose-700/60'}`}>
                              <div className="flex justify-between items-center">
                                <span className="text-xs font-mono bg-slate-950 px-2.5 py-1 rounded-lg text-purple-300 border border-slate-800">
                                  IMEI: {r.imei_serie || 'N/A'}
                                </span>
                                <span className={`px-3 py-1 rounded-full text-xs font-black ${
                                  vigente ? 'bg-emerald-950 text-emerald-400 border border-emerald-600' : 'bg-rose-950 text-rose-400 border border-rose-600'
                                }`}>
                                  {vigente ? `${restantes} días de garantía` : '0 días • Garantía finalizada'}
                                </span>
                              </div>
                              <div>
                                <h4 className="text-lg font-extrabold text-white">{r.equipo_modelo}</h4>
                                <p className="text-xs text-slate-300">Cliente: <strong>{r.cliente_nombre}</strong> ({r.cliente_telefono})</p>
                              </div>
                              <div className="bg-slate-950 rounded-xl p-3 text-xs text-slate-400 space-y-1">
                                <p><strong>Fecha reparación:</strong> {entrega.toLocaleDateString()}</p>
                                <p><strong>Trabajo/Repuesto:</strong> {(r.repuestos || []).map(x => x.nombre).join(', ')}</p>
                              </div>
                            </div>
                          );
                        })}
                    </div>
                  </div>
                );
              })()}

              {/* ========================================================================= */}
              {/* VISTA 5: STOCK DE REPUESTOS Y BATERÍAS (CON CARGA EN ARS O USD)           */}
              {/* ========================================================================= */}
              {vista === 'stock' && (() => {
                const stockFiltrado = stockRepuestos
                  .filter(s => filtroCategoriaStock === 'Todas' || s.categoria === filtroCategoriaStock)
                  .filter(s => !busquedaStock || (s.modelo || '').toLowerCase().includes(busquedaStock.toLowerCase()));

                return (
                  <div className="space-y-7 max-w-7xl mx-auto fade-in">
                    <div className="flex justify-between items-center">
                      <div>
                        <h2 className="text-3xl font-extrabold text-white">Stock de Baterías y Repuestos</h2>
                        <p className="text-slate-400 text-sm">Cargá costos en ARS o USD (se suma automáticamente a tu Patrimonio Personal)</p>

                      <div className="bg-slate-900 border border-purple-500/40 rounded-2xl px-5 py-3 text-right">
                        <p className="text-[11px] text-slate-400 uppercase font-bold">Valor Total del Inventario</p>
                        <p className="text-2xl font-black text-emerald-400">{fmtMoney(totalValorStock)} <span className="text-xs text-slate-400">({fmtMoney(totalValorStock, 'ARS')})</span></p>
                      </div>
                    </div>

                    {/* FORMULARIO AGREGAR STOCK EN ARS O USD */}
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">

                      <form onSubmit={(e) => {
                        e.preventDefault();
                        const cCongelado = congelarMonto(formNuevoStock.costo, formNuevoStock.moneda);
                        const nuevo = {
                          id: Date.now(),
                          categoria: formNuevoStock.categoria,
                          modelo: formNuevoStock.modelo,
                          cantidad: parseInt(formNuevoStock.cantidad) || 0,
                          costo_unitario_usd: cCongelado.monto_usd,
                          moneda_original: cCongelado.moneda_original,
                          monto_original: cCongelado.monto_original,
                          cotizacion_historica: cCongelado.cotizacion_historica
                        };
                        setStockRepuestos([nuevo, ...stockRepuestos]);
                        registrarLog('Stock', 'Alta de Repuesto', `${nuevo.categoria} ${nuevo.modelo} (${nuevo.cantidad} u.)`);
                        setFormNuevoStock({ ...formNuevoStock, modelo: '', cantidad: '', costo: '' });
                      }} className="grid grid-cols-1 md:grid-cols-12 gap-3 text-xs">
                        <select
                          value={formNuevoStock.categoria}
                          onChange={e => setFormNuevoStock({...formNuevoStock, categoria: e.target.value})}
                          className="md:col-span-2 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-bold"
                        >
                          <option value="Batería">🔋 Batería</option>
                          <option value="Pantalla / Módulo">📱 Pantalla / Módulo</option>
                          <option value="Tapa Trasera">🔙 Tapa Trasera</option>
                          <option value="Flex de Carga">🔌 Flex de Carga</option>
                          <option value="Insumo">🛠 Insumo</option>
                        </select>
                        <input
                          type="text" required
                          placeholder="Modelo (Ej: iPhone 13 Pro)"
                          value={formNuevoStock.modelo}
                          onChange={e => setFormNuevoStock({...formNuevoStock, modelo: e.target.value})}
                          className="md:col-span-4 bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white"
                        />
                        <input
                          type="number" required
                          placeholder="Cant."
                          value={formNuevoStock.cantidad}
                          onChange={e => setFormNuevoStock({...formNuevoStock, cantidad: e.target.value})}
                          className="md:col-span-2 bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white font-mono"
                        />
                        <div className="md:col-span-3 flex gap-1.5">
                          <input
                            type="number" step="any" required
                            placeholder="Costo Unitario"
                            value={formNuevoStock.costo}
                            onChange={e => setFormNuevoStock({...formNuevoStock, costo: e.target.value})}
                            className="w-2/3 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-mono"
                          />
                          <select
                            value={formNuevoStock.moneda}
                            onChange={e => setFormNuevoStock({...formNuevoStock, moneda: e.target.value})}
                            className="w-1/3 bg-slate-950 border border-purple-500 rounded-xl px-2 py-2.5 text-white font-bold"
                          >
                            <option value="USD">USD</option>
                            <option value="ARS">ARS</option>
                          </select>
                        </div>
                        <button type="submit" className="md:col-span-1 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl py-2.5">
                          Guardar
                        </button>
                      </form>
                      <ConversionPreview monto={formNuevoStock.costo} moneda={formNuevoStock.moneda} cotizacion={cotizacionDolar} />
                    </div>

                    {/* TABLA DE STOCK */}
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
                      <div className="flex flex-wrap justify-between items-center gap-3">
                        <h3 className="text-base font-bold text-white">Inventario Actual ({stockFiltrado.length} ítems)</h3>
                        <div className="flex gap-2 text-xs">
                          <select value={filtroCategoriaStock} onChange={e => setFiltroCategoriaStock(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white">
                            <option value="Todas">Todas las categorías</option>
                            <option value="Batería">Solo Baterías</option>
                            <option value="Pantalla / Módulo">Solo Pantallas</option>
                            <option value="Tapa Trasera">Solo Tapas</option>
                            <option value="Flex de Carga">Solo Flex</option>
                          </select>
                          <input type="text" placeholder="Buscar modelo..." value={busquedaStock} onChange={e => setBusquedaStock(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-white" />
                        </div>
                      </div>

                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs text-slate-300">
                          <thead className="bg-slate-950 text-slate-400 uppercase font-bold border-b border-slate-800">
                            <tr>
                              <th className="px-4 py-3">Categoría</th>
                              <th className="px-4 py-3">Modelo / Detalle</th>
                              <th className="px-4 py-3">Cantidad</th>
                              <th className="px-4 py-3">Costo Unitario</th>
                              <th className="px-4 py-3">Valor Total Lote</th>
                              <th className="px-4 py-3">Acciones</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800">
                            {stockFiltrado.length === 0 ? (
                              <tr><td colSpan="6" className="px-4 py-8 text-center text-slate-500">No hay repuestos cargados.</td></tr>
                            ) : (
                              stockFiltrado.map(s => (
                                <tr key={s.id} className="hover:bg-slate-950/50">
                                  <td className="px-4 py-3 font-bold text-purple-400">{s.categoria}</td>
                                  <td className="px-4 py-3 font-bold text-white text-sm">
                                    {s.modelo}
                                    <div className="text-[10px] text-slate-500 font-mono">{fmtHistorico(s)}</div>
                                  </td>
                                  <td className="px-4 py-3 font-mono">
                                    <span className={`px-2.5 py-1 rounded-lg font-bold ${s.cantidad <= 2 ? 'bg-rose-950 text-rose-400 border border-rose-700' : 'bg-slate-800 text-white'}`}>
                                      {s.cantidad} u.
                                    </span>
                                  </td>
                                  <td className="px-4 py-3 font-mono">{fmtMoney(s.costo_unitario_usd)} <span className="text-slate-500">({fmtMoney(s.costo_unitario_usd, 'ARS')})</span></td>
                                  <td className="px-4 py-3 font-mono font-bold text-emerald-400">{fmtMoney(s.cantidad * s.costo_unitario_usd)}</td>
                                  <td className="px-4 py-3 flex gap-2">
                                    <button
                                      onClick={() => setModalEditStock({ ...s, costoInput: s.costo_unitario_usd, monedaInput: 'USD' })}
                                      className="bg-slate-800 hover:bg-slate-700 text-purple-300 px-3 py-1.5 rounded-lg font-bold"
                                    >
                                      <i className="fa-solid fa-pen mr-1"></i> Editar
                                    </button>
                                    <button
                                      onClick={() => setStockRepuestos(stockRepuestos.filter(x => x.id !== s.id))}
                                      className="bg-slate-800 hover:bg-rose-950 text-rose-400 px-2.5 py-1.5 rounded-lg"
                                    >
                                      <i className="fa-solid fa-trash"></i>
                                    </button>
                                  </td>
                                </tr>
                              ))
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                );
              })()}

              {/* ========================================================================= */}
              {/* VISTA 6: GASTOS DEL NEGOCIO Y CUENTAS POR PAGAR (PUNTO 5 COMPLETO)        */}
              {/* ========================================================================= */}
              {vista === 'gastos' && (() => {
                const hoyStr = new Date().toISOString().split('T')[0];
                const mesActualStr = hoyStr.slice(0, 7);

                const gastosFiltrados = gastosNegocio
                  .filter(g => filtroCatGastos === 'Todas' || g.categoria === filtroCatGastos)
                  .filter(g => filtroEstadoGastos === 'Todos' || g.estado === filtroEstadoGastos)
                  .filter(g => {
                    const f = (g.fecha || '').split('T')[0];
                    if (filtroTiempoGastos === 'hoy') return f === hoyStr;
                    if (filtroTiempoGastos === 'mes') return f.startsWith(mesActualStr);
                    if (filtroTiempoGastos === 'personalizado') {
                      if (filtroDesdeGastos && f < filtroDesdeGastos) return false;
                      if (filtroHastaGastos && f > filtroHastaGastos) return false;
                    }
                    return true;
                  })
                  .filter(g => {
                    const q = busquedaGastos.toLowerCase();
                    return !q || (g.concepto || '').toLowerCase().includes(q) || (g.proveedor || '').toLowerCase().includes(q);
                  });

                const totalFiltradoUSD = gastosFiltrados.reduce((acc, g) => acc + (g.monto_usd || 0), 0);

                return (
                  <div className="space-y-7 max-w-7xl mx-auto fade-in">
                    <header>
                      <h2 className="text-3xl font-extrabold text-white">Gastos del Negocio y Cuentas por Pagar</h2>
                      <p className="text-slate-400 text-sm">Control de egresos en ARS o USD con cotización histórica congelada y deudas propias</p>
                    </header>

                    {/* FORMULARIO DE GASTOS EN ARS O USD */}
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
                      <h3 className="text-base font-bold text-white">Registrar Gasto o Cuenta por Pagar (Deuda Propia)</h3>
                      <form onSubmit={(e) => {
                        e.preventDefault();
                        const cCongelado = congelarMonto(formGastoNegocio.monto, formGastoNegocio.moneda);
                        const nuevo = {
                          id: Date.now(),
                          concepto: formGastoNegocio.concepto,
                          proveedor: formGastoNegocio.proveedor || 'General',
                          categoria: formGastoNegocio.categoria,
                          medio_pago: formGastoNegocio.medio_pago,
                          estado: formGastoNegocio.estado,
                          responsable: usuarioSesion.nombre,
                          monto_usd: cCongelado.monto_usd,
                          moneda_original: cCongelado.moneda_original,
                          monto_original: cCongelado.monto_original,
                          cotizacion_historica: cCongelado.cotizacion_historica,
                          fecha: new Date().toISOString()
                        };
                        setGastosNegocio([nuevo, ...gastosNegocio]);
                        registrarLog('Gastos', 'Registro de Egreso', `${nuevo.concepto} (${nuevo.categoria}) - $${nuevo.monto_usd.toFixed(2)} USD [${nuevo.estado}]`);
                        setFormGastoNegocio({ ...formGastoNegocio, concepto: '', proveedor: '', monto: '' });
                      }} className="grid grid-cols-1 md:grid-cols-6 gap-3 text-xs">
                        <input
                          type="text" required placeholder="Concepto (Ej: Cadete a proveedor)"
                          value={formGastoNegocio.concepto}
                          onChange={e => setFormGastoNegocio({...formGastoNegocio, concepto: e.target.value})}
                          className="md:col-span-2 bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white"
                        />
                        <input
                          type="text" placeholder="Proveedor / Destinatario"
                          value={formGastoNegocio.proveedor}
                          onChange={e => setFormGastoNegocio({...formGastoNegocio, proveedor: e.target.value})}
                          className="bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white"
                        />
                        <div className="flex gap-1.5">
                          <input
                            type="number" step="any" required placeholder="Monto"
                            value={formGastoNegocio.monto}
                            onChange={e => setFormGastoNegocio({...formGastoNegocio, monto: e.target.value})}
                            className="w-2/3 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-mono"
                          />
                          <select
                            value={formGastoNegocio.moneda}
                            onChange={e => setFormGastoNegocio({...formGastoNegocio, moneda: e.target.value})}
                            className="w-1/3 bg-slate-950 border border-purple-500 rounded-xl px-2 py-2.5 text-white font-bold"
                          >
                            <option value="ARS">ARS</option>
                            <option value="USD">USD</option>
                          </select>
                        </div>
                        <select
                          value={formGastoNegocio.categoria}
                          onChange={e => setFormGastoNegocio({...formGastoNegocio, categoria: e.target.value})}
                          className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white"
                        >
                          {CATEGORIAS_GASTOS_NEGOCIO.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                        <select
                          value={formGastoNegocio.estado}
                          onChange={e => setFormGastoNegocio({...formGastoNegocio, estado: e.target.value})}
                          className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-bold"
                        >
                          <option value="Pagado">✅ Pagado hoy</option>
                          <option value="Pendiente">⏳ Cuenta por Pagar (Debo)</option>
                        </select>
                        <button type="submit" className="md:col-span-6 bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl transition">
                          Registrar Gasto / Compromiso
                        </button>
                      </form>
                      <ConversionPreview monto={formGastoNegocio.monto} moneda={formGastoNegocio.moneda} cotizacion={cotizacionDolar} />
                    </div>

                    {/* FILTROS Y LISTADO DE GASTOS */}
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
                      <div className="flex flex-wrap justify-between items-center gap-3">
                        <div className="flex flex-wrap gap-2 text-xs">
                          {[
                            { id: 'todos', label: 'Histórico Total' },
                            { id: 'hoy', label: 'Hoy' },
                            { id: 'mes', label: 'Este Mes' },
                            { id: 'personalizado', label: 'Rango Personalizado' }
                          ].map(t => (
                            <button
                              key={t.id}
                              onClick={() => setFiltroTiempoGastos(t.id)}
                              className={`px-3.5 py-2 rounded-xl font-bold ${filtroTiempoGastos === t.id ? 'bg-purple-600 text-white' : 'bg-slate-950 text-slate-400 border border-slate-800'}`}
                            >
                              {t.label}
                            </button>
                          ))}
                        </div>
                        <div className="text-right">
                          <span className="text-xs text-slate-400 mr-2">Total filtrado:</span>
                          <span className="text-lg font-black text-rose-400">{fmtMoney(totalFiltradoUSD)} ({fmtMoney(totalFiltradoUSD, 'ARS')})</span>
                        </div>

          {modalEditarSaldoBruno && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const cCongelado = congelarMonto(formSaldoBruno.monto, formSaldoBruno.moneda);
                if (formSaldoBruno.modo === 'establecer') {
                  setSaldoInicialBruno(cCongelado.monto_usd);
                } else if (formSaldoBruno.modo === 'sumar') {
                  setSaldoInicialBruno(saldoInicialBruno + cCongelado.monto_usd);
                }
                setModalEditarSaldoBruno(false);
                setFormSaldoBruno({ ...formSaldoBruno, monto: '' });
              }} className="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-md w-full space-y-4 text-xs">
                <h3 className="font-bold text-white text-lg">Actualizar Dinero en Banco / Caja Personal</h3>
                <select value={formSaldoBruno.modo} onChange={e => setFormSaldoBruno({...formSaldoBruno, modo: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white font-bold">
                  <option value="establecer">Establecer saldo total fijo</option>
                  <option value="sumar">Sumar dinero al saldo actual</option>
                </select>
                <div className="flex gap-1.5">
                  <input type="number" step="any" required placeholder="Monto..." value={formSaldoBruno.monto} onChange={e => setFormSaldoBruno({...formSaldoBruno, monto: e.target.value})} className="w-2/3 bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white font-mono" />
                  <select value={formSaldoBruno.moneda} onChange={e => setFormSaldoBruno({...formSaldoBruno, moneda: e.target.value})} className="w-1/3 bg-slate-950 border border-purple-500 rounded-xl px-2 py-2.5 text-white font-bold">
                    <option value="ARS">ARS ($)</option>
                    <option value="USD">USD ($)</option>
                  </select>
                </div>
                <ConversionPreview monto={formSaldoBruno.monto} moneda={formSaldoBruno.moneda} cotizacion={cotizacionDolar} />
                <div className="flex gap-2 pt-2">
                  <button type="submit" className="flex-1 bg-purple-600 text-white font-bold py-2.5 rounded-xl">Guardar Saldo</button>
                  <button type="button" onClick={() => setModalEditarSaldoBruno(false)} className="bg-slate-800 text-slate-300 font-bold px-4 py-2.5 rounded-xl">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {/* 5. MODAL ACTUALIZAR COTIZACIÓN DEL DÓLAR */}
          {modalDolar && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl p-7 max-w-sm w-full space-y-4">
                <h3 className="font-extrabold text-white text-lg text-center">Cotización del Dólar Hoy</h3>
                <p className="text-[11px] text-slate-400 text-center">
                  Cambiar la cotización solo aplica para las operaciones que cargues a partir de ahora. Los registros anteriores mantienen su cotización histórica intacta.
                </p>
                <input
                  type="number"
                  step="any"
                  value={nuevaCotizacionInput}
                  onChange={e => setNuevaCotizacionInput(e.target.value)}
                  placeholder={cotizacionDolar}
                  className="w-full bg-slate-950 border border-emerald-500 rounded-2xl px-4 py-3 text-white font-mono text-2xl text-center font-black"
                />
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      const val = parseFloat(nuevaCotizacionInput);
                      if (!isNaN(val) && val > 0) {
                        setCotizacionDolar(val);
                        setFechaUltimaCotizacion(new Date().toISOString());
                        registrarLog('Finanzas', 'Cambio Cotización USD', `Dólar actualizado a $${val} ARS`);
                        setModalDolar(false);
                        setNuevaCotizacionInput('');
                      }
                    }}
                    className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs"
                  >
                    Guardar Cotización
                  </button>
                  <button onClick={() => setModalDolar(false)} className="bg-slate-800 text-slate-300 font-bold px-5 py-3 rounded-xl text-xs">
                    Cerrar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 6. MODAL ORDEN DE SERVICIO IMPRIMIBLE / PDF */}
          {reciboModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <div className="bg-white text-slate-900 rounded-2xl p-7 max-w-md w-full space-y-4" id="printable-receipt">
                <div className="text-center border-b border-slate-300 pb-3">
                  <h2 className="font-black text-2xl tracking-tight">ICONNECTURE</h2>
                  <p className="text-xs text-slate-600 font-semibold">Comprobante de Recepción • Servicio Técnico</p>
                </div>
                <div className="text-xs space-y-1.5">
                  <p><strong>N° de Orden:</strong> #ORD-{String(reciboModal.id).slice(-4)}</p>
                  <p><strong>Fecha de Ingreso:</strong> {new Date(reciboModal.fecha_ingreso).toLocaleString()}</p>
                  <p><strong>Cliente:</strong> {reciboModal.cliente_nombre}</p>
                  <p><strong>Teléfono:</strong> {reciboModal.cliente_telefono} {reciboModal.cliente_telefono_alt !== 'N/A' ? `/ Alt: ${reciboModal.cliente_telefono_alt}` : ''}</p>
                  <p><strong>Equipo:</strong> {reciboModal.equipo_modelo}</p>
                  <p><strong>IMEI / Serie:</strong> {reciboModal.imei_serie || 'N/A'}</p>
                  <p><strong>Estado Físico de Ingreso:</strong> {reciboModal.estado_fisico}</p>
                  <p><strong>Trabajo / Falla Declarada:</strong> {reciboModal.falla_declarada}</p>
                  {reciboModal.presupuesto_usd > 0 && (
                    <p><strong>Presupuesto Estimado:</strong> {fmtHistorico(reciboModal)}</p>
                  )}
                </div>
                <div className="pt-6 border-t border-slate-300 text-[10px] text-slate-500 text-center">
                  Firma de conformidad del cliente al ingresar el equipo
                </div>
                <div className="flex justify-end gap-2 no-print pt-3">
                  <button onClick={() => window.print()} className="bg-purple-600 text-white text-xs px-4 py-2 rounded-xl font-bold">
                    <i className="fa-solid fa-print mr-1"></i> Imprimir / Guardar PDF
                  </button>
                  <button onClick={() => setReciboModal(null)} className="bg-slate-200 text-slate-800 text-xs px-4 py-2 rounded-xl font-bold">
                    Cerrar
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
