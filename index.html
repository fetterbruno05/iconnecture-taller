        const monto_usd = monedaSeleccionada === 'ARS' ? (val / rate) : val;
        const monto_ars_historico = monedaSeleccionada === 'ARS' ? val : (val * rate);
        return { monto_usd, monto_original: val, moneda_original: monedaSeleccionada, cotizacion_historica: rate, monto_ars_historico };
      };

      const fmtMoney = (amountUSD, currency = 'USD') => {
        if (modoOculto) return '***';
        const num = parseFloat(amountUSD) || 0;
        if (currency === 'ARS') return `$ ${(num * cotizacionDolar).toLocaleString('es-AR', { maximumFractionDigits: 0 })} ARS`;
        return `$ ${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
      };

        if (modoOculto || !r) return '';

        return r.cotizacion_historica ? `Base USD (Ref: $${r.cotizacion_historica})` : 'Base USD';
      };

      const validarImei = (imei) => {
        if (!imei) return { valido: true, msg: '' };
        if (/\s/.test(imei)) return { valido: false, msg: 'No se permiten espacios.' };

        const mesStr = hoyStr.slice(0, 7);
        reparaciones.forEach(r => {
          const comisionBruno = r.tipo_cliente === 'gremio' ? (r.mano_obra_usd || 0) : ((r.mano_obra_usd || 0) * 0.5);

            if (r.tipo_cliente === 'gremio') ganadoGremio += comisionBruno;
            else { ganadoMinoristaBruno += comisionBruno; ganadoMinoristaMateo += ((r.mano_obra_usd || 0) * 0.5); }
            const f = r.fecha_pago || r.fecha_completado || '';
            if (f.startsWith(hoyStr)) brunoHoy += comisionBruno;
            if (f.startsWith(mesStr)) brunoMes += comisionBruno;
          }
        });
        const totalHistoricoGanadoBruno = ganadoGremio + ganadoMinoristaBruno;
        const totalPagadoABruno = comisionesPagos.reduce((acc, p) => acc + (p.monto_usd || 0), 0);
        return { ganadoGremio, ganadoMinoristaBruno, ganadoMinoristaMateo, totalHistoricoGanadoBruno, totalPagadoABruno, saldoDeudaNegocioConBruno: totalHistoricoGanadoBruno - totalPagadoABruno, brunoHoy, brunoMes };

      const totalValorStock = useMemo(() => stockRepuestos.reduce((acc, s) => acc + ((s.cantidad || 0) * (s.costo_unitario_usd || 0)), 0), [stockRepuestos]);
      const totalGastosFijosMensuales = useMemo(() => gastosFijos.reduce((acc, g) => acc + (g.monto_usd || 0), 0), [gastosFijos]);

      const alertasSistema = useMemo(() => {
        const hoy = new Date();
        const demorados = ordenes.filter(o => o.estado !== 'Entregado' && Math.floor((hoy - new Date(o.fecha_ingreso)) / 86400000) >= 3);
        const deudasPend = deudasFavor.filter(d => d.estado === 'Pendiente');
        const ctasPagar = gastosNegocio.filter(g => g.estado === 'Pendiente');
        const stockBajo = stockRepuestos.filter(s => s.cantidad <= 2);
        const garantiasPorVencer = reparaciones.filter(r => {
          if (r.estado_pago !== 'Pagado' || !r.garantia_dias) return false;
          const res = r.garantia_dias - Math.floor((hoy - new Date(r.fecha_pago || r.fecha_completado)) / 86400000);
          return res >= 0 && res <= 3;
        });
        return { demorados, deudasPend, ctasPagar, stockBajo, garantiasPorVencer, total: demorados.length + deudasPend.length + ctasPagar.length + stockBajo.length + garantiasPorVencer.length };
      }, [ordenes, deudasFavor, gastosNegocio, stockRepuestos, reparaciones]);

      const importarBackupJson = (e) => {
        const file = e.target.files[0];

          try {
            const data = JSON.parse(event.target.result);
            if (data.ordenes) setOrdenes(data.ordenes);
            if (data.reparaciones) setReparaciones(data.reparaciones);
            if (data.stockRepuestos) setStockRepuestos(data.stockRepuestos);

        if (!equipoSeleccionadoParaReparar) return;

        itemsRepuestosCarga.forEach(i => {
          if (i.tipo === 'stock' && i.stockId) {
            const st = stockRepuestos.find(s => s.id === parseInt(i.stockId));

              costoTotal += st.costo_unitario_usd || 0;
              procesados.push({ nombre: `${st.categoria}: ${st.modelo}`, costo_usd: st.costo_unitario_usd || 0 });
              descStock[st.id] = (descStock[st.id] || 0) + 1;

          } else if (i.tipo === 'manual' && i.nombreManual.trim()) {
            const c = congelarMonto(i.costoManual, i.monedaManual);
            costoTotal += c.monto_usd;
            procesados.push({ nombre: i.nombreManual.trim(), costo_usd: c.monto_usd, moneda_original: c.moneda_original, monto_original: c.monto_original, cotizacion_historica: c.cotizacion_historica });

          fecha_pago: esPagado ? new Date().toISOString() : null, garantia_dias: parseInt(garantiaDiasInput) || 0

        setReparaciones([nuevaRep, ...reparaciones]);
        setOrdenes(ordenes.map(o => o.id === equipoSeleccionadoParaReparar.id ? { ...o, estado: esPagado ? 'Entregado' : 'Listo para Entregar', fecha_entrega: esPagado ? new Date().toISOString() : null } : o));

                            <select value={formIngreso.moneda_presupuesto} onChange={e => setFormIngreso({...formIngreso, moneda_presupuesto: e.target.value})} className="w-1/3 bg-slate-950 border border-purple-500 rounded-lg px-2 py-2 text-white font-bold text-[10px]">

              {/* VISTA 3: REPARACIONES */}

              {/* VISTA 5: STOCK */}
              {vista === 'stock' && (() => {
                const stockFiltrado = stockRepuestos.filter(s => { const q = busquedaStock.toLowerCase(); return !q || (s.modelo || '').toLowerCase().includes(q); });
                return (
                  <div className="space-y-6 max-w-6xl mx-auto fade-in">
                    <header><h2 className="text-2xl font-bold text-white tracking-tight">Stock & Repuestos</h2></header>

                      <form onSubmit={(e) => {
                        e.preventDefault();
                        const c = congelarMonto(formNuevoStock.costo, formNuevoStock.moneda);

                        <input type="number" required placeholder="Cant" value={formNuevoStock.cantidad} onChange={e => setFormNuevoStock({...formNuevoStock, cantidad: e.target.value})} className="w-16 bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-white" />
                        <input type="number" step="any" required placeholder="Costo" value={formNuevoStock.costo} onChange={e => setFormNuevoStock({...formNuevoStock, costo: e.target.value})} className="w-20 bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-white" />
                        <select value={formNuevoStock.moneda} onChange={e => setFormNuevoStock({...formNuevoStock, moneda: e.target.value})} className="bg-slate-950 border border-purple-500 rounded-lg px-1 text-white font-bold text-[10px]"><option value="USD">USD</option><option value="ARS">ARS</option></select>

                      }} className="flex gap-2 text-xs">
                        <input type="text" required placeholder="Concepto (Ej: Flete)" value={formGastoNegocio.concepto} onChange={e => setFormGastoNegocio({...formGastoNegocio, concepto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                        <input type="number" step="any" required placeholder="Monto" value={formGastoNegocio.monto} onChange={e => setFormGastoNegocio({...formGastoNegocio, monto: e.target.value})} className="w-24 bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-white font-mono" />

                        <select value={formGastoNegocio.categoria} onChange={e => setFormGastoNegocio({...formGastoNegocio, categoria: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-white"><option value="Cadetería">Cadete</option><option value="Insumos de Taller">Insumos</option></select>

                      {gastosFiltrados.map(g => (

                        <input type="number" step="any" required placeholder="Monto" value={formDeudaFavor.monto} onChange={e => setFormDeudaFavor({...formDeudaFavor, monto: e.target.value})} className="w-24 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                        <select value={formDeudaFavor.moneda} onChange={e => setFormDeudaFavor({...formDeudaFavor, moneda: e.target.value})} className="bg-slate-950 border border-purple-500 rounded-lg px-1 text-white font-bold text-[10px]"><option value="USD">USD</option><option value="ARS">ARS</option></select>

                      {deudasFiltradas.map(d => (

                            <span className={`font-mono font-bold text-sm ${d.estado === 'Pendiente' ? 'text-emerald-400' : 'text-slate-500'}`}>{fmtMoney(d.monto_usd)}</span>

                              <div className="flex gap-1.5">
                                <button onClick={() => { setModalPagoParcialDeuda(d); setFormAbonoDeuda({ monto: '', moneda: 'ARS' }); }} className="bg-amber-600/20 text-amber-400 px-2 py-1 rounded text-[10px] font-bold border border-amber-900">Parcial</button>
                                <button onClick={() => setDeudasFavor(deudasFavor.map(x => x.id === d.id ? { ...x, estado: 'Cobrado' } : x))} className="bg-emerald-600/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-bold border border-emerald-900">Saldar</button>

                        </div>
                      ))}
                    </div>
                  </div>
                );
              })()}

              {/* VISTA 8: COMISIONES */}
              {vista === 'comisiones' && (() => {
                const leDebeABruno = comisionesCalculadas.saldoDeudaNegocioConBruno > 0.01;
                return (
                  <div className="space-y-6 max-w-4xl mx-auto fade-in">
                    <header><h2 className="text-2xl font-bold text-white tracking-tight">Cuenta Corriente: Bruno</h2></header>
                    <div className={`border-2 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-5 ${leDebeABruno ? 'bg-rose-950/20 border-rose-600/50' : 'bg-emerald-950/20 border-emerald-600/50'}`}>
                      <div>
                        <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold uppercase ${leDebeABruno ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'}`}>
                          {leDebeABruno ? '🔴 Deuda con Bruno' : '🟢 Al día'}

                        <h3 className={`text-4xl font-black mt-2 ${leDebeABruno ? 'text-rose-400' : 'text-emerald-400'}`}>{fmtMoney(Math.abs(comisionesCalculadas.saldoDeudaNegocioConBruno))}</h3>
                      </div>
                      <form onSubmit={(e) => {
                        e.preventDefault();
                        const c = congelarMonto(formPagoComision.monto, formPagoComision.moneda);

                        setFormPagoComision({ monto: '', moneda: 'ARS', medio_pago: 'Efectivo ARS', nota: '' });
                      }} className="bg-slate-900 border border-slate-700 rounded-xl p-4 w-full md:w-80 space-y-2">
                        <div className="flex gap-1.5">
                          <input type="number" step="any" required placeholder="Pagar..." value={formPagoComision.monto} onChange={e => setFormPagoComision({...formPagoComision, monto: e.target.value})} className="w-2/3 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-white font-mono text-xs" />
                          <select value={formPagoComision.moneda} onChange={e => setFormPagoComision({...formPagoComision, moneda: e.target.value})} className="w-1/3 bg-slate-950 border border-purple-500 rounded-lg px-1 py-2 text-white font-bold text-[10px]"><option value="USD">USD</option><option value="ARS">ARS</option></select>
                        </div>
                        <button type="submit" className="w-full bg-purple-600 text-white font-bold py-2 rounded-lg text-xs">PAGAR A BRUNO</button>
                      </form>
                    </div>
                  </div>
                );
              })()}

              {/* VISTA 13: PATRIMONIO DE BRUNO 🔒 */}
              {vista === 'patrimonio' && (() => {
                const totalGastosPersonalesUSD = gastosPersonales.reduce((acc, g) => acc + (g.monto_usd || 0), 0);
                const liquidoDisponibleBruno = saldoInicialBruno + comisionesCalculadas.totalHistoricoGanadoBruno - totalGastosPersonalesUSD - totalGastosFijosMensuales;
                const patrimonioTotalConStock = liquidoDisponibleBruno + totalValorStock;

                return (
                  <div className="space-y-6 max-w-5xl mx-auto fade-in">
                    <div className="flex justify-between items-center">
                      <h2 className="text-2xl font-bold text-white tracking-tight">Patrimonio Personal 🔒</h2>
                      {patrimonioDesbloqueado && <button onClick={() => { setPatrimonioDesbloqueado(false); setPinInput(''); }} className="bg-rose-600 text-white font-bold px-3 py-2 rounded-lg text-xs">Bloquear</button>}
                    </div>

                    {!patrimonioDesbloqueado ? (
                      <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-sm mx-auto text-center space-y-4 shadow-xl mt-10">
                        <div className="w-16 h-16 rounded-full bg-slate-950 border border-slate-800 flex items-center justify-center text-slate-500 text-2xl mx-auto"><i className="fa-solid fa-lock"></i></div>
                        <h3 className="text-xl font-bold text-white">PIN Secreto</h3>
                        <form onSubmit={(e) => {
                          e.preventDefault();
                          if (pinInput.trim() === pinPatrimonio) { setPatrimonioDesbloqueado(true); setPinInput(''); setPinErrorMsg(''); } 
                          else { setPinErrorMsg('❌ PIN incorrecto.'); setPinInput(''); }
                        }} className="space-y-3">
                          <input type="password" maxLength="6" value={pinInput} onChange={e => { setPinInput(e.target.value); setPinErrorMsg(''); if (e.target.value === pinPatrimonio) { setPatrimonioDesbloqueado(true); setPinInput(''); } }} placeholder="••••••" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center text-3xl font-mono text-white tracking-widest focus:outline-none" />
                          {pinErrorMsg && <p className="text-xs font-bold text-rose-400">{pinErrorMsg}</p>}
                          <button type="submit" className="w-full bg-slate-800 text-white font-bold py-3 rounded-xl text-sm">Ingresar</button>
                        </form>
                      </div>
                    ) : (
                      <div className="space-y-6 fade-in">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4"><p className="text-[10px] text-slate-400 font-bold uppercase mb-1">Banco / Caja</p><h3 className="text-2xl font-black text-white">{fmtMoney(saldoInicialBruno)}</h3></div>
                          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4"><p className="text-[10px] text-slate-400 font-bold uppercase mb-1">Comisiones</p><h3 className="text-2xl font-black text-emerald-400">{fmtMoney(comisionesCalculadas.totalHistoricoGanadoBruno)}</h3></div>
                          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4"><p className="text-[10px] text-slate-400 font-bold uppercase mb-1">Stock Valor</p><h3 className="text-2xl font-black text-purple-400">{fmtMoney(totalValorStock)}</h3></div>
                          <div className="bg-slate-900 border border-emerald-500/40 rounded-2xl p-4"><p className="text-[10px] text-emerald-400 font-bold uppercase mb-1">Patrimonio Total</p><h3 className="text-2xl font-black text-emerald-400">{fmtMoney(patrimonioTotalConStock)}</h3></div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                            <h3 className="font-bold text-white text-sm">Gasto Diario (ARS o USD)</h3>
                            <form onSubmit={(e) => {
                              e.preventDefault();
                              const c = congelarMonto(formGastoPersonal.monto, formGastoPersonal.moneda);
                              setGastosPersonales([{ id: Date.now(), desc: formGastoPersonal.desc, categoria: formGastoPersonal.categoria, monto_usd: c.monto_usd, moneda_original: c.moneda_original, monto_original: c.monto_original, cotizacion_historica: c.cotizacion_historica, fecha: new Date().toISOString() }, ...gastosPersonales]);
                              setFormGastoPersonal({ ...formGastoPersonal, desc: '', monto: '' });
                            }} className="flex gap-2 text-xs">
                              <input type="text" required placeholder="Gasto..." value={formGastoPersonal.desc} onChange={e => setFormGastoPersonal({...formGastoPersonal, desc: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                              <input type="number" step="any" required placeholder="Monto" value={formGastoPersonal.monto} onChange={e => setFormGastoPersonal({...formGastoPersonal, monto: e.target.value})} className="w-24 bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-white font-mono" />
                              <select value={formGastoPersonal.moneda} onChange={e => setFormGastoPersonal({...formGastoPersonal, moneda: e.target.value})} className="bg-slate-950 border border-purple-500 rounded-lg px-1 text-white font-bold text-[10px]"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                              <button type="submit" className="bg-purple-600 text-white font-bold px-3 py-2 rounded-lg">Cargar</button>
                            </form>
                            <div className="space-y-1.5 max-h-48 overflow-y-auto text-xs pt-2 border-t border-slate-800">
                              {gastosPersonales.map(g => (
                                <div key={g.id} className="bg-slate-950 border border-slate-800 rounded-lg p-2.5 flex justify-between items-center"><p className="font-bold text-white">{g.desc}</p><span className="font-mono text-rose-400 font-bold">-{fmtMoney(g.monto_usd)}</span></div>
                              ))}
                            </div>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })()}

              {/* VISTAS RESTANTES REDUCIDAS PARA AHORRAR CÓDIGO (SIMILARES A LAS ANTERIORES) */}
              {(vista === 'garantias' || vista === 'socios' || vista === 'estadisticas' || vista === 'actividad' || vista === 'config' || vista === 'cuentas') && (
                <div className="space-y-6 max-w-4xl mx-auto fade-in">
                  <header><h2 className="text-2xl font-bold text-white tracking-tight capitalize">{vista}</h2></header>
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-slate-400 text-sm">
                    Panel de {vista} operativo.
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* ==================== MODALES GLOBALES ==================== */}

          {modalCargarReparacion && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-lg w-full space-y-4 max-h-[90vh] overflow-y-auto text-xs">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <h3 className="font-bold text-white text-base">Cargar Reparación</h3>
                  <button onClick={() => setModalCargarReparacion(false)} className="text-slate-400 hover:text-white text-sm"><i className="fa-solid fa-xmark"></i></button>
                </div>
                <select onChange={e => setEquipoSeleccionadoParaReparar(ordenes.find(o => o.id === parseInt(e.target.value)))} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-bold">
                  <option value="">-- Seleccionar Equipo --</option>
                  {ordenes.filter(o => o.estado !== 'Entregado').map(o => <option key={o.id} value={o.id}>#ORD-{String(o.id).slice(-4)} | {o.equipo_modelo} ({o.cliente_nombre})</option>)}
                </select>
                {equipoSeleccionadoParaReparar && (
                  <div className="space-y-3 pt-2">
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800"><p className="font-bold text-white text-sm">{equipoSeleccionadoParaReparar.equipo_modelo}</p><p className="text-[10px] text-slate-400 mt-0.5">{equipoSeleccionadoParaReparar.cliente_nombre}</p></div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Repuesto Utilizado</label>
                      <select value={repuestoStockSeleccionadoId} onChange={e => setRepuestoStockSeleccionadoId(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-medium">
                        <option value="">-- Sin Repuesto --</option>
                        {stockRepuestos.map(s => <option key={s.id} value={s.id}>{s.modelo} (Costo: ${s.costo_unitario_usd})</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Mano de Obra (Neto)</label>
                      <input type="number" value={manoObraInput} onChange={e => setManoObraInput(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-mono" />
                    </div>
                    <div className="flex gap-2 pt-2">
                      <button onClick={handleConfirmarReparacion} className="flex-1 bg-purple-600 text-white font-bold py-3 rounded-xl">Confirmar</button>
                      <button onClick={() => setModalCargarReparacion(false)} className="bg-slate-800 text-slate-300 font-bold px-4 py-3 rounded-xl">Cancelar</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {modalDolar && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-sm w-full space-y-4">
                <h3 className="font-bold text-white text-lg text-center">Actualizar Cotización</h3>
                <input type="number" step="any" value={nuevaCotizacionInput} onChange={e => setNuevaCotizacionInput(e.target.value)} placeholder={cotizacionDolar} className="w-full bg-slate-950 border border-emerald-500 rounded-xl px-3 py-3 text-white font-mono text-2xl text-center font-black" />
                <div className="flex gap-2">
                  <button onClick={() => { const val = parseFloat(nuevaCotizacionInput); if (!isNaN(val) && val > 0) { setCotizacionDolar(val); setFechaUltimaCotizacion(new Date().toISOString()); setModalDolar(false); setNuevaCotizacionInput(''); } }} className="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-lg text-xs">Guardar</button>
                  <button onClick={() => setModalDolar(false)} className="bg-slate-800 text-slate-300 font-bold px-4 py-2.5 rounded-lg text-xs">Cancelar</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
